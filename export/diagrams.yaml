- name: "Update and Maintenance KPIs"
  guid: "{83DDBBEF-FC8A-46c2-85D0-859C6B951CAF}"
  package: "NAP Reference Architecture/Supplements/Specifications and Recommendations/KPI Framework/Update and Maintenance KPIs"
  note: |
    Metadata maintenance frequency” assesses the frequency on which metadata are maintained and updated. This is relevant since metadata specifications are often changed due to stakeholder needs and market developments, and these changes should be reflected on the NAPs to ensure data discoverability. The KPI’s possible values comprise difference options for the frequency of maintenance, where higher values correspond to higher frequency.
  elements:
    - "KPI 4.1 IT services"
    - "KPI 4.2 Link checking frequency"
    - "KPI 4.4 Metadata maintenance frequency"
    - "KPI 4.5 Data (content) maintenance"
