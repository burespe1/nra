      - "Association «OUT» → fnap.cc-data_request"  # {A9C29A51-6961-4d68-9FEE-FF1FDA197CD4} → {AFB3FDE3-5682-463a-A966-CEF77741C6A9}
      - "Dependency → Privacy agreement (CC to NO) and general terms and conditions"  # {EAF4EAC0-257D-4aa5-BE60-B3D801141DA6} → {AF555DF2-4535-42f6-993A-5BE72947BD12}
      - "Usage → Data to Content Consumer"  # {31AF9124-F69F-4487-9088-36D912DF380D} → {B82B3A07-B464-4905-B517-04B74942E5AA}
      - "Usage → Metadata to Content Consumer"  # {F96A7DCC-CD24-4a8d-BB10-E2BA7E92C2F4} → {C25F8BCA-DCD4-4894-956E-40D0218D3ACA}
      - "Usage → Support of Content Consumer"  # {892D855E-FA9A-490c-9AB5-F1F939885A6C} → {0B43348A-F713-49fe-A684-A88D53A58D67}
  - name: "NAP Content Provider"
    guid: "{7F7723C2-1334-495d-8C3F-1CA486951DD2}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    keywords: "Terminator"
    status: "Proposed"
    order: 0
    tags:
      "status": "copy"
    note: |
      The generic terminator role of the NAP Content Provider represents any provider of traffic and transport data.
      The NAP Content Provider describes traffic and transport data with meta-data on the NAP (stored in D3.15 NAP Meta-Data). Information about the Content Provider, such as contact details, kept in D3.17 NAP Content Providers.
      Content Providers are public and private road operators, road authorities, service providers, transport authorities, transport operators, infrastructure managers, and transport on-demand service providers. The obligations to make traffic and transport data accessible via the NAP depend on the type of data according to the ITS Directive and its respective delegated regulations (see Content Provider Actor)
      
      Key issue: Provide and publish content (which the content provider has the legal rights to publish); collect content.
      Area of responsibility: Provide timely and accurate traffic and transport data.
      Tasks: Provide content relevant to the ITS domain and according to contracts with the NAP and content consumers
      Mnemonic: nap.cp
    links:
      - "Aggregation «component of» → NAP Actors"  # {76C6E1CB-C2D4-497d-9F52-2528B02B06E6} → {E89EDD6C-D939-4b97-AB60-AAD3FA5FE237}
