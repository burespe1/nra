package: "NAP Reference Architecture/NAP Functional View/Terminators"
guid: "{AFF7C293-88E9-49fb-BAAC-1A142E4AA9AD}"
alias: "Terminators"
version: "1.0"
note: |
  This chapter defines terminators for both NAP types, Metadata Directory and Data Platform.
elements:
  - name: "Data Provision System"
    guid: "{13412496-2C40-428c-B961-F0F374D991C8}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    keywords: "Terminator"
    status: "Proposed"
    order: 0
    note: |
      The generic terminator role Data Provision System represents any interested entity in traffic, travel data storage. The Data Provision System can request storing traffic and travel data in the NAP Data store. Therefore, Function F3.6.8 Manage Data Input offers an access interface for machine-to-machine data upload. Authorisation is necessary, the Data Provision System must use credentials obtained by Content Provider. When registering the Content Provider will obtain credentials and / or to set up a machine account from which data are pushed.
      
      Key issue: Request to store data at NAP.
      Area of responsibility: Be compliant with the agreement with content provider
      Tasks: Upload content
      Mnemonic: nap.dps
    links:
      - "Association «IN» → fnap.dps-data_&_authorisation_credentials"  # {D3794913-14F7-42bd-A380-0435A43689FD} → {8EC048EF-B06E-497b-A29E-EFB18412560E}
      - "Usage → Data from Data Provision System"  # {B1A95FFA-0D99-4a31-B303-AECD7D9D2CF0} → {1DE55835-B3EB-461f-BAF4-61B9F635EDBD}
  - name: "Data Requesting System"
    guid: "{6CBF0F02-2909-4086-A608-C5EA1E42A9F6}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    keywords: "Terminator"
    status: "Proposed"
    order: 0
    note: |
      The generic terminator role Data Requesting System represents any interested entity in traffic, travel data. The Data Requesting System can request traffic and travel data available in the NAP Data store. Therefore, Function F3.6.9 Manage NAP Data Retrieval offers a data distribution interface for machine-to-machine data retrieval.
      In some cases, especially when the data are pushed to the Content Consumer systems and / or authorisation is necessary the Data Requesting System must use credentials obtained by Content Consumer. When registering the Content Consumer will obtain credentials and / or to set up a machine account to which data are pushed.
      
      Key issue: Request data stored at NAP.
      Area of responsibility: Be compliant with the agreement with content provider
      Tasks: Receive content
      Mnemonic: nap.drs
    links:
      - "Association «IN» → fnap.drs-data_request"  # {9C30B785-03D6-450c-8050-85B0D468ECBE} → {A57EDCA4-5B76-4808-9C68-5DDF06E70C93}
      - "Usage → Data to Data Requesting System"  # {BB3B5C7B-484F-410e-9F7B-1E621FEFBD8C} → {F785EA75-B3BD-4be6-9374-06DC89A98B73}
  - name: "Metadata Provision System"
    guid: "{0DEEF50F-C3BA-4005-A27B-57A30C4C009C}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    keywords: "Terminator"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      The generic terminator role Metadata Provision System represents any compatible entity in metadata storage.
      The Metadata Provision System can request storing metadata in the NAP Metadata store. Therefore, Function Metadata Management Module offers an access interface for machine-to-machine data upload. Authorisation is necessary, the Metadata Provision System must use credentials obtained by Content Provider. When registering the Content Provider will obtain credentials and / or to set up a machine account from which data are pushed.
      
      Key issue: Request to store metadata at NAP.
      Area of responsibility: Be compliant with the agreement with content provider
      Tasks: Upload metadata
      Mnemonic: nap.mdps
    links:
      - "Association «IN» → ps_metadata & data source"  # {3DEA5F32-429E-4959-A9D1-4BE9D3BC6E5A} → {36B4BBF5-5B68-4d38-AF28-7669EFF35137}
      - "Usage → Metadata from Metadata Provision System"  # {F9F3EF83-D101-4772-BEA5-D749FBE6652A} → {A75E9CBB-5B13-4249-B1EE-F51C9EC0BD9D}
  - name: "Metadata Requesting System"
    guid: "{DEB4AC48-7332-4f57-99D5-79169FCA6F1F}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    keywords: "Terminator"
    status: "Proposed"
    order: 0
    note: |
      The generic terminator role Metadata Requesting System represents any interested entity in traffic and transport metadata dissemination. The Metadata Requesting System can request information stored in the NAP Metadata store in a standardized format (mobilityDCAT-AP) to incorporate said data into its information services (i.e. metadata harvesting). Therefore, Function F3.6.4 Manage NAP Metadata Retrieval offers a data distribution interface for machine-to-machine data retrieval.
      
      Key issue: Request metadata stored at NAP.
      Area of responsibility: Be compliant with the agreement with the NAP operator
      Tasks: Receive information about the content in a standardized manner, i.e. metadata
      Mnemonic: nap.mdrs
    links:
      - "Association «IN» → fnap.mdrs-metadata_request"  # {0DE4E9BC-F952-4f2e-BF6D-9800A6BD46B9} → {1F8479D1-6CEC-42fd-8CD2-79F9AD3334A4}
      - "Usage → Metadata to Requesting System"  # {083FB2AB-4B93-40e3-9A01-61F9FCDC0A9B} → {5681386B-AB60-4a6c-B51B-4BD4F745FDD5}
  - name: "NAP Content Consumer"
    guid: "{6713B765-606E-4208-8FE8-99B0D50851A5}"
    type: "Actor"
    stereotype: "FRAME_Terminator"
    keywords: "Terminator"
    status: "Proposed"
    order: 0
    tags:
      "status": "copy"
    note: |
      The generic terminator role of the NAP Content Consumer represents any interested entity in traffic and transport data. The Content Consumer can find available data via the NAP. Therefore, Function F3.6.4 Provide Access for NAP Meta-Data Retrieval offers an interface (typically a graphical user interface freely accessible via the Internet) to search the meta-data in D3.15 NAP Meta-Data
      
      Key issue: Request high-quality services; provide feedback about relevant content
      Area of responsibility: Be compliant with the agreement with the NAP content provider
      Tasks: Receive content
      Mnemonic: nap.cc
    links:
      - "Aggregation «component of» → NAP Actors"  # {C315C920-21DC-4a44-99FA-FB029F697E0F} → {E89EDD6C-D939-4b97-AB60-AAD3FA5FE237}
