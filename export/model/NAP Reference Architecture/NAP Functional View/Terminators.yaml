      - "Usage → User Management of Content Provider"  # {2076F5E8-4744-4848-AB93-7DA41C848451} → {C5A68539-7FA7-4245-9B3A-F55B6668B579}
  - name: "NAP Actors"
    guid: "{E89EDD6C-D939-4b97-AB60-AAD3FA5FE237}"
    type: "Class"
    stereotype: "FRAME_Terminator"
    alias: "nap"
    keywords: "Terminator"
    status: "Proposed"
    version: "5.0"
    order: 12
    tags:
      "status": "copy"
    note: |
      This Terminator shall represent the actors that participate in the National Access Point (NAP) ITS Service. This ITS Service provides a mechanism that enables organisations to access data available from other ITS Services. It shall consist of the following Terminators.
      
      	- NAP Content Provider
      	- NAP Content Consumer
      
      
      Mnemonic: nap
    links:
