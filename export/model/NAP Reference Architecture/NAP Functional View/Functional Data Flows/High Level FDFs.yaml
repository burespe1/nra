    status: "Validated"
    version: "5.0"
    order: 0
    tags:
      "status": "copy"
    note: |
      This data flow only appears in the Context Diagram and contains output to the NAP Actors Terminator. It contains data objects containing either confirmation that the Internet address from which other data objects about ITS Services are available has been recorded, or the result of aa request for access to these data objects.
