package: "NAP Reference Architecture/NAP Functional View/Functional Data Flows/High Level FDFs"
guid: "{8C254588-1E71-4453-A652-902E31A451C2}"
alias: "High Level Data Flows"
version: "1.0"
note: |
  High Level Functional Data Flows carry a specific data between two High Level Functions. They always have component Low Level Functional Data Flows.
elements:
  - name: "From NAP Actors"
    guid: "{C6FE2F39-008F-4811-AE0F-95EB671FFFD2}"
    type: "Interface"
    stereotype: "FRAME_High_Level_Data_Flow"
    keywords: "Functional Data Flow"
    status: "Validated"
    version: "5.0"
    order: 0
    tags:
      "status": "copy"
    note: |
      This data flow only appears in the Context Diagram and contains input from the NAP Actors Terminator. It contains data objects containing either the Internet address from which other data objects about ITS Services are available, or a request for access to these data objects.
  - name: "To NAP Actors"
    guid: "{98E4FDFE-8123-4b37-B03A-5DCCED4FE24B}"
