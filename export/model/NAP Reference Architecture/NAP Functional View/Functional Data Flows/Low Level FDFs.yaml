package: "NAP Reference Architecture/NAP Functional View/Functional Data Flows/Low Level FDFs"
guid: "{EFE16E45-75B8-44cb-B28B-7C9D80C71CB8}"
alias: "Low Level Data Flows"
version: "1.0"
note: |
  Low Level Functional Data Flows carry a specific data between two Low Level Functions.
elements:
  - name: "fnap.cc-data_request"
    guid: "{AFB3FDE3-5682-463a-A966-CEF77741C6A9}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "fnap.cc-data request"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It consists of inputs from the NAP Content Consumer containing data objects that provide request for retrieval of traffic or travel data stored in NAP Data store. Besides the identification of data to be retrieved the request must contain the authorisation credentials of the entity that is providing it, so that this can be checked to ensure that it is a registered entity with right to access the data.
      
      NOTE: authorisation credentials might be void if the data to be retrieved are freely available (i.e. open data)
    links:
      - "Association «OUT» → F3.6.9 Manage NAP Data Retrieval"  # {4E9669C2-3441-4011-8A80-6D5A9D94EACD} → {A3764B72-97E2-400c-81B8-C945964F9E0D}
      - "Association «served by» → Data to Content Consumer"  # {055EEE55-75FF-4ea9-B254-A079A4EAB380} → {B82B3A07-B464-4905-B517-04B74942E5AA}
  - name: "fnap.cc-registration_request"
    guid: "{7777AD14-8D53-466c-9949-22CFAB635676}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "fnap.cc-registration request"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It consists of inputs from the NAP Content Consumer containing data objects that provide a registration request of and information about a potential NAP Content Consumer which wants to register or a request with credentials of registered NAP Content Consumer for retrieval of its data upon a successful authorisation. (Details of the information about the NAP Content Consumer will be found in the description of the store of NAP Users).
      The registration request contains relevant information about the entity to be registered under NAP Content Consumer account, including identity information, licence terms approval, users, machines, and organization information.
    links:
      - "Association «OUT» → F3.6.2 Manage Registrations and Provide Authorisation Service"  # {DF01CF2E-45D8-4ece-AEB0-76AF75A9DC6B} → {15D991EA-63BC-40ac-936A-A0B8D3CBC28A}
      - "Association «served by» → Content Consumer Authorization and Registration"  # {7F0250BE-F47B-4294-916F-E2E203845F16} → {96C4145B-D427-423c-8272-54CE77DBDE7F}
  - name: "fnap.cp-data_&_authorisation_credentials"
    guid: "{60297FF0-CD09-4e8d-8221-0B0FF35E3239}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "fnap.cp-data & authorisation credentials"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It consists of inputs from the NAP Content Provider containing data objects that provide new or updated traffic or travel data to be loaded into the store of NAP Data store.
      Besides the data itself the request must contain the authorisation credentials of the entity that is providing it, so that this can be checked to ensure that it is a registered entity.
    links:
      - "Association «OUT» → F3.6.8 Manage Data Input"  # {FFA9A4AC-2EBE-4ac9-AB73-C95308EFA02E} → {5B4F357F-A164-4a3f-8909-C370F4C0615F}
      - "Association «served by» → Data from Content Provider"  # {B6E132A0-10E9-4903-B305-DA89BA508C1D} → {1F6F7D4C-BAFE-43db-AF7B-C8043CC6E31F}
  - name: "fnap.dps-data_&_authorisation_credentials"
    guid: "{8EC048EF-B06E-497b-A29E-EFB18412560E}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "fnap.dps-data & authorisation credentials"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It consists of inputs from the Data Provision System containing data objects that provide new or updated traffic or travel data to be loaded into the store of NAP Data store.
      Besides the data itself the request must contain the authorisation credentials of the entity that is providing it, so that this can be checked to ensure that it is a registered entity.
    links:
      - "Association «OUT» → F3.6.8 Manage Data Input"  # {80DFF1D8-EB15-475c-BABF-F1D938F42430} → {5B4F357F-A164-4a3f-8909-C370F4C0615F}
      - "Association «served by» → Data from Data Provision System"  # {04183198-439C-4e6f-9768-652A05C4EAAB} → {1DE55835-B3EB-461f-BAF4-61B9F635EDBD}
  - name: "fnap.drs-data_request"
    guid: "{A57EDCA4-5B76-4808-9C68-5DDF06E70C93}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "fnap.drs-data request"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It consists of inputs from the Data Requesting System containing data objects that provide request for retrieval of traffic or travel data stored in NAP Data store. Besides the identification of data to be retrieved the request must contain the authorisation credentials of the entity that is providing it, so that this can be checked to ensure that it is a registered entity with right to access the data.
      
      NOTE: authorisation credentials might be void if the data to be retrieved are freely available (i.e. open data)
    links:
      - "Association «OUT» → F3.6.9 Manage NAP Data Retrieval"  # {DDDCE02D-3683-48c9-9D43-3810BDC6E1AA} → {A3764B72-97E2-400c-81B8-C945964F9E0D}
      - "Association «served by» → Data to Data Requesting System"  # {685B00D7-24B0-4b23-B56D-37D05BE31717} → {F785EA75-B3BD-4be6-9374-06DC89A98B73}
  - name: "fnap.mdrs-metadata_request"
    guid: "{1F8479D1-6CEC-42fd-8CD2-79F9AD3334A4}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "fnap.mdrs-metadata request"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It consists of inputs from the Metadata Requesting System containing data objects that provide request for retrieval of information stored in NAP Metadata store as DCAT-AP records. The request shall contain keywords or any refining demand in at least one metadata element.
    links:
      - "Association «OUT» → F3.6.4 Manage Metadata Retrieval"  # {386CE389-A02F-44f0-B381-8E7194523F72} → {2F2393E9-9A59-4344-A2C0-207945E7F438}
      - "Association «served by» → Metadata to Requesting System"  # {0464C26F-B2C4-4768-B79F-DCF33AF90028} → {5681386B-AB60-4a6c-B51B-4BD4F745FDD5}
  - name: "mt_NAP_data_for_quality_check"
    guid: "{12DD5935-707F-445e-B70C-4401AE81022C}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data for quality check"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects with the traffic or travel information that has been retrieved from the store of NAP Data following a scheduled or triggered event. The data object also contains quality information that is to be updated after the quality check of the retrieved data content.
    links:
      - "Association «OUT» → F3.6.10 Provide Data Quality Checks"  # {D3C1BB19-1F57-496b-AB0B-EDC3C2CF52D9} → {D01EFD87-A3E1-4216-81D9-855530ECE1B9}
      - "Association «served by» → Data Quality Check"  # {10355195-A44C-4cc9-BF2E-83203A799B27} → {1587F034-1363-447d-8BFA-2234BA04649C}
  - name: "mt_NAP_data_mod_authorisation_request"
    guid: "{E20BF73E-7630-4235-9E13-54B7C5C78E46}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data mod authorisation request"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects that provide credentials of a NAP Content Provider or Data Providing System to be checked against the data stored in NAP Users data store to authorize the claimant to insert data records in the store of NAP Data.
    links:
      - "Association «OUT» → F3.6.2 Manage Registrations and Provide Authorisation Service"  # {E3A8F66A-780D-4102-BA0D-0C93F12A75C7} → {15D991EA-63BC-40ac-936A-A0B8D3CBC28A}
      - "Association «served by» → User and Data Management"  # {171765D4-D4D0-4258-B268-45C0C2D21570} → {5C212D22-87C8-423c-A4EE-D4FACC7598C7}
  - name: "mt_NAP_data_mod_authorisation_response"
    guid: "{310CD8FD-F1FA-4b44-A502-9A7D061FD2BE}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data mod authorisation response"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects that provide information about the validity of the authorisation credentials of a NAP Content Provider or Data Providing System that authorize the claimant to modify / insert data records in the store of NAP Data.
    links:
      - "Association «OUT» → F3.6.8 Manage Data Input"  # {8716D73F-ED24-4476-92F3-EE5C580E1C31} → {5B4F357F-A164-4a3f-8909-C370F4C0615F}
      - "Association «served by» → User and Data Management"  # {DFECA0E8-65DB-4c69-9475-E66C0BD6338C} → {5C212D22-87C8-423c-A4EE-D4FACC7598C7}
  - name: "mt_NAP_data_mod_request"
    guid: "{B7FC7C2F-C1AA-4bf8-82D4-0EA2370C6BC9}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data mod request"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects that provide either new data or updates to data that has been previously loaded into the store of NAP Data or a request for data objects to be retrieved. The updated data objects that are to be loaded into the store includes traffic or travel data objects and supporting metadata allowing linking the data object to information stored in NAP Metadata store and accessibility information by the NAP Content Consumers.
    links:
      - "Association «OUT» → F3.6.7 Manage NAP Data Repository"  # {AC24873C-E91B-4bb0-85B5-7B3E00BC7670} → {57AEF510-D710-4920-9CCE-96BE708F6AAC}
  - name: "mt_NAP_data_mod_response"
    guid: "{E340D2D2-B614-4c5f-BA76-FBD43E68CF5E}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data mod response"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects that provide information about the success of loading the newly provided or updated NAP Content Provider data into the store of NAP Data or provide data objects containing the NAP Data metadata (e.g. events associated with data access, quality information).
    links:
      - "Association «OUT» → F3.6.8 Manage Data Input"  # {74B3870A-C474-4b8f-9826-9EDA9679FFDF} → {5B4F357F-A164-4a3f-8909-C370F4C0615F}
  - name: "mt_NAP_data_quality_check_result"
    guid: "{8AE74C5A-125D-4ce5-ABD4-89818AAE054B}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data quality check result"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects created by Provide Data Quality Checks after checking quality of data that has been retrieved from the store of NAP Data following a scheduled or triggered event. The data is timestamp and success of failure (with number of errors found) of the checks and aggregated information i.e. average of the characteristic per time period.
    links:
      - "Association «OUT» → F3.6.7 Manage NAP Data Repository"  # {55650126-E0DB-4ac5-B876-DB7A98C1ACE4} → {57AEF510-D710-4920-9CCE-96BE708F6AAC}
      - "Association «served by» → Data Quality Check"  # {413E6097-09E7-47e0-961C-B710559B1E21} → {1587F034-1363-447d-8BFA-2234BA04649C}
  - name: "mt_NAP_data_read_authorisation_request"
    guid: "{D487FAFF-4F5B-4520-BC53-427580A77997}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data read authorisation request"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects that provide credentials of a NAP Content Consumer or Data Requesting System to be checked against the data stored in NAP Users data store to authorize the claimant to read data records from the store of NAP Data.
    links:
      - "Association «OUT» → F3.6.2 Manage Registrations and Provide Authorisation Service"  # {0E43ADCB-61C6-47bd-BA46-5656056AF66A} → {15D991EA-63BC-40ac-936A-A0B8D3CBC28A}
      - "Association «served by» → User and Data Management"  # {F4B34441-6B3C-4f41-9643-FCE3D49E9F5F} → {5C212D22-87C8-423c-A4EE-D4FACC7598C7}
  - name: "mt_NAP_data_read_authorisation_response"
    guid: "{C050FEDE-4276-4730-8B5C-0F605084BE69}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data read authorisation response"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects that provide information about the validity of the authorisation credentials of a NAP Content Consumer or Data Requesting System that authorize the claimant to read data records from the store of NAP Data.
    links:
      - "Association «OUT» → F3.6.9 Manage NAP Data Retrieval"  # {BCBBC565-46F2-4206-B505-E07592289844} → {A3764B72-97E2-400c-81B8-C945964F9E0D}
      - "Association «served by» → User and Data Management"  # {EE80C841-C4CC-43fc-BFC1-9BCBD963DD9C} → {5C212D22-87C8-423c-A4EE-D4FACC7598C7}
  - name: "mt_NAP_data_read_request"
    guid: "{50A2D529-AAC6-4908-919C-7838C607386A}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data read request"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains a request for identified data objects to be retrieved from the NAP Data store together with requestor identification. The data objects that are to be retrieved include traffic or travel data objects and supporting metadata information related to the identified data including last update timestamp and quality information.
    links:
      - "Association «OUT» → F3.6.7 Manage NAP Data Repository"  # {C96359DD-E655-4972-8768-DE2BBEE2027A} → {57AEF510-D710-4920-9CCE-96BE708F6AAC}
  - name: "mt_NAP_data_read_response"
    guid: "{3D6B17A5-0D0F-4944-9E8F-FB446B82FF2F}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP data read response"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects with traffic or travel information from the store of NAP Data following a previous request to retrieve data and last update timestamp and quality information.
    links:
      - "Association «OUT» → F3.6.9 Manage NAP Data Retrieval"  # {7B3316E7-CAFF-4b0a-A2B5-7FCE033F03ED} → {A3764B72-97E2-400c-81B8-C945964F9E0D}
  - name: "mt_NAP_metadata_for_data_check_and_store_request"
    guid: "{A65597A1-4E9A-40cc-9665-4640823B199F}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP metadata for data check and store request"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects that provide a request from Manage NAP Data Repository functionality for set of metadata related to NAP Data to be checked/stored/updated. The request shall contain keywords or any refining demand in at least one metadata element together with a request identifier.
    links:
      - "Association «OUT» → F3.6.1 Manage NAP Metadata Repository"  # {1BF7491B-4901-4b00-94E0-E6C69F2F33D6} → {28A2C553-2939-4542-B14B-8A13B25BC494}
      - "Association «served by» → Metadata and Data Management"  # {3775FAA1-F8AF-4a6d-8EAA-CC247098C0F2} → {8DE1FAAE-FC95-48f3-B1BD-F0F67A00B135}
  - name: "mt_NAP_metadata_for_data_check_and_store_response"
    guid: "{2FD69798-3950-48ea-B7F0-F52F39470F34}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP metadata for data check and store response"
    keywords: "Functional Data Flow"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      It contains data objects that provide items of NAP metadata which have been retrieved from the store of NAP Metadata following a previous request.
    links:
      - "Association «OUT» → F3.6.7 Manage NAP Data Repository"  # {A04DF5BC-9E29-4283-A9D5-D1D5B16FFF89} → {57AEF510-D710-4920-9CCE-96BE708F6AAC}
      - "Association «served by» → Metadata and Data Management"  # {0DA13C98-8147-4913-A23A-57B8FC743E16} → {8DE1FAAE-FC95-48f3-B1BD-F0F67A00B135}
  - name: "mt_NAP_metadata_for_quality_check"
    guid: "{EB72DA4A-A638-4946-B10F-21C536686F6C}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP metadata for quality check"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects with the metadata information that has been retrieved from the store of NAP Metadata following a scheduled or triggered event. The data object also contains quality information that is to be updated after the quality check of the retrieved metadata content.
    links:
      - "Association «OUT» → F3.6.6 Provide Metadata Quality Checks"  # {DF9A2717-EDF1-4dd6-9377-66EBBB6FC069} → {15BFF38A-05D9-4775-84C9-6604B0EEA3C6}
      - "Association «served by» → Metadata Quality Check"  # {AC0EAD90-F7E7-43b0-BAEB-ACE4507C2D01} → {4FB08435-DE36-46a7-B970-3E2B0A3CD452}
  - name: "mt_NAP_metadata_quality_check_result"
    guid: "{01233765-5DC4-4cf9-879E-4DC6961C9611}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_NAP metadata quality check result"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects created by Provide Metadata Quality Checks after checking quality of metadata that has been retrieved from the store of NAP Metadata following a scheduled or triggered event. The data is timestamp and success of failure (with number of errors found, level of service achieved) of the checks and overall aggregated summary. The checks follow the MQA and InQMS methodology, at minimum it is an availability of the urls provided in metadata.
    links:
      - "Association «OUT» → F3.6.1 Manage NAP Metadata Repository"  # {8C037344-6951-46d6-A395-8DC60B5CACE0} → {28A2C553-2939-4542-B14B-8A13B25BC494}
      - "Association «served by» → Metadata Quality Check"  # {07F09651-5EF2-4880-A07D-0876716BD997} → {4FB08435-DE36-46a7-B970-3E2B0A3CD452}
      - "Dependency «trace» → DF F3.6.6 -> F3.6.1"  # {55D4D71A-20F9-4d94-A771-EA7B7D32A49E} → {951B2EF4-AFFC-4d82-B5B7-8C1B38694805}
  - name: "mt_load_NAP_data"
    guid: "{38D2C47E-7C5D-4d8d-B7B5-05AFC34DF3CA}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_load NAP data"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects that provide either new data to be loaded into the store of NAP Data, or a request for data to be retrieved. The data that is to be loaded into the store consist of traffic of travel information (static or dynamic) which are made accessible by the NAP Content Provider. The required data objects are further elaborated in NAP Data store.
      Apart from real data content the information object loaded to data store shall contain data quality records and NAP Data event logs, Identification of the data and access information.
    links:
      - "Association «OUT» → D3.18 NAP Data"  # {49C39680-E7C7-4e18-9521-A7E634756BFF} → {B1156E38-B7ED-4dcd-BD87-C003C660A85A}
  - name: "mt_read_NAP_data"
    guid: "{30332204-58C2-432d-A2FE-1801EA8E123F}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    alias: "mt_read NAP data"
    keywords: "Functional Data Flow"
    status: "Proposed"
    order: 0
    note: |
      It contains data objects that provide data that has been retrieved from the store of NAP Data following a request. The data that has been read from the store contains the traffic or travel information content together with its metadata which are made accessible to authorised NAP Functionality.
      The required data objects are further elaborated in NAP Data store.
      Apart from real data content the information object retrieved from data store may contain data quality records and NAP Data event logs, Identification of the data and access information.
    links:
      - "Association «OUT» → F3.6.7 Manage NAP Data Repository"  # {B949B726-3979-4a11-A63E-319E677CC929} → {57AEF510-D710-4920-9CCE-96BE708F6AAC}
  - name: "ps_metadata & data source"
    guid: "{36B4BBF5-5B68-4d38-AF28-7669EFF35137}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    keywords: "Functional Data Flow"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    note: |
      It consists of inputs from the Metadata Provision System containing data objects that provide updated metadata of a catalogue record to be loaded into the store of NAP metadata. The required and optional elements of metadata can be found in a metadata catalogue: https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/index.html. The API for metadata provision must allow for insert, modification and delete of any metadata of the Content Provider.
      Besides the metadata itself the request must contain the authorisation credentials of the entity that is providing it, so that this can be checked to ensure that it is a registered entity.
    links:
      - "Association «OUT» → F3.6.3 Manage Content Providers Metadata"  # {9333A692-6200-4c81-9F2F-CAD1B8971F45} → {E8D1212C-A787-4da1-A4EB-B4E1896ABD19}
      - "Association «served by» → Metadata from Metadata Provision System"  # {3AF8FEF1-FCE5-4fef-94BD-18BBBC28F205} → {A75E9CBB-5B13-4249-B1EE-F51C9EC0BD9D}
      - "Dependency «trace» → DF F3.6.3 -> MPS"  # {D2A379B7-220F-45b5-B914-7E23A0E75179} → {C546D374-B0B8-409e-86B4-A8A3F97C8268}
  - name: "ps_metadata & success report"
    guid: "{1B63FEAE-619D-4b2e-B48D-663FEAC9BE9D}"
    type: "Interface"
    stereotype: "FRAME_Low_Level_Data_Flow"
    keywords: "Functional Data Flow"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    note: |
      It contains outputs to the Metadata Provision System that informs about the status of the requested action (metadata inset, modification or deletion). The response can be either “successful” or “failed”, which must be accompanied by a reason for the “failure”.
    links:
