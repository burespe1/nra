    note: |
      This Data Store shall be used within the Manage Traffic Functional Area. It shall contain information objects that provide metadata about traffic, travel data and any other relevant information. The required and optional elements of metadata have been harmonised and can be found in a metadata catalogue: https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/index.html.
      
      Metadata is structured in the data store to:
       (1) describe data provider, where each data provider may list multiple of
       (2) data sets or services and each of such can be provided by more than one way by specifying its
       (3) distribution parameters.
      
      The content and the structure are governed by the mobilityDCAT-AP.
      Further on the data store also contains:
       (4) log of events with respect of metadata creation, update and
       (5) quality information per data set.
