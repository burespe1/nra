    note: |
      This Data Store shall be used within the Manage Traffic Functional Area. It shall contain information objects that provide details of NAP Users, i.e. NAP Content Providers and NAP Content Consumers (for Data Platform NAP type) . The Data Store contains private information used by NAP Users to access the NAP, to provide agreement on terms and conditions. Public metadata about traffic and travel information and other related information are stored in NAP Metadata store (D3.15).
      
      For Content Providers the data store contains following data objects:
       (1) organization with name (1.1), postal address (1.2), website (1.3), agreement on licence terms (1.4), unique identifier assigned to organization (1.5), name and contact details of a responsible person to act as a contact (1.6).
       (2) user account(s) with name (2.1), email (2.2), credentials (2.3), user type (2.4).
      *(3) machine account with url (3.1), connection type (3.2), credentials (3.3).
      
      For Content Consumers the data store contains following data objects:
      *(1) organization with name (1.1), postal address (1.2), website (1.3), agreement on licence terms (1.4), unique identifier assigned to organization (1.5), name and contact details of a responsible person to act as a contact (1.6).
      *(2) user account(s) with name (2.1), email (2.2), credentials (2.3), user type (2.4).
      *(3) machine account with url (3.1), connection type (3.2), credentials (3.3).
      * Optional data object for Data Platform NAP type and even there it is optional provided the data is not openly accessible.
      
      Additionally, for both:
       (4) Event information (log in, log out, change of data)
