version: "1.0"
note: |
  Low Level Functions perform a specific part of the data input, process, or information output process and have no component functions.
elements:
  - name: "F3.6.1 Manage NAP Metadata Repository"
    guid: "{28A2C553-2939-4542-B14B-8A13B25BC494}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "Low Level Function"
    status: "Proposed"
    order: 0
    tags:
      "RequirementLevel": "MANDATORY_PLUS"
      "revised": "2026-10-20"
      "status": "copy"
    note: |
      This Function shall be capable of providing the following facilities:
      
       (1) The ability to manage the store of Metadata.
       (2) The ability to ensure that all data sent to the store is stored in a coherent and logical manner.
       (3) The ability to read, edit, update and erase data from the store as and when requested.
       (4) The ability to enable Metadata to be created in advance of their publication on the NAP so it could be checked before its publication.
       (5) The ability to carry out its activities in such a way that they do not interfere with one another, and that the integrity of the data being stored and read is preserved.
       (6) This function manages all data mentioned in the mobilityDCAT-AP (https://mobilitydcat-ap.github.io/mobilityDCAT-AP/releases/index.html) and other relevant information (e.g. quality info, possible data comments etc.)
      
      OPTIONAL:
       (7) The ability to request the NAP Content Providers at least annually to review and update their metadata, and to flag metadata records that have not been updated within the agreed period.
    links:
