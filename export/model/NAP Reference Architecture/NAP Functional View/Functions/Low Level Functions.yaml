      "revised": "2026-10-20"
    note: |
      This function shall be capable of providing the following facilities:
      
       (1) The ability to perform metadata quality checks based on pre specified rules and procedures (including appropriate time frequencies). The checks follow the MQA and InQMS methodology, at minimum it is an availability of the urls provided in metadata.
       (2) The ability to retrieve data to be checked from the NAP Metadata store.
       (3) The ability to disseminate and store the outcomes of data quality checks to the NAP Metadata store.
       (4) Ability to perform the checks based on metadata events (data insert, data update) in the NAP Metadata store
