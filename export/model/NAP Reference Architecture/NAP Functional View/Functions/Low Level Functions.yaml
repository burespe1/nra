  - name: "F3.6.11 Monitor NAP Usage and Performance"
    guid: "{678C8981-D1F4-47ea-8F47-1E260E07F935}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "Low Level Function"
    status: "Proposed"
    order: 1
    tags:
      "RequirementLevel": "OPTIONAL"
      "revised": "2026-10-20"
      "since": "2.2.0"
    note: |
      This Function shall be capable of providing the following facilities:
      
       (1) The ability to collect usage statistics of the NAP, e.g. number of accesses, search requests and registered NAP Users, using the NAP User activity recorded by the functions Manage Registrations and Provide Authorisation Service and Manage NAP Data Retrieval.
       (2) The ability to collect statistics on the consumption of datasets, e.g. downloads, subscriptions and page views, and to track the use of the data available at the NAP based on NAP User feedback or tools.
       (3) The ability to measure the performance of the NAP, e.g. availability, downtime and response times.
       (4) The ability to collect and evaluate qualitative feedback on the usefulness of the NAP, e.g. ratings of quality or surveys.
       (5) The ability to provide the collected statistics to the NAP Operator for reporting to the Member State and to the Competent Authority / National Body, and statistics of data access to the NAP Content Providers.
      
      NOTE: The function is optional; it supports the KPIs K.2.2 Related services monitoring and K.2.9 Monitoring and evaluation of the NLKF and the reporting tasks of the NAP Operator.
