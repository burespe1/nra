  - name: "F3.6.4 Manage Metadata Retrieval"
    guid: "{2F2393E9-9A59-4344-A2C0-207945E7F438}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "Low Level Function"
    status: "Proposed"
    order: 0
    tags:
      "RequirementLevel": "MANDATORY_PLUS"
      "revised": "2026-10-20"
      "status": "copy"
    note: |
      This Function shall be capable of providing the following facilities:
      
       (1) The ability to provide a query form or comparable search interface to define keywords or refine demands in different available metadata elements.
       (2) The ability to receive and process requests from NAP Content Consumers to be provided with NAP metadata.
       (3) The ability to process the request in (1) above so that all suitable search results to the request are retrieved from the Data Store NAP Metadata.
       (4) The ability to format the NAP metadata search results obtained in (3) above and send it to the entity that made the request in (2) above or to display them in an overview results page.
       (5) Ability to provide metadata at the NAP including data created by the NAP, i.e. quality records.
       (6) Ability to provide all or parts of metadata stored in the NAP Metadata store in a machine-readable format for reasons of harvesting the metadata by Metadata Requesting System (machine to machine access).
       (7) The ability to provide all relevant metadata without NAP Content Consumer registration
      
      OPTIONAL:
       (8) The ability to visualise metadata, e.g. numbers and charts derived from metadata records, or metadata shown on a map.
      
      NOTE: It is assumed that NAP Content Provider could perform all the task of the NAP Content Consumer.
