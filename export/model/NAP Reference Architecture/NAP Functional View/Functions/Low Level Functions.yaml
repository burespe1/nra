  - name: "F3.6.9 Manage NAP Data Retrieval"
    guid: "{A3764B72-97E2-400c-81B8-C945964F9E0D}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "Low Level Function"
    status: "Proposed"
    order: 0
    tags:
      "RequirementLevel": "MANDATORY_PLUS"
      "revised": "2026-10-20"
    note: |
      This Function shall be capable of providing the following facilities:
      
       (1) The ability to receive and process request for data retrieval from a NAP Content Consumer or Data Requesting System.
       (2) The ability to forward the authorisation credentials of the NAP Content Consumer or Data Requesting System to the Function Manage NAP User Registrations and Provide Authorisation Service and to receive a result about the authorisation of the said entities.
       (3) The ability to send the request in (1) above to the Function Manage NAP Data Repository for retrieving data identified in the request from the NAP Data store if the checks in (2) above were successful.
       (4) The ability to send a "failure" response to the entity that made the request in (1) above if the checks in (2) above were unsuccessful or a “success” response with the retrieved data if the checks were successful to the requesting entity.
       (5) Ability to provide data retrieved from the NAP Data store to the NAP Content Consumer or Data Requesting System in a way which is requested.
       (6) Ability to record NAP User Activity into the NAP Users data store.
       (7) Requested data are either traffic or travel information or its support information stored in the NAP Data store (e.g. quality information, last update time) or both.
      
      OPTIONAL:
       (8) The ability to visualise data, e.g. numbers and charts derived from data records, data shown on a map, or animations of time series.
