  - name: "F3.6.5 Provide NAP User Support"
    guid: "{E4E0DD97-20AB-4868-B0DE-C0C3C14EA4BA}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "Low Level Function"
    status: "Proposed"
    order: 0
    tags:
      "RequirementLevel": "MANDATORY_PLUS"
      "revised": "2026-10-20"
      "status": "copy"
    note: |
      This Function shall be capable of providing the following facilities:
      
       (1) The ability to receive and process support requests from any existing or potential NAP Content Provider or NAP Content Consumer.
       (2) The ability to respond to user support requests adequately at least in a form of first-level support.
       (3) The ability to consult other NAP roles for issues which cannot be responded with the own knowledge.
       (4) The ability to manage issues and log the issue resolution for later use by NAP Users or by an Auditing entity
       (5) The ability to receive reports from NAP Content Consumers about inaccuracies in the data and to forward them without delay to the responsible NAP Content Provider.
      
      OPTIONAL:
       (6) The ability to publish information about the operational procedures of the NAP, e.g. registration of Content Providers and handling of issues.
      
      NOTE: this could be done via a ticketing system
    links:
