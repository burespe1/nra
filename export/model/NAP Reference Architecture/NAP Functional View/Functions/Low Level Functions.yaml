  - name: "F3.6.10 Provide Data Quality Checks"
    guid: "{D01EFD87-A3E1-4216-81D9-855530ECE1B9}"
    type: "Activity"
    stereotype: "FRAME_Low_Level_Function"
    keywords: "Low Level Function"
    status: "Proposed"
    order: 0
    tags:
      "RequirementLevel": "MANDATORY"
      "revised": "2026-10-20"
    note: |
      This Function shall be capable of providing the following facilities:
      
       (1) The ability to provide periodical and initial checking of published data quality based on pre specified rules and procedures (including appropriate time frequencies). Main tests performed are schema validation and availability of provided data against the metadata information.
       (2) The ability to retrieve data to be checked from the NAP Data store.
       (3) The ability to disseminate and store the outcomes of data quality checks to the NAP Data store.
       (4) The function shall be capable to request metadata from NAP Metadata store, to compare with data, by invoking the functionality of Manage NAP Data Repository for data validation purposes
       (5) Ability to perform the checks based on data events (data insert, data update) in the NAP Data store
    links:
