package: "NAP Reference Architecture/NAP Motivation Layer/ITS Added Value"
guid: "{E12FE0A8-372F-46e0-A2A5-0059B9C2E94D}"
alias: "ITS Service Added Values"
version: "1.0"
note: |
  In this chapter are definitions of ITS Service Added Values i.e. benefit of implementing the ITS Service affecting one or more stakeholders.
elements:
  - name: "Better cross border cooperation"
    guid: "{1DCCB4B5-41EA-443b-999D-B9DECF471654}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By sharing data with neighbouring countries, state planning services could increase the level of cooperation across borders. Enhance cooperation between public and private stakeholders in ITS.
    links:
      - "Association «defines» → Member State"  # {1C96F020-3657-4814-9D9E-0B4A0D295E39} → {2DC22194-A127-42ba-9AEA-E8CBDD2EC795}
  - name: "Better defined operational environment"
    guid: "{FA246A00-5F05-4b78-B8B6-0C34D4F4BFDF}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By introducing a legal and operational framework by the Member State when implementing the ITS Directive the nominated NAP Operator gets a clear set of requirements and obligations and practices to operate NAP as set up by the legal framework.
    links:
      - "Association «defines» → NAP Operator"  # {D7CC07EC-A62D-4460-8DD6-B8F49F9C93E8} → {4B4D9772-CCE6-459c-B5E0-80E3C5C32674}
  - name: "Better oversight on the ITS Directive implementation"
    guid: "{A714C199-95DF-45f6-8CD4-8777446E0378}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By establishing one NAP, per member state, concentrating mobility data from all obligated content producers (see Content Provider stakeholder) the EC has easier access to evaluating how are stipulations of the delegated regulations being fulfilled in the member states and MS has an easier way to report about these obligations to the EC.
    links:
      - "Association «defines» → European Commission"  # {8A5A8F6D-275D-49cd-9772-6738684AE7E9} → {26DD1383-1637-4356-B2EF-7671DCA5C5BC}
      - "Association «defines» → Member State"  # {0832C562-91A8-4619-8398-9A74EFDEDBE0} → {2DC22194-A127-42ba-9AEA-E8CBDD2EC795}
  - name: "Better service/data applicability"
    guid: "{5621BC53-FB7E-4897-8C7E-760AC4A9C63A}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By aligning to required formats and data specifications, the data or services get better usability by content consumers.
    links:
      - "Association «defines» → Content Provider"  # {1772B991-0092-46c7-966B-1E5BAE20E8BE} → {4D7E0B7A-7D34-400b-AE00-68E04F93B7BA}
  - name: "Companies engaged in providing transport services and entities ensuring transport services benefit"
    guid: "{86E4D6B0-ED82-4d90-BD37-D74AC3549849}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    alias: "Companies engaged in PT benefit"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      Companies engaged in providing transport services and entities ensuring transport services benefit. Public transport dispatchers from traffic controller stations can better manage the PT fleet operations and ensure guaranteed transfers at terminals due to NAP up-to-date data/information about incidents and congestions that are currently causing delays of public transport vehicles. In this context, NAP information makes public transport more attractive and reliable. Also, truck dispatchers could better manage and organise freight transport based on information received from the NAP, in particular limitations for commercial vehicles on roads, bridges, and in tunnels.
    links:
      - "Association «defines» → Content Consumer"  # {A7394E25-E336-46d8-9E79-4120B3B543A7} → {77E9CEBA-B991-4860-A6D3-952CAD1B776E}
  - name: "Easier access to content providers"
    guid: "{507180A7-8EFB-4d7b-8902-37863826AB81}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By having all relevant data and services listed at NAP including the contact information of the data and services providers, the National Body can easily select the data to evaluate and reach out to their owner/provider.
    links:
      - "Association «defines» → Competent Authority / National Body"  # {2C75B514-8AF8-4f64-84D1-DBFE3E2B0857} → {60AC1314-7147-4d43-89C6-2CD3B26BDEBE}
  - name: "Easier validation process"
    guid: "{3D099575-489C-439e-B206-917BBA99E1AF}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By having all information about the data and services of the content providers at NAP the National Body can perform compliance assessment easier.
    links:
      - "Association «defines» → Competent Authority / National Body"  # {040CE2EC-63C6-45cf-8EA1-9F6E20DB61CE} → {60AC1314-7147-4d43-89C6-2CD3B26BDEBE}
  - name: "Enhanced findability of data and services"
    guid: "{9846A13E-FF81-4e4c-A66A-6CA78395412E}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By having all mobility data provided via the NAP the content consumers (Service providers) may use them to increase the value of their services to increase road safety and travel efficiency. Easier and more regular data exchange (e.g. ID verification of content providers once). Distribution of high-quality traffic data to a larger share of travellers.
    links:
      - "Association «defines» → Content Consumer"  # {6398F21B-781C-4925-BAA4-4D3EC728CF6B} → {77E9CEBA-B991-4860-A6D3-952CAD1B776E}
  - name: "European Commission benefit"
    guid: "{33CF1689-E6E9-4f50-8304-65272C5064B3}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      European Commission benefit. NAP data can be used to identify specific problems in transport networks and to propose EU-wide policy solutions, notably to define needs for major project spending, e.g. relevance and eligibility.
    links:
      - "Association «defines» → European Commission"  # {1099570C-742C-421f-B265-F4F98298FA3E} → {26DD1383-1637-4356-B2EF-7671DCA5C5BC}
  - name: "Harmonized data for service provision"
    guid: "{1A6AC210-FB97-4548-B8D1-D93EF2E51CCB}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By fulfilling the obligations of the ITS Directive, the data and services shared via NAP are provided concerning a set of standards which makes it easier to integrate them into pan-European service. Better quality of ITS services for end users.
    links:
      - "Association «defines» → Content Consumer"  # {4287F489-2F6E-44d7-A7D4-CA27F3C384C1} → {77E9CEBA-B991-4860-A6D3-952CAD1B776E}
  - name: "Increased traveller comfort"
    guid: "{5AED7075-81E8-4e4e-91D5-681CC60018C1}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By having all modes of mobility data provided via the NAP, the multimodal service provider could provide better services to travellers, advising them of better, more convenient, travel options (accessibility and time) and thus increasing their comfort.
    links:
      - "Association «defines» → European Commission"  # {388A0DBF-81F0-4a59-99A4-16ED9F5208CB} → {26DD1383-1637-4356-B2EF-7671DCA5C5BC}
      - "Association «defines» → Member State"  # {7B1BE233-7B6D-4c93-A4E1-30AE40B1DBA1} → {2DC22194-A127-42ba-9AEA-E8CBDD2EC795}
  - name: "Increased use of public data"
    guid: "{33A07100-D868-4036-9001-3C4FA1ADB6F3}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By having all relevant public mobility data listed at NAP and in a harmonized format, the data gets more value. It is easier to access and use by service providers in the end user-oriented services. Generating higher reuse of data created by public authorities. Enhance cooperation between public and private stakeholders in ITS.
    links:
      - "Association «defines» → Member State"  # {9FF9E04B-41E1-44ac-9FFF-5ADA6C9D76E0} → {2DC22194-A127-42ba-9AEA-E8CBDD2EC795}
  - name: "Insight into Best Practices"
    guid: "{3160147A-9326-4fcf-8BF8-E5F0772B3EAF}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By observing other data published at NAP, the content provider could analyse features of best practices to adopt them in their data. Also, the potential of content consumer feedback creates an opportunity to better the data. Regular quality management of ITS services and data content feedback procedures. Enhance experience with data exchange and improve the awareness of data value in the traffic domain.
    links:
      - "Association «defines» → Content Provider"  # {D071324B-D44D-496f-AE9D-E840C78A02C0} → {4D7E0B7A-7D34-400b-AE00-68E04F93B7BA}
  - name: "Lower negative traffic and travel externalities"
    guid: "{719542A2-5B93-42f9-A7C5-207B4876615F}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      By making public and private data available via NAP and by increasing their visibility, the service provider could provide services based on more information, ultimately providing a better service to customers. This better service could result in a reduction of accidents, shorter travel time, and lower emissions.
      More public and private stakeholders are involved in many EU MS with regular data exchange between them and used for creating high-quality ITS services. Enhanced road safety, traffic efficiency and reduced environmental impacts of transport by the extension to more public and private stakeholders in the distribution of traffic information and related ITS Services.
    links:
      - "Association «defines» → European Commission"  # {AD26A3E3-688C-4626-B442-B93914C0BA29} → {26DD1383-1637-4356-B2EF-7671DCA5C5BC}
      - "Association «defines» → Member State"  # {4B2CAC4A-AD90-4088-89D6-C6A61FA7670F} → {2DC22194-A127-42ba-9AEA-E8CBDD2EC795}
  - name: "Member State benefit"
    guid: "{9C963A11-3E8E-4700-AC7F-66252C040E4A}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      Member State benefit. NAP data bring a wide range of information, resources, and decision-making approaches that lead to better outcomes. These data enable to perform analyses and predict the development of traffic. NAP data are also appropriate for transport organization planning and development of conceptual changes.
    links:
      - "Association «defines» → Member State"  # {E8F12427-9A8C-48eb-BA17-C01D79AA2B51} → {2DC22194-A127-42ba-9AEA-E8CBDD2EC795}
  - name: "Public (end users) benefit"
    guid: "{8B9E0978-ED80-4621-B380-2B393ED06A32}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      Public (end users) benefit. Due to the availability and timely delivery of appropriate and technically harmonized static or dynamic NAP information/data users can have an insight into the current traffic situation or travel conditions and/or can use such information while driving or travelling, without being burdened with redundant information.
    links:
      - "Association «defines» → Content Consumer"  # {6B7A90EE-123F-4a7e-838F-5BF01B603149} → {77E9CEBA-B991-4860-A6D3-952CAD1B776E}
  - name: "Public Administration benefit"
    guid: "{C0A4499B-2CA7-43e7-924C-EEBB0497229F}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      Public Administration benefit. Data from NAP may be used and more efficiently interconnected with other public administration information systems. These data are made available to other parties both from the public and the private sector, which strengthens the development of new services with added value.
    links:
      - "Association «defines» → Content Consumer"  # {F2730238-EE83-4962-B262-95B1E4B0925B} → {77E9CEBA-B991-4860-A6D3-952CAD1B776E}
  - name: "Scientific and Research institutions benefit"
    guid: "{7E611DF3-9DDE-40bf-A855-BB079D9FBD73}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      Scientific and Research institutions benefit. Access to NAP data enables scientific and research teams to develop models of the traffic flow behaviour, assessment (based on historical data) of impacts of individual restrictions and their combinations on the level of provided services in the transport network, furthermore, prediction of traffic development, planning the transport of people and goods. These teams can produce a policy and scenario by estimating the impact of a transport policy scenario or a change in forecasting assumptions.
    links:
      - "Association «defines» → Content Consumer"  # {507316F9-04BE-4735-AB18-5F6D073B3D34} → {77E9CEBA-B991-4860-A6D3-952CAD1B776E}
  - name: "Vehicle manufacturers and their suppliers benefit"
    guid: "{D098ACC2-0448-4546-95D2-0A86426CF025}"
    type: "Class"
    stereotype: "FRAME_ITS_Service_Added_Value"
    keywords: "Benefit"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "ITS Added Value Type": ""
    note: |
      Vehicle manufacturers and their suppliers benefit. Concerning the competition in the automobile market vehicle/equipment manufacturers can offer their customers new advanced applications and systems using NAP data, which brings considerable added value to the producers and in particular consumers.
    links:
      - "Association «defines» → Content Consumer"  # {7EB86123-3826-4689-AE8B-57EAB4FE238E} → {77E9CEBA-B991-4860-A6D3-952CAD1B776E}
