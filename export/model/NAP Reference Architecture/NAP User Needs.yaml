package: "NAP Reference Architecture/NAP User Needs"
guid: "{309744F3-4B5B-43af-A5CC-6FF69B5E1BFD}"
alias: "User Needs"
version: "2.0"
note: |
  The results of the Motivation analysis are likely to contain several ideas, written in a variety of styles, and which may be open to interpretation. It is therefore necessary to re-write the ITS Service that was informally described by the stakeholders in a consistent manner. The User Needs provide a way of expressing these ideas in a way that is Unambiguous, Testable (with objective tests), Traceable (with unique reference numbers) and Singular (with only one idea at a time).
  
  User Needs are tailored so that each User Need represents the smallest possible portion of an ITS Service. The minimum set of functionalities to realize the service described in the User Needs are cross referenced to these User Needs, so the creation of the Functional View starts by selecting a subset of User Needs that describes the intended ITS Service best. This initial selection is not sufficient however, additional functional elements might be added or removed to achieve the desired ITS Service.
  
  For this view we do not distinguish between both NAP types, Metadata Directory and Data Platform.
