alias: "Specifications and Recommendations"
version: "1.0"
note: |
  The Specifications and Recommendations document describes the legal and technical specifications, profiles and recommendations used for the ITS Services in the different Views of the NAP Reference Architecture. A specification is bound to the architecture through the requirements derived from it: each derived requirement is attached to an NRA object whose technical or organisational parameters, usage, interaction or behaviour it constrains. That chain — specification → requirement → NRA object — is maintained in the model.
  
  The Specifications and Recommendations are elaborated with respect to the minimum functionality of the two NAP types: Metadata Directory and Data Platform.
