package: "NAP Reference Architecture/Supplements/Specifications and Recommendations/KPI Framework/Update and Maintenance KPIs"
guid: "{FA7A1405-B9BD-40ba-9227-CB9A02C71762}"
alias: ""
version: "1.0"
note: |
  NAP services should be constantly maintained and updated, including software updates, backups, and hosting. Data providers must regularly check and update their publications to keep information current. Periodic monitoring and evaluation of NAPs are essential, focusing on data usage, system performance, and user feedback. Additionally, NAP operators should assess the platform’s impact on service and application development by calculating metrics and gathering feedback.
elements:
  - name: "KPI 4.1 IT services"
    guid: "{0F3E274F-3549-4ef1-AE75-3552EDAA93AC}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      “IT services” KPI assesses whether there are established responsibilities for resolving as quickly as possible technical issues that may affect the operation of a NAP (both software- and hardware-related issues are encompassed). While a value equal to zero corresponds to the scenario where such responsibilities are not assigned, higher levels of service values depend on the establishment of responsibilities and the planning for the long run maintenance of the NAP
      
      Values:
      0: No, there are no responsibilities assigned or measures foreseen for the maintenance and update of the NAP IT services
      1: Yes, there are maintenance and update procedures well-established
      Value+1 (for each of the following options)
      How is the NAP continuity guaranteed?
      a. Common responsibilities established (signed SLA with IT company(s)) for the NAP services (system, software and hardware) maintenance and updates, backups, and hosting
      b. Measures for the NAP services continuity in the long term and subsequent funding are foreseen
      
      Minimum acceptable value for interoperability: 1
    links:
      - "Abstraction → K.4.1.1 IT services"  # {6D44F76B-2FD6-4253-89A2-54259CD937A9} → {074C6AF9-ECAC-4279-AFF2-82CE9E415FE6}
  - name: "KPI 4.2 Link checking frequency"
    guid: "{0DDE3DD2-34FD-479a-B17F-18E67611EEA9}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      “Link checking frequency” KPI assesses the existence of predetermined processes and responsibilities among NAP operators, data providers for controlling the quality and maintaining the NAP links, inuring that they are functioning correctly. The difference between the possible values relates to the frequency of these checks.
      
      Values:
      0: no established procedures for link checking
      1: Links are checked with publishing (i.e., once)
      2: More than six months of interval
      3: every six months
      4: Monthly
      5: Weekly or more often
      
      Minimum acceptable value for interoperability: 1
    links:
      - "Abstraction → K.4.2.1 Link checking frequency"  # {CBBDA222-C97B-474c-B04B-F04F6BC09DA7} → {0C2EEA46-1380-4551-AA7C-0AADCB4E42ED}
  - name: "KPI 4.4 Metadata maintenance frequency"
    guid: "{30BA3504-2710-4e8c-83B8-CE51B9B7C24A}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      Metadata maintenance frequency” assesses the frequency on which metadata are maintained and updated. This is relevant since metadata specifications are often changed due to stakeholder needs and market developments, and these changes should be reflected on the NAPs to ensure data discoverability. The KPI’s possible values comprise difference options for the frequency of maintenance, where higher values correspond to higher frequency.
      
      Values:
      0: no established procedures for metadata maintenance or longer than 1 year of interval between subsequent updates
      1: once a year
      2: every six months
      3: every three months or less
      
      Minimum acceptable value for interoperability: 1
    links:
      - "Abstraction → K.4.4.1 Metadata maintenance frequency"  # {8141F81D-4117-4334-982E-2D9F6E40A006} → {56CF5FF2-7112-4bd3-9E60-B10AE222362F}
  - name: "KPI 4.5 Data (content) maintenance"
    guid: "{F98855F9-85A4-43be-A46D-33FB708EDE53}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      4.5 “Data (content) maintenance” evaluates the existence of procedures for keeping the data up-to date by systematically assessing data (content) quality. This is a binary KPI that does not check the frequency on which the data quality is checked but only verifies if there are processes established in this regard.
      
      Note: This KPI is for data platform NAP type only. For metadata directory NAP type, you answer the first option. Technically, the KPI is skipped in an on-line questionnaire after “metadata directory” NAP type selection.
      
      Values:
      N/A: Metadata directory case
      0: No, there are no procedures in place
      1: Yes, some sort of quality checking/validation is performed (e.g., manual or automatic; one time or regularly; please specify the procedure in the “Suggestions” box)
      
      Minimum acceptable value for interoperability: 1
    links:
      - "Abstraction → K.4.5.1 Data maintenance"  # {74369DA5-2A77-4f62-B687-5E27F4D7ACD1} → {EC2AF8AF-F8E6-44b1-9189-D1ED47BA5033}
