      Full Name: Commission Regulation (EU) No 454/2011 of 5 May 2011 on the technical specification for interoperability relating to the subsystem ‘telematics applications for passenger services’ of the trans-European rail system
      
      Link: https://eur-lex.europa.eu/eli/reg/2011/454/oj
      
      Description: This regulation defines the Technical Specification for Interoperability (TSI) for the telematics applications for passenger services (TAP) subsystem of the trans-European rail system. It mandates standardised data exchange between railway undertakings, infrastructure managers, ticket vendors, and other actors involved in passenger rail services. It covers journey planning, real-time information, reservation, ticketing, and after-sales processes. The regulation enforces the use of harmonised message formats, reference data registries, and interface protocols to ensure cross-border interoperability. It has been amended to reflect updated IT architectures, governance models, and implementation deadlines.
      
      Additional details: In NAP environments that expose or aggregate rail passenger data, TAP TSI applies where data originates from or conforms to TAP-compliant systems. NAPs must ensure interface compatibility with TAP message structures, maintain alignment with central reference data (e.g. company and location codes), and preserve semantic integrity when mapping to other ITS domains. Any transformation or relay of TAP messages must comply with the regulation’s baseline and versioning rules.
      
      Related Documents:
      
      	- ERA TAP TSI Portal – Official source for baselines, message schemas, and implementation guidance.
      	- TAP TSI Implementation Reports – Status reports on national deployment and compliance.
      	- TAP/TAF Reference Data Portal – Central management system for code lists (e.g. RICS location codes, company codes) required under the regulation.
      	- Commission Implementing Regulation (EU) 2019/775 – Updates Annexes and implementation timelines.
    links:
