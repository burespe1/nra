      Type: Legal
      
      Full Name: Directive 2010/40/EU of the European Parliament and of the Council of 7 July 2010 on the framework for the deployment of Intelligent Transport Systems in the field of road transport and for interfaces with other modes of transport
      
      Link: https://eur-lex.europa.eu/eli/dir/2010/40/oj
      
      Description: This directive establishes the legal framework for coordinated deployment of Intelligent Transport Systems (ITS) in road transport and its interfaces with other modes. It defines priority areas and empowers the Commission to adopt delegated acts specifying functional, technical, and organisational requirements. It was amended by Directive (EU) 2023/2661 to reflect developments in connected and automated mobility, digital infrastructure, and multimodal services. The amendment expands the scope of data availability obligations and strengthens requirements for interoperability, continuity, and digital access to transport-related information.
      
      Additional details: Member States must designate National Access Points (NAPs) to enable access, exchange, and reuse of transport data. NAPs are required to support delegated acts adopted under this directive (e.g. RTTI, SRTI, SSTP, MMTIS) by providing harmonised, machine-readable, and quality-assured datasets. NAP operators must ensure compliance with the technical specifications of each delegated regulation and maintain cross-border interoperability.
      
      Related Documents:
      
      	- ITS Directive and Action Plan – European Commission – Overview of the directive, its amendments, and implementation priorities.
      	- Directive (EU) 2023/2661– Amending Act – Extends the scope of Directive 2010/40/EU to cover new mobility services and digital data availability.
      	- Evaluation of the ITS Directive – SWD(2019) 368 final – Commission staff working document assessing effectiveness and implementation gaps.
      	- NAPCORE Statement on the ITS Directive Revision (PDF) – Position paper outlining harmonisation priorities and legal coordination under the revised directive.
      	- Commission Delegated Regulation (EU) No 885/2013 – On the provision of information services for safe and secure parking places for trucks and commercial vehicles.
      	- Commission Delegated Regulation (EU) No 886/2013 – On the provision of road safety-related minimum universal traffic information.
      	- Commission Delegated Regulation (EU) 2015/962 – On the provision of EU-wide real-time traffic information services. Partially superseded by 2022/670 but still relevant for transitional provisions.
      	- Commission Delegated Regulation (EU) 2017/1926 – On the provision of EU-wide multimodal travel information services.
      	- Commission Delegated Regulation (EU) 2022/670 – Updates and replaces parts of 2015/962; sets new specifications for real-time traffic information services.
      	- Delegated Regulation (EU) 2024/490 – Amends and updates the original 2017/1926 regulation, refining data categories, deadlines, and technical specifications for MMTIS implementation.
