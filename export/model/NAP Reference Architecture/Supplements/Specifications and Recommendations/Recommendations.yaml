package: "NAP Reference Architecture/Supplements/Specifications and Recommendations/Recommendations"
guid: "{F21CB3B2-95A3-414b-A3A7-7AE4E898B797}"
alias: "Recommendations"
version: "1.0"
note: |
  Recommendation: Provide guidelines or best practices that are not mandatory but are suggested to achieve optimal performance, compliance, or quality. These can include industry standards, advisory notes, or expert recommendations.
elements:
  - name: "R1 EMDS practical guidance"
    guid: "{7E203B2F-A441-4204-A6A1-9B2B669C5C12}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Recommendation"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Type: Recommendation
      
      Full Name: deployEMDS – Technical Specifications for the European Mobility Data Space
      
      Link: https://deployemds.eu/
      
      Description: deployEMDS is a European project co-funded under the Digital Europe Programme that defines the technical architecture, governance, and interoperability mechanisms for the European Mobility Data Space (EMDS). It aims to enable secure, sovereign, and standardised data sharing across public and private mobility actors. The specifications support real-life implementations in nine cities and regions and are aligned with the European Data Strategy and Sustainable and Smart Mobility Strategy.
      
      Additional details: The deployEMDS technical specifications define common building blocks for data interoperability, data sovereignty, and data accessibility. They include reference architectures, metadata vocabularies, trust frameworks, and APIs for federated data exchange. The framework supports integration with existing standards (e.g. DCAT-AP, mobilityDCAT-AP, DATEX II, OCPI) and enables cross-domain use cases such as multimodal routing, traffic management, and SUMI monitoring. The specifications are being piloted in 16 use cases across 9 EU countries.
      
      Related Documents:
      
      	- deployEMDS Technical Documentation – Architecture, components, and implementation guidance
      	- deployEMDS Project Portal – Project overview, use cases, and governance
      	- EU Transition Pathways – deployEMDS Summary – Strategic context and policy alignment
      	- Digital Europe Programme – EMDS Objectives – Background on European data space initiatives
      	- BoostEDIC Mobilty & Logistics Project — Successor initiative to deployEMDS, launched February 2026 under the Digital Europe Programme.
  - name: "R2 Assistance"
    guid: "{0D28759C-0D39-4657-95CF-58C45787B5DC}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Recommendation"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
      "revised": "2026-10-20"
    note: |
      Type: Recommendation
      
      Full Name: NAP assistance to content providers in publishing (meta)data
      
      Description: NAPs shall assist content providers in publishing (meta)data to the NAP.
      
      Additional details: The obligation to publish falls on the content provider, while the means of publishing are controlled by the NAP operator. A provider that cannot publish correctly therefore produces a compliance failure that is attributed to the Member State, not to the provider alone, which is what makes assistance a NAP duty rather than a courtesy. In practice it means: publication instructions that are written down, versioned and current; a test or staging endpoint where a provider can try a publication before it becomes public; validation feedback that names the element that failed rather than rejecting a submission as a whole; a named contact or helpdesk with a stated response time; and onboarding support for providers publishing for the first time. How far the assistance goes — self-service documentation, a helpdesk, or hands-on data preparation — is a resourcing decision for the NAP operator and differs legitimately between Member States. What should not differ is that the level offered is stated, so that a provider knows what to expect.
  - name: "R3 Metadata quality feedback"
    guid: "{BC945A8B-01D0-4f70-9484-586F0F7F9325}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Recommendation"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
      "revised": "2026-10-20"
    note: |
      Type: Recommendation
      
      Full Name: Quality gate with feedback to the content provider
      
      Description: Where a publication is of insufficient quality to be accepted, the NAP contacts the data provider and says so. The provider is given the opportunity to make improvements, after which the publication can proceed.
      
      Additional details: This describes a quality gate with a feedback loop, not a silent rejection, and the loop is the point: the provider is told what is wrong and gets an opportunity to fix it before the publication is refused. Making that workable needs four things. Published quality criteria, so that “insufficient” is testable rather than a matter of opinion. A validation report that identifies what failed and where. A stated period within which the provider can correct and resubmit. And a record of the exchange, so that a recurring quality problem is visible as a pattern rather than as a series of unrelated rejections. There is a deliberate tension with the “Not tampered by the NAP” recommendation: because the NAP must not alter provider content, the gate can only accept or reject with feedback — it must never quietly correct. The recommendation bears mainly on the Metadata Directory role, where the NAP holds the metadata record and can assess it directly; where the NAP only references a remote dataset, the assessable object is the metadata, not the data behind it.
  - name: "R4 Not tampered by the NAP"
    guid: "{C1EA86E6-A64D-41b8-9E07-E71ACD5F9088}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Recommendation"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
      "revised": "2026-10-20"
    note: |
      Type: Recommendation
      
      Full Name: Integrity of provider content passing through the NAP
      
      Description: The NAP shall assure the content provider that the metadata, data and services it provides are not altered by the NAP in any way.
      
      Additional details: The NAP is a conduit, not an editor. The content provider remains the author of the data and remains accountable for it, and that accountability only holds if the NAP does not change what was submitted. Concretely: no silent normalisation of values, no re-encoding that changes meaning, and no enrichment presented as though it came from the provider. Where the NAP does transform — converting a format, harvesting a record into mobilityDCAT-AP, deriving a summary — the transformation should be declared and the original should remain identifiable and retrievable, so that a consumer can tell provider content from NAP content. This is also what keeps the NAP’s role narrow under the GDPR (see L7): a NAP that alters or enriches content moves closer to determining the means of processing. The usual technical means are a checksum or signature over the submitted artefact, retention of the artefact as submitted, and a documented transformation chain.
  - name: "R5 Notification"
    guid: "{8DE95B47-D58D-4339-BE76-DBACC7909669}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Recommendation"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
      "revised": "2026-10-20"
    note: |
      Type: Recommendation
      
      Full Name: Notification of content consumers, and protection of their subscription data
      
      Description: Where a Content Consumer (CC) has subscribed, the NAP notifies them of any outage and, optionally, of additions to the NAP. The NAP Operator (NO) must ensure that the personal data collected for that subscription is not misused, must state to whom it may be disclosed in accordance with the General Data Protection Regulation (GDPR), and must give the Content Consumer the right to delete their account on the NAP.
      
      Additional details: Two separate duties sit in this recommendation and both apply. The first is service availability: a content consumer who has built a service on a NAP feed needs to be told about outages, planned and unplanned, and ideally about additions. The notification channel must not depend on the NAP being up — a status page, a mailing list or a feed hosted elsewhere — or it fails exactly when it is needed. This duty is distinct from the incident notification required under NIS2 (L12): that one runs to the national CSIRT or competent authority, this one runs to the users, and meeting one does not meet the other. The second duty follows from the first: operating a subscription list is itself the processing of personal data. The NAP operator therefore needs a lawful basis for it, a retention period, a statement of who the data may be disclosed to, and a working way for a content consumer to delete their account and with it their subscription. Subscription data collected for outage notices should not be reused for anything else.
  - name: "R6 Reuse metadata"
    guid: "{D01BC616-BDA0-4444-9C0E-AE363B819E22}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Recommendation"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
      "revised": "2026-10-20"
    note: |
      Type: Recommendation
      
      Full Name: Reusable, accurate and complete metadata
      
      Description: NAPs shall grant the right to reuse the metadata, including personal information provided with consent, and shall provide metadata that is accurate, timely and complete.
      
      Additional details: This recommendation has a licensing half and a quality half, and both are needed for it to mean anything. Licensing: the metadata a NAP holds should carry an explicit open licence, so that a harvester — a national open data portal, the European data portal, another NAP — may reuse it without asking first. Absent a stated licence the default is that all rights are reserved and harvesting is legally uncertain, which is enough to stop it happening. Where a metadata record contains personal information, typically a contact name for the content provider, the reuse right extends only as far as the consent that was given for it, and that boundary should be visible in the record. Quality: accurate, timely and complete means the record actually matches the dataset it describes and is updated when that dataset changes, which in practice requires either provider-driven updates or periodic revalidation by the NAP — a metadata record that has silently drifted from its dataset is worse than no record, because it is trusted. This recommendation is the operational counterpart of the Open Data Directive obligations in L13, and mobilityDCAT-AP is the vocabulary in which it is expressed.
  - name: "R7 MQA"
    guid: "{27EC8DD4-99C6-429E-BF00-AA6461544103}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Recommendation"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
      "since": "2.2.0"
    note: |
      Type: Recommendation
      
      Full Name: Metadata Quality Assessment (MQA) Methodology, data.europa.eu
      
      Link: https://data.europa.eu/mqa/methodology
      
      Description: The MQA is the methodology and the tool that data.europa.eu uses to measure the quality of the metadata it harvests. It scores each catalogue record against findability, accessibility, interoperability, reusability and contextuality, reports which checks the record failed, and indicates what to correct. Both the methodology and the scoring are published, and the tool runs continuously against the portals that are harvested.
      
      Additional details: The MQA scores the metadata record, not the dataset behind it, which is exactly what makes it useful to a NAP: it measures what the NAP itself publishes and controls. Three things follow. It gives the “Metadata quality feedback” recommendation an objective criterion — “insufficient quality” becomes a named set of failed checks rather than a judgement. It covers the licence and access-rights fields, which is where the “Reuse metadata” recommendation and the high-value dataset obligations of L14 are enforced in practice. And because the score is computed from the DCAT-AP projection of a record, a NAP can predict it before harvest by running the SHACL validator itself, rather than discovering the result on the European data portal weeks later. Following the methodology also makes quality comparable between NAPs, which is the reason NAPCORE encourages it.
      
      Related Documents:
      
      	- MQA methodology – The published scoring method and the dimensions it measures.
      	- MQA SHACL validator – Validates a catalogue record before it is harvested.
      	- Norwegian NAP – A deployed implementation; the assessment is visible in any catalogue record.
      	- DCAT-AP – The vocabulary the score is computed from (S18).
