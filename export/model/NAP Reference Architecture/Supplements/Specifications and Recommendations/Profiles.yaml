    version: "1.0"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      STUB: Recommended Reference Profiles (RRP's) give a harmonised interpretation of the data categories in the Delegated Regulations A, B, C and E of the EU ITS-Directive 2010/40.
      This concerns the following Delegated Regulations:
      
      	- Delegated Regulation 886/2013 (SRTI, Action C)
      	- Delegated Regulation 962/2015 (RTTI, Action B)
      	- Delegated Regulation 1926/2017 (MTIS, action A)
