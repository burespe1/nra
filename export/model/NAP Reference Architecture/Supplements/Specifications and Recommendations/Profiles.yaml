  - name: "EIP Recommended Service Profiles"
    guid: "{3D7BA083-1874-45c0-9B49-E81F3F261DF9}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Profile"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      STUB: The EIP Recommended Service Profiles aim to update and harmonize service descriptions for Intelligent Transport Systems (ITS) in Europe. This effort incorporates the latest advancements in digitalization and Cooperative Intelligent Transport Systems (C-ITS), as well as insights from best practices and EU EIP activities.
      Key goals include:
      
      	- Modernizing service descriptions to reflect current technologies and regulatory contexts.
      	- Simplifying information to make it more accessible and understandable.
      	- Eliminating redundancies by merging separate documents into a comprehensive guide.
      
      
      The profiles, developed jointly by the EU EIP and DATEX II PSA, are available for free and provide guidance on data sharing for ITS services. They describe interfaces for communication between systems and vehicles, ensuring compliance with European regulations and standards like DATEX II.
      You can get the Recommended Service Profiles at the DATEX II webtool.
      
      	- Forecast and Realtime Event Information
      	- Traffic Condition and Travel Time Information
      	- Speed Limit Information
      	- Road Weather Information
      	- Multi-Modal Traveller Information
      	- Dynamic Lane Management
      	- Variable Speed Limits
      	- Ramp Metering
      	- Hardshoulder Running
      	- Incident Warning and Management
      	- HGV Overtaking Ban
      	- Traffic Management for Corridors and Networks
      	- Intelligent and Secure Truck Parking
    links:
