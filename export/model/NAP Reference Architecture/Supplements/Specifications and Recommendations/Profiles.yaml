    note: |
      Type: Profile
      
      Full Name: NeTEx European Passenger Information Profile (EPIP) – CEN/TS 16614-4, with the European Passenger Information Accessibility Profile (EPIAP) – CEN/TS 16614-6
      
      Link: https://transmodel-cen.eu/index.php/netex/
      
      Profile of: Technical Specification: NeTEx (CEN/TS 16614 series)
      
      Description: A NeTEx profile states which services are used, which objects are exchanged, which of the options offered by the standard are taken, and which optional elements are required. NeTEx profiles are available to facilitate the implementation of the standard and to improve interoperability by focusing only on the elements that are needed and to fill small gaps voluntarily left by the standard to enable customisation. The European Passenger information profile (EPIP – NeTEx Part 4) is a profile focusing on minimum information required to be exchanged to feed passenger information systems (stop displays, mobile applications, journey planners etc.) based on DR MMTIS 2017/1926. The European Passenger Information Accessibility Profile (EPIAP – NeTEx Part 6) focuses on the accessibility facilities in stops, stations, vehicles (e.g., ramps, lifts, escalators etc.) for static data, according to MMTIS DR requirements. The respective real time data for both profiles are included in SIRI. The European profiles aim to facilitate the implementation of NeTEx but also to be the basis for the specification of national or local profiles, ensuring interoperability between countries and regions. The EU profiles also take existing national profiles into account, where they exist, in order to focus on the needs common to several countries and to adopt the best approaches.
      
      Additional details: NeTEx is large and deliberately permissive; two implementations can both be valid NeTEx and still fail to exchange anything useful. EPIP is the answer to that: the subset that has to be present for passenger information, with the optional choices resolved. In practice EPIP, not full NeTEx, is the target a NAP should validate against for the static public-transport data categories of MMTIS, and it is the baseline a national profile is expected to extend rather than replace — a national profile that is not a superset of EPIP breaks cross-border journey planning by construction. EPIAP does the same job for accessibility data: lifts, ramps, escalators, step-free routes and the equivalent facilities in vehicles, which MMTIS requires and which are the part of the dataset most often missing in practice. Both profiles cover static data only; the real-time counterpart for both is SIRI, so a NAP holding EPIP data should expect a matching SIRI service and record the relationship between the two in the metadata.
      
      Related Documents:
      
      	- DATA4PT NeTEx wiki – Schemas, examples and implementation guidance for the profile.
      	- NeTEx National Implementations – DATA4PT – Country-by-country profile coverage and Level of Service alignment.
      	- NAPCORE MMTIS Data Dictionary – Alignment between the MMTIS data categories and NeTEx/SIRI elements.
