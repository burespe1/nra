    note: |
      Type: Profile
      
      Full Name: IDACS Recommended Service Profiles for alternative fuels infrastructure data
      
      Link: https://docs.datex2.eu/recommended-profiles/rsp/
      
      Profile of: Technical Specification: DATEX II (CEN/TS 16157 series)
      
      Description: In the course of the Programme Support Action (PSA) “Data collection related to recharging/refuelling points for alternative fuels and the unique identification codes related to e-Mobility actors” that was subsequently given the name IDACS, or “ID and Data Collection for Sustainable fuels in Europe”, the 15 Member States in the consortium are required to collect data on alternative fuels infrastructure — electric recharging points and hydrogen refuelling stations (HRS) — under activity 2. Other alternative fuels, such as CNG, LNG, LPG and highly-blended biofuels can be covered optionally.
      Because the data must be collected through the National Access Points defined in Directive 2010/40/EU on the framework for the deployment of Intelligent Transport Systems in the field of road transport and for interfaces with other modes of transport, it is the aim of these profiles to give guidance on how this can be achieved.
      
      Additional details: The IDACS profiles are the practical bridge between the AFIR obligations and a DATEX II payload. AFIR and Implementing Regulation (EU) 2025/655 say what data on recharging and refuelling infrastructure must be available and how fresh it must be; the IDACS profiles say which DATEX II EnergyInfrastructure elements carry it. Since 2025/655 makes DATEX II mandatory for this data from 14 April 2026, a Data Platform NAP publishing AFIR data should treat these profiles as the starting point rather than designing its own mapping. The second half of IDACS matters just as much and is easier to overlook: the unique identification codes for e-mobility actors, operators and individual charging points. Those codes are what make data from different operators and different Member States joinable at all — without them a recharging point reported through two channels cannot be recognised as one point. A NAP should therefore check that published data carries the identification codes, not only that it validates against the profile.
      
      Related Documents:
      
      	- DATEX II Recommended Service Profiles – The RSP set containing the IDACS profiles.
      	- Implementing Regulation (EU) 2025/655 – AFIR data specifications – The implementing act that makes DATEX II mandatory for this data from 14 April 2026.
      	- European Alternative Fuels Observatory (EAFO) – Implementation guidance, dashboards and policy recommendations for AFIR deployment.
