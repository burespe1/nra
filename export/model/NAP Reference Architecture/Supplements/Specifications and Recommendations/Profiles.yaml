  - name: "P2 EIP Recommended Service Profiles"
    guid: "{3D7BA083-1874-45c0-9B49-E81F3F261DF9}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Profile"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Type: Profile
      
      Full Name: EU EIP Recommended Service Profiles (RSP)
      
      Link: https://docs.datex2.eu/recommended-profiles/rsp/
      
      Profile of: Technical Specification: DATEX II (CEN/TS 16157 series)
      
      Description: The EIP Recommended Service Profiles aim to update and harmonise service descriptions for Intelligent Transport Systems (ITS) in Europe. This effort incorporates the latest advancements in digitalisation and Cooperative Intelligent Transport Systems (C-ITS), as well as insights from best practices and EU EIP activities.
      Key goals include:
      
      	- Modernising service descriptions to reflect current technologies and regulatory contexts.
      	- Simplifying information to make it more accessible and understandable.
      	- Eliminating redundancies by merging separate documents into a comprehensive guide.
      
      
      The profiles, developed jointly by the EU EIP and DATEX II PSA, are available for free and provide guidance on data sharing for ITS services. They describe interfaces for communication between systems and vehicles, ensuring compliance with European regulations and standards like DATEX II.
      You can get the Recommended Service Profiles at the DATEX II webtool.
      Recommended service Profiles
      
      	- Forecast and Realtime Event Information
      	- Traffic Condition and Travel Time Information
      	- Speed Limit Information
      	- Road Weather Information
      	- Multi-Modal Traveller Information
      	- Dynamic Lane Management
      	- Variable Speed Limits
      	- Ramp Metering
      	- Hardshoulder Running
      	- Incident Warning and Management
      	- HGV Overtaking Ban
      	- Traffic Management for Corridors and Networks
      	- Intelligent and Secure Truck Parking
      
      
      Additional details: Where an RRP answers “what does the regulation oblige me to publish”, an RSP answers “what does a road operator need to exchange for this service to work end to end”. The thirteen service profiles listed above extend the RRP element sets with the operational content a service actually consumes, and they are drawn from deployment practice on the TEN-T core network corridors rather than from the text of a delegated act. Nothing in the delegated regulations requires an RSP-conformant publication, so the Status of this entry is recommended, not required. For a NAP they matter in two ways. First, they are the reference to hand a content provider that asks what to publish beyond the legal minimum. Second, they give the NAP a shared vocabulary for describing what a dataset is for: recording that a publication follows the Speed Limit Information or Intelligent and Secure Truck Parking profile tells a consumer far more than the data category alone. The IDACS profiles for alternative fuels infrastructure are part of the same RSP family and are described separately below.
      
      Related Documents:
      
      	- DATEX II Recommended Service Profiles – The full RSP set, including both the EIP and the IDACS families.
      	- EU EIP Reference Handbook for Service Deployment – Where the service descriptions the profiles formalise come from.
      	- NAPCORE DATEX II Workstream – Coordination of profile evolution and cross-domain alignment.
