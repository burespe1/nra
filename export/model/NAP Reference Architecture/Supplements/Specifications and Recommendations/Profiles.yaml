    note: |
      Type: Profile
      
      Full Name: UVARBox DATEX II profiles for Urban Vehicle Access Regulations
      
      Link: https://uvarbox.eu/
      
      Profile of: Technical Specification: DATEX II (TrafficRegulation and ControlledZone)
      
      Description: UVARBox digitised five types of UVARs for which five profiles are available as Recommended Service Profiles in the DATEX II webtool. The five UVAR types are low emission zones, limited traffic zones, pedestrian zones, congestion charging and parking zones.
      These profiles are based on an unstable version of the DATEX II TrafficRegulation model; users should be aware that non-interoperable changes are expected in a future stable v3 release of TrafficRegulation and ControlledZone.
      UVARBox website
      
      Additional details: Urban vehicle access regulations are set by individual cities, change often, and are published — when they are published at all — as prose on a municipal website. That makes them close to unusable for routing and for compliance checking, and it is why a NAP is frequently the only place where a UVAR becomes machine-readable at national scale. The five UVARBox profiles give a common encoding for the five regulation types, so that a low emission zone in one Member State is described the same way as one in another. The practical difficulty is that they rest on a part of the DATEX II model that is still moving: non-interoperable changes are expected in the stable v3 release of TrafficRegulation and ControlledZone. A NAP adopting these profiles should therefore plan for a migration and should record the DATEX II version each published UVAR dataset was produced against, rather than treating conformance as a permanent property.
      
      Related Documents:
      
      	- UVARBox website – Project results, the five profiles, and the supporting tooling.
      	- DATEX II Recommended Service Profiles – The profiles as published in the DATEX II documentation.
      	- DATEX II TrafficRegulation and ControlledZone specifications – The model the profiles constrain, and the source of the expected v3 changes.
    links:
