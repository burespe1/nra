    note: |
      Type: Profile
      
      Full Name: DATEX II Recommended Reference Profiles (RRP)
      
      Link: https://docs.datex2.eu/recommended-profiles/rrp/
      
      Profile of: Technical Specification: DATEX II (CEN/TS 16157 series)
      
      Description: Recommended Reference Profiles (RRPs) give a harmonised interpretation of the data categories in the delegated regulations adopted under priority actions (a), (b), (c) and (e) of the ITS Directive 2010/40/EU.
      This concerns the following Delegated Regulations:
      
      	- Delegated Regulation (EU) No 885/2013 (SSTP, Action E) — the reference profile for safe and secure truck parking
      	- Delegated Regulation (EU) No 886/2013 (SRTI, Action C)
      	- Delegated Regulation (EU) 2022/670 (RTTI, Action B), which repealed and replaced Delegated Regulation (EU) 2015/962
      	- Delegated Regulation (EU) 2017/1926 (MMTIS, Action A), as amended by Delegated Regulation (EU) 2024/490
      
      
      Additional details: An RRP fixes, for one delegated regulation, which DATEX II classes and attributes carry each mandated data category, and with what cardinality. That is the difference between publishing “in DATEX II” and publishing a payload that a consumer in another Member State can parse without a bilateral agreement: the regulation names the data category, the RRP names the elements. For a Data Platform NAP the RRP is the validation target for incoming publications under the regulation concerned. For a Metadata Directory NAP it is a conformance statement to be recorded in the metadata, so that a consumer can tell what a dataset contains before downloading it. Where a Member State extends an RRP with national elements, the extension should be declared in the metadata rather than added silently to the payload, otherwise the profile stops being a reliable expectation for cross-border consumers. RRPs are versioned against DATEX II releases, so an entry conforming to an RRP should also record which DATEX II version it was validated against.
      
      Related Documents:
      
      	- DATEX II Recommended Reference Profiles – Element sets per delegated regulation (SRTI, RTTI, MMTIS).
      	- DATEX II webtool – Interactive generation of a schema for a selected profile.
      	- CEN/TS 16157 (DATEX II) specifications – The underlying standard series from which the profiles are derived.
