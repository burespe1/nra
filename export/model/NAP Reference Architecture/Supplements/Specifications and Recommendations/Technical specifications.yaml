  - name: "S9 NeTEx"
    guid: "{477B7D19-AF4F-483d-BF7D-70FEBB8AE8BB}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Technical Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Type: Technical
      
      Sub-type: Technical
      
      Full Name: Network Timetable Exchange (NeTEx) – CEN/TS 16614
      
      Link: https://transmodel-cen.eu/index.php/netex/
      
      Description: NeTEx is a modular, XML-based CEN Technical Specification (CEN/TS 16614) for exchanging public transport data, including network topology, timetables, and fare structures. It is based on the Transmodel conceptual framework and supports multimodal, multilingual, and versioned data exchange between systems. NeTEx is designed for use in journey planning, timetable publishing, fare calculation, and real-time information systems.
      
      Additional details: Required for MMTIS compliance: NeTEx is the reference exchange format for the static public-transport data categories of Delegated Regulation (EU) 2017/1926, in the form of the EPIP and EPIAP profiles. A NAP must be able to accept, validate and expose NeTEx datasets, or to reference the national profiles built on it.
      
      Related Documents:
      
      	- NeTEx Overview – Transmodel – Official CEN portal with schema structure, parts, and implementation guidance.
      	- NeTEx GitHub Repository – XML schemas, UML models, and example datasets.
      	- DATA4PT NeTEx Wiki – Implementation support, validation tools, and national profile references.
      	- NeTEx European Passenger Information Profile (EPIP) – Subset of NeTEx elements required for MMTIS compliance.
      	- NeTEx National Implementations – DATA4PT – Overview of country-specific profiles and Level of Service (LOS) alignment.
      	- CEN/TS 16614 p1 – p6: Part 1: Public Transport Network topology; Part 2: Scheduled Timetables; Part 3: Fare Information; Part 4: European Passenger Information Profile – EPIP; Part 5: Alternative Modes Exchange Format; Part 6: European Passenger Information Accessibility Profile – EPIAP
