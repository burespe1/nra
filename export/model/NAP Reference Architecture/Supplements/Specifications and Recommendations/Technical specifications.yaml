    note: |
      Type: Technical Standard
      
      Full Name: mobilityDCAT-AP – Metadata Specification for Mobility Data Portals
      
      Link: https://w3id.org/mobilitydcat-ap/releases/
      
      Description: mobilityDCAT-AP is a metadata specification tailored for describing datasets and services in the mobility domain, particularly those published via National Access Points (NAPs) and other transport data portals. It extends the general-purpose DCAT-AP standard to support harmonised, machine-readable metadata for Intelligent Transport Systems (ITS) and mobility-related datasets. The specification enables cross-border discoverability, semantic interoperability, and metadata exchange across the European mobility data ecosystem.
      
      Additional details: Highly relevant for structuring and publishing metadata on National Access Points (NAPs). It enables consistent representation of transport datasets, data services, access conditions, update frequency, and conformance indicators — all essential for delegated ITS regulations. It supports RDF serialisation and is aligned with the EU Metadata Core Vocabulary, ensuring compatibility with the European Data Portal and NAPCORE interoperability targets.
      
      Related Documents:
      
      	- mobilityDCAT-AP Specification (current version) – Official release with RDF schemas, usage notes, and conformance rules.
      	- NAPCORE Metadata Workstream – Coordination activities and governance of mobilityDCAT-AP under the NAPCORE project.
      	- mobilityDCAT-AP GitHub Repository – Source files, issue tracking, and version history.
      	- mobilityDCAT-AP Vocabularies – Repository – source files for the vocabularies used in mobilityDCAT-AP
      	- mobilityDCAT-AP Generator Tool – Web interface for generating RDF metadata records.
      	- mobilityDCAT-AP wiki - official recommendation for implementation and guidelines
