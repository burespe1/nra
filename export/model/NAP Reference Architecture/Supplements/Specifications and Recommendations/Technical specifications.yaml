    tags:
      "revised": "2026-10-20"
    note: |
      Type: Technical
      
      Sub-type: Technical
      
      Full Name: IATA Standard Schedules Information Manual
      
      Link: https://www.iata.org/en/publications/manuals/standard-schedules-information/
      
      Description: SSIM is the authoritative IATA standard for the structured exchange of airline schedule data, slot coordination messages, and minimum connecting time (MCT) information. It defines the message formats, data elements and exchange conventions used by airlines, airports and slot coordinators to ensure consistency and interoperability in global aviation scheduling systems.
      
      Additional details: Relevant only where air services form part of the multimodal offer. SSIM is the source of scheduled air data feeding MMTIS journey planners. It is a subscription IATA standard, so a NAP will normally reference an SSIM-derived dataset rather than redistribute SSIM messages.
      
      Related Documents:
      
      	- SSIM Format Overview – Wikipedia – Summary of SSIM structure, use cases, and data hierarchy.
      	- IATA Publications Portal – Access to the latest SSIM editions and related manuals (subscription required).
  - name: "S7 INSPIRE"
    guid: "{5A823122-0DEE-44ec-A7CC-E8C8B7ED8F8D}"
    type: "DeploymentSpecification"
