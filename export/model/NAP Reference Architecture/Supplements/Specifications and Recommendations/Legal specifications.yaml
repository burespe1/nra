      Full Name: Commission Delegated Regulation (EU) 2022/670 of 2 February 2022 supplementing Directive 2010/40/EU of the European Parliament and of the Council with regard to the provision of EU-wide real-time traffic information services
      
      Link: https://eur-lex.europa.eu/eli/reg_del/2022/670/oj
      
      Description: This regulation defines binding technical specifications for the provision of EU-wide real-time traffic information (RTTI) services. It repeals Delegated Regulation (EU) 2015/962 and introduces updated requirements for the availability, accessibility, and reusability of static and dynamic road traffic data. Compared to the repealed act, it clarifies data categories, strengthens obligations for dynamic data updates, and adjusts performance requirements to reflect the current state of ITS deployment and operational data exchange practices. It enforces harmonised data formats and minimum service levels to ensure interoperability and continuity of RTTI services across Member States.
      
      Additional details: National Access Points (NAPs) are the mandatory interface for publishing RTTI-relevant datasets. Under this regulation, NAPs must:
      
      	- Provide machine-readable access to static and dynamic data elements listed in Annex I and II,
      	- Ensure data quality control and update frequency in line with Annex III,
      	- Use DATEX II or equivalent formats to guarantee semantic and syntactic interoperability,
      	- Support cross-border data exchange by aligning with EU-wide service coverage and latency thresholds,
      	- Maintain metadata and service documentation to enable automated discovery and integration by third parties.
      
      
      Related Documents:
      
      	- Implementing Guidelines for RTTI (EU) 2022/670 – Version 1.0 (2022) – Provides operational interpretation of the regulation, including data categories, update intervals, and validation procedures for NAP operators.
      	- DATEX II Technical Specification (CEN/TS 16157) – Defines the mandatory data model for RTTI exchange, including profiles for event, measurement, and situation publications.
      	- DATEX II Reference Profile for RTTI – Defines the harmonised data model for compliant RTTI data exchange.
      	- RTTI 5-Star Rating Specification v1.0 (TISA, October 2025) – A voluntary international quality assessment framework for evaluating the accuracy, completeness, and timeliness of real-time traffic information provided by road operators and public authorities to ITS service providers. The specification defines five quality tiers with clear thresholds, where the 3-star level aligns with the minimum quality requirements referenced in Articles 5(2), 6(2) and 7(2) of Delegated Regulation (EU) 2022/670 (RTTI). Version 1.0 covers three priority use cases: speed limits, roadworks, and road closures.
