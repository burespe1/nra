      Full Name: Commission Delegated Regulation (EU) No 886/2013 of 15 May 2013 supplementing Directive 2010/40/EU with regard to data and procedures for the provision, where possible, of road safety-related minimum universal traffic information free of charge to users
      
      Link: https://eur-lex.europa.eu/eli/reg_del/2013/886/oj
      
      Description: This regulation defines the minimum requirements for the provision of safety-related traffic information (SRTI) services across the EU road network. It mandates that specific categories of safety-critical events (e.g. wrong-way drivers, unprotected accident areas, reduced visibility) be made available to users free of charge, where possible. It sets obligations for data collection, processing, quality assurance, and dissemination, and requires Member States to ensure interoperability and continuity of service through harmonised procedures and formats.
      
      Additional details: NAPs are the designated interface for publishing SRTI-relevant data. They must provide machine-readable access to static and dynamic datasets covering the event categories defined in the regulation. Data must comply with update frequency, latency, and quality requirements. NAPs must also support metadata publication, service documentation, and conformity assessment. The harmonised DATEX II Reference Profile for SRTI must be used to ensure semantic and syntactic interoperability across Member States.
      
      Related Documents:
      
      	- European Commission SRTI Guidance – Technical guidance and implementation context under the ITS Directive.
      	- DATEX II Reference Profile for SRTI – Defines the mandatory data elements and structure for compliant SRTI data exchange.
      	- NAPCORE SRTI Workstream Summary (PDF) – Implementation overview and harmonisation activities across Member States.
