    note: |
      Type: Legal
      Full Name: Commission Regulation (EU) No 1305/2014 of 11 December 2014 on the technical specification for interoperability relating to the telematics applications for freight subsystem of the rail system in the European Union and repealing Regulation (EC) No 62/2006
      Link: https://eur-lex.europa.eu/eli/reg/2014/1305/oj
      Description: This regulation establishes the mandatory Technical Specification for Interoperability (TSI) for the rail telematics applications for freight (TAF) subsystem, applicable to railway undertakings, infrastructure managers, wagon keepers, and other actors involved in freight operations. It replaces Regulation (EC) No 62/2006 and introduces extended message sets, a structured implementation governance model (including Change Control Management), and mandatory reference data alignment. It defines XML-based message exchange formats, interoperability interfaces, data models, and operational procedures to ensure seamless, real-time information sharing between rail freight stakeholders.
      Additional details: When a National Access Point supports integration with rail freight data services, this regulation becomes binding for any data publication or relay function that involves TAF-compliant messages. NAPs interacting with these datasets must ensure message conformity with TAF TSI schemas, maintain full alignment with central reference data registries (e.g. company and location codes), and apply consistent semantic mapping if integrating with other ITS domains. NAPs must not alter the structure, content, or identification of regulated message types during conversion to other formats. Data quality assurance and interface documentation must be traceable to the latest applicable TAF TSI baseline.
      Related Documents:
      
      	- ERA TAF TSI Portal – Maintained by the European Union Agency for Railways; includes official message catalogues, implementation baselines, and interface control documents.
      	- TAF TSI Implementation Reports – National-level deployment progress and milestone documentation, including XML mapping guides.
      	- TAP/TAF Reference Data Portal – Central management system for code lists (e.g. RICS location codes, company codes) required under the regulation.
      	- Commission Implementing Regulation (EU) 2021/541 – Updates the TAF TSI annexes; includes revised process flow diagrams and implementation dates.
