      Full Name: Regulation (EU) 2023/1804 of the European Parliament and of the Council of 13 September 2023 on the deployment of alternative fuels infrastructure, and repealing Directive 2014/94/EU
      
      Link: https://eur-lex.europa.eu/eli/reg/2023/1804/oj
      
      Consolidated version: https://eur-lex.europa.eu/eli/reg/2023/1804/2026-01-08
      
      Description: Regulation (EU) 2023/1804, the Alternative Fuels Infrastructure Regulation (AFIR), repeals and replaces Directive 2014/94/EU. It establishes binding targets for the deployment of publicly accessible recharging and refuelling infrastructure for electric and hydrogen vehicles, vessels, and aircraft across the EU. It aims to ensure full interoperability, user-friendliness, and data transparency to support the EU’s climate and mobility goals.
      
      Additional details: While AFIR does not explicitly mandate publication via NAPs, it requires real-time and static data on alternative fuels infrastructure (e.g. location, availability, pricing, technical characteristics) to be made publicly accessible in machine-readable formats. This aligns with the role of NAPs under the ITS Directive and its delegated acts, making them a natural access point for such datasets—especially where they support routing, parking, or multimodal travel services.
      
      Related Documents:
      
      	- Directive 2014/94/EU– Alternative Fuels Infrastructure Directive (repealed) – The predecessor to AFIR, it laid the groundwork for infrastructure deployment and data requirements. Still useful for understanding the evolution of obligations, especially where national frameworks are based on it.
      	- STF Guidelines for Tender Procedures (2025) — Published by the Sustainable Transport Forum in January 2025, these guidelines support public authorities at all governance levels in designing, deploying, and overseeing tenders for publicly accessible electric recharging infrastructure for cars and vans. They provide practical orientation on AFIR compliance in procurement processes.
      	- EAFO Policy Recommendations — The European Alternative Fuels Observatory maintains continuously updated implementation guidance, data dashboards, and policy recommendations for AFIR deployment across Member States. This replaces the earlier static implementation guidelines published in 2024.
