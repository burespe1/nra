      Type: Legal
      Full Name: Directive (EU) 2023/2661 of the European Parliament and of the Council of 22 November 2023 amending Directive 2010/40/EU on the framework for the deployment of Intelligent Transport Systems in the field of road transport and for interfaces with other modes of transport
      Link: https://eur-lex.europa.eu/eli/dir/2023/2661/oj
      Description: Directive (EU) 2023/2661 is the recast of the original ITS Directive 2010/40/EU. It updates the legal framework for the deployment of Intelligent Transport Systems (ITS) in road transport and their interfaces with other transport modes. The recast reflects technological advancements and policy priorities such as multimodal mobility, digitalisation, and safety. It introduces mandatory availability of certain transport data in digital formats and strengthens interoperability and data accessibility across the EU.
      Additional details: National Access Points (NAPs), as defined under the ITS Directive, are central to implementing the recast. The updated directive reinforces their role as mandatory digital platforms for publishing and accessing static and dynamic transport data. It expands the scope of data types to be made available (e.g. speed limits, roadworks, multimodal travel info) and introduces stricter requirements for data quality, timeliness, and accessibility, including through APIs and machine-readable formats.
      Related Documents:
      
      	- Commission Delegated Regulation (EU) No 885/2013 – On the provision of information services for safe and secure parking places for trucks and commercial vehicles.
      	- Commission Delegated Regulation (EU) No 886/2013 – On the provision of road safety-related minimum universal traffic information.
      
      
      	- Commission Delegated Regulation (EU) 2015/962 – On the provision of EU-wide real-time traffic information services. Partially superseded by 2022/670 but still relevant for transitional provisions.
      	- Commission Delegated Regulation (EU) 2017/1926 – On the provision of EU-wide multimodal travel information services.
      	- Commission Delegated Regulation (EU) 2022/670 – Updates and replaces parts of 2015/962; sets new specifications for real-time traffic information services.
      	- Delegated Regulation (EU) 2024/490 – Amends and updates the original 2017/1926 regulation, refining data categories, deadlines, and technical specifications for MMTIS implementation.
      	- Commission Delegated Regulation (EU) 2022/1012 – Adds further specifications for the availability and exchange of parking data; complements but does not repeal 885/2013.
