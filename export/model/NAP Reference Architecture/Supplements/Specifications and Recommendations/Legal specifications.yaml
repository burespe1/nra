  - name: "L16 Data Governance Act"
    guid: "{FB40A081-6B20-4F80-8310-AD9B4C0B53E0}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Legal Specification"
