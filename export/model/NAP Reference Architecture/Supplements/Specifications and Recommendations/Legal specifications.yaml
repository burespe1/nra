    note: |
      Type: Legal
      
      Full Name: Regulation (EU) 2022/868 of the European Parliament and of the Council of 30 May 2022 on European data governance and amending Regulation (EU) 2018/1724 (Data Governance Act)
      
      Link: https://eur-lex.europa.eu/eli/reg/2022/868/oj
      
      Description: The Data Governance Act sets the conditions for reusing protected public sector data — data subject to third-party rights such as commercial confidentiality, statistical confidentiality, intellectual property or the protection of personal data — which the Open Data Directive leaves out of scope. It also creates a notification and supervision regime for data intermediation services and a framework for data altruism organisations.
      
      Additional details: Two questions follow for a NAP, and both have to be answered deliberately. The first is whether the NAP handles protected data at all. Where it mediates access to datasets that are not open — commercially sensitive floating-car data, say, or data carrying third-party rights — the DGA sets the conditions under which reuse may be allowed, including non-exclusivity and non-discrimination, and expects the body to be able to offer a secure processing environment or anonymisation. The second is whether the NAP is itself a data intermediation service. A service whose purpose is to establish commercial data-sharing relationships between data holders and data users must notify the competent authority and then falls under the DGA’s neutrality conditions, which forbid it from using the intermediated data for its own purposes. A NAP that publishes metadata pointing to open datasets is not an intermediation service; one that brokers access agreements to protected data may well be. The determination changes what the NAP operator is permitted to do with what passes through the platform, so it belongs in the Organisational View rather than being treated as a legal footnote.
      
      Related Documents:
      
      	- Regulation (EU) 2023/2854 – Data Act – The companion act on access to connected-product data (L15).
      	- Directive (EU) 2019/1024 – Open Data – Covers unprotected public sector data; the DGA covers what it excludes (L13).
      	- European Commission – Data Governance Act explanatory page – Scope, notification duties and the register of intermediation services.
    links:
