      Full Name: Directive (EU) 2016/2102 of the European Parliament and of the Council of 26 October 2016 on the accessibility of the websites and mobile applications of public sector bodies
      
      Link: https://eur-lex.europa.eu/eli/dir/2016/2102/oj
      
      Description: Directive (EU) 2016/2102 on the accessibility of websites and mobile applications of public sector bodies ensures that digital services are usable by all, including people with disabilities. It is directly relevant to National Access Points, which Directive 2010/40/EU and its amendment require Member States to provide as digital platforms for access to transport-related data.
      
      Additional details: Since NAPs are typically operated by public authorities or on their behalf, they fall under the scope of the Web Accessibility Directive. This means that the websites and mobile apps used for publishing transport data—such as real-time traffic, public transport schedules, or multimodal travel information—must comply with accessibility standards like EN 301 549.
      
      Related Documents:
      
      	- Commission Implementing Decision (EU) 2018/1523: Establishing a model accessibility statement
      	- Commission Implementing Decision (EU) 2018/2048: Establishing the monitoring methodology and arrangements for reporting by Member States
      	- Directive (EU) 2019/882 – European Accessibility Act – Extends accessibility duties to products and services beyond the public sector; likely to reach NAP front-ends offering services to consumers. Its applicability to NAPs is still to be decided by the work item.
      	- EN 301 549 – Accessibility requirements for ICT products and services – The harmonised standard named in the Directive; the concrete conformance target for a NAP web interface.
