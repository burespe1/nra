  - name: "L10 [Title Pending] – Data Specifications for Alternative Fuels Infrastructure (AFIR)"
    guid: "{B7ADA655-593E-48ce-A50C-97CB4684F009}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Legal Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Type: Legal (Implementing Act – in preparation)
      Full Name: Commission Implementing Regulation laying down technical specifications regarding the format, frequency, and quality of data on alternative fuels infrastructure pursuant to Regulation (EU) 2023/1804
      Link: https://ec.europa.eu/info/law/better-regulation/have-your-say/initiatives/14345-_en
      Description: This implementing regulation will define harmonised technical specifications for the format, update frequency, and quality of data relating to publicly accessible alternative fuels infrastructure in the EU. It supports Regulation (EU) 2023/1804 (AFIR) and applies to electric recharging points, hydrogen refuelling stations, and other designated fuel types. The regulation aims to standardise machine-to-machine data exchange and improve accessibility, reliability, and cross-border interoperability.
      Additional details: The act will mandate the use of DATEX II for structured data exchange by April 2026. Static data (location, capacity, connector types, operational status) must be updated at least every 24 hours; dynamic data (availability, malfunction, real-time energy status) must be refreshed at intervals no greater than 1 minute. EV charging point operators will be required to disclose roaming capability, smart charging readiness, and communication interfaces. Hydrogen stations must signal low-fuel warnings (<100 kg). NAPs will act as the central access points for compliant data publication and retrieval.
      Related Documents:
      
      	- Regulation (EU) 2023/1804 – AFIR – Legal base establishing mandatory deployment and data reporting obligations for alternative fuels infrastructure.
      	- Public Consultation Summary – Data Specification Initiative – Commission platform outlining scope and stakeholder feedback.
      	- DATEX II Electric Vehicle Charging Profile – Technical profile defining data elements and structure for compliant AFIR data exchange.
