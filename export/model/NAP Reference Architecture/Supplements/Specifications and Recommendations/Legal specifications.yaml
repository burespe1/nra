  - name: "L5 Regulation (EU) 2017/1926 - MMTIS"
    guid: "{9A0AAF44-DAED-4b89-81B3-12DD2B666F55}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Legal Specification"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    note: |
      Type: Legal
      Full Name: Commission Delegated Regulation (EU) 2017/1926 of 31 May 2017 supplementing Directive 2010/40/EU of the European Parliament and of the Council with regard to the provision of EU-wide multimodal travel information services.
      Link: https://eur-lex.europa.eu/eli/reg_del/2017/1926/oj
      Description: It establishes specifications for the provision of EU-wide multimodal travel information services (MMTIS). The regulation aims to ensure that static and dynamic travel and traffic data from various transport modes (road, rail, air, maritime, etc.) are made accessible in a harmonised, interoperable, and machine-readable format to support seamless multimodal journey planning across the EU.
      National Access Points (NAPs) are the designated platforms for publishing and accessing the datasets required under this regulation. MMTIS data providers—such as transport operators, authorities, and infrastructure managers—must make their data available via the NAP in accordance with the technical and organisational requirements set out in the regulation. This includes metadata, data formats, update frequencies, and accessibility conditions. NAPs thus serve as the core infrastructure for enabling compliance and interoperability under MMTIS.
      Additional details: https://transport.ec.europa.eu/transport-themes/smart-mobility/road/its-directive-and-action-plan/multimodal-travel-information_en
      Related Documents:
      
      	- Delegated Regulation (EU) 2024/490 – Amends and updates the original 2017/1926 regulation, refining data categories, deadlines, and technical specifications for MMTIS implementation.
      	- MMTIS Implementation Handbook (2024) – A non-binding guidance document published by the European Commission to support Member States and stakeholders in applying the regulation. It includes practical examples, timelines, and FAQs.
      	- INSPIRE-MMTIS Technical Report (JRC, 2019) – Analyses overlaps between MMTIS and the INSPIRE Directive, offering recommendations on harmonising geospatial and transport data standards in the NAP context
