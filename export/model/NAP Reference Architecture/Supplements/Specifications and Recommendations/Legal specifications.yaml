  - name: "L12 Directive (EU) 2022/2555 - NIS2"
    guid: "{4960CAB3-98F8-4f09-94E1-62AFA0954523}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Legal Specification"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    note: |
      Type: Legal
      Full Name: Directive (EU) 2022/2555 of the European Parliament and of the Council of 14 December 2022 on measures for a high common level of cybersecurity across the Union, amending Regulation (EU) No 910/2014 and Directive (EU) 2018/1972, and repealing Directive (EU) 2016/1148 (NIS 2 Directive)
      Link: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
      Description: Directive (EU) 2022/2555, also known as the NIS 2 Directive, establishes a common framework for cybersecurity risk management and reporting obligations across the EU. It replaces the original NIS Directive (EU) 2016/1148 and significantly expands the scope of entities subject to cybersecurity requirements, including operators of essential and important services in sectors such as transport, energy, and digital infrastructure.
      Additional details: National Access Points (NAPs), as defined under Directive 2010/40/EU, typically qualify as essential or important entities under NIS 2 if they are operated by public authorities or provide critical digital services related to transport data exchange. As such, they are subject to obligations including Implementation of technical and organizational cybersecurity measures, incident notification to national CSIRTs or competent authorities and Participation in cybersecurity supervision and enforcement mechanisms.
      Related Documents:
      
      	- Directive (EU) 2016/1148 – The original NIS Directive, now repealed, provides historical context and may still influence transitional arrangements.
      	- Commission Recommendation (EU) 2017/1584 – Offers guidance on coordinated response to large-scale cybersecurity incidents, relevant for NAPs involved in cross-border data exchange.
      	- Regulation (EU) 2019/881 (Cybersecurity Act) – Establishes the EU cybersecurity certification framework, which may apply to ICT products and services used by NAPs.
      	- ENISA Guidelines and Sectoral Guidance – While not legally binding, ENISA’s technical guidance supports implementation of NIS 2 requirements in transport and digital infrastructure sectors.
    links:
