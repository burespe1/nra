      Full Name: Directive (EU) 2022/2555 of the European Parliament and of the Council of 14 December 2022 on measures for a high common level of cybersecurity across the Union, amending Regulation (EU) No 910/2014 and Directive (EU) 2018/1972, and repealing Directive (EU) 2016/1148 (NIS 2 Directive)
      
      Link: https://eur-lex.europa.eu/eli/dir/2022/2555/oj
      In force from: 27.12.2022 (Directive (EU) 2022/2555 has not been amended; no consolidated version exists)
      
      Description: Directive (EU) 2022/2555, also known as the NIS 2 Directive, establishes a common framework for cybersecurity risk management and reporting obligations across the EU. It replaces the original NIS Directive (EU) 2016/1148 and significantly expands the scope of entities subject to cybersecurity requirements, covering essential and important entities in sectors such as transport, energy and digital infrastructure. “Operator of essential services” was the term of the original NIS Directive; NIS2 classifies entities as essential or important instead.
      
      Additional details: National Access Points (NAPs), as defined under Directive 2010/40/EU, typically qualify as essential or important entities under NIS 2 if they are operated by public authorities or provide critical digital services related to transport data exchange. As such, they are subject to obligations including the implementation of technical and organisational cybersecurity measures, incident notification to the national CSIRT or competent authority, and participation in cybersecurity supervision and enforcement mechanisms. Commission Implementing Regulation (EU) 2024/2690 of 17 October 2024 lays down the technical and methodological requirements for those measures and specifies when an incident is to be considered significant. It applies directly to entities in the digital infrastructure sector — the classification a NAP operator will most often fall under — and is therefore the act that states what actually has to be implemented.
      
      Related Documents:
      
      	- Directive (EU) 2016/1148 – The original NIS Directive, now repealed, provides historical context and may still influence transitional arrangements.
      	- Commission Recommendation (EU) 2017/1584 – Offers guidance on coordinated response to large-scale cybersecurity incidents, relevant for NAPs involved in cross-border data exchange.
      	- Regulation (EU) 2019/881 (Cybersecurity Act) – Establishes the EU cybersecurity certification framework, which may apply to ICT products and services used by NAPs.
      	- ENISA Technical Implementation Guidance on cybersecurity risk-management measures (v1.0, June 2025) – Non-binding guidance mapping the measures of Implementing Regulation (EU) 2024/2690 to concrete controls and to existing standards; the reference document for entities in the digital infrastructure sector.
    links:
