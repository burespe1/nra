      Type: Legal
      
      Full Name: Regulation (EU) 2023/2854 of the European Parliament and of the Council of 13 December 2023 on harmonised rules on fair access to and use of data (Data Act)
      
      Link: https://eur-lex.europa.eu/eli/reg/2023/2854/oj
      
      Description: The Data Act lays down horizontal rules on who may access the data generated by connected products and related services, on the terms on which data holders must make it available, on unfair contractual terms in data-sharing agreements, on access by public sector bodies in cases of exceptional need, and on switching between data processing services. It has applied since 12 September 2025.
      
      Additional details: The Data Act matters to a NAP in three ways, none of them an obligation on the NAP itself. First, it is the framework on which the sector rules are now built: TEL TSI (L10) states expressly that rail data sharing rests on it, and later mobility acts are likely to do the same. Second, it governs the upstream supply. Much of the dynamic data a NAP would like to carry — vehicle-generated data, charging-session data, connected-vehicle telemetry — is data from connected products, and it is the Data Act, not the ITS Directive, that decides on what terms a user can have it made available to a third party. Third, the provisions on public sector access in cases of exceptional need give a public authority a route to data it could not otherwise obtain, which is relevant where the NAP is operated by such an authority. A NAP operator should not read the Data Act as creating a publication duty, because it does not; but should expect content providers to invoke it when negotiating the terms on which they publish.
      
      Related Documents:
      
      	- Legal Specification: L10 – TEL TSI – The first mobility act to build its data-sharing obligations explicitly on the Data Act.
      	- Regulation (EU) 2022/868 – Data Governance Act – The companion act governing reuse of protected data and data intermediation (L16).
      	- European Commission – Data Act explanatory page – Scope, application dates and guidance.
    links:
