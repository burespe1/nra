  - name: "L7 Regulation (EU) 2016/679 - GDPR"
    guid: "{B5E9322B-D985-449e-A4A9-D740A3AEF211}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Legal Specification"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    note: |
      Type: Legal
      Full Name: Regulation (EU) 2016/679 of the European Parliament and of the Council of 27 April 2016 on the protection of natural persons with regard to the processing of personal data and on the free movement of such data, and repealing Directive 95/46/EC (General Data Protection Regulation)
      Link: https://eur-lex.europa.eu/eli/reg/2016/679/oj
      Description: Regulation (EU) 2016/679, known as the General Data Protection Regulation (GDPR), establishes a uniform legal framework across the EU for the protection of personal data. It governs how personal data of natural persons is collected, processed, stored, and shared, and grants individuals enforceable rights over their data. It applies to both public and private entities that process personal data within the EU or target EU residents.
      Additional details: Even though NAPs don't generate or determine the content of the data they distribute, they may still be considered to be processing personal data if that data includes, for instance, vehicle trajectories, location-time stamps, or user-specific transport service data—especially in multimodal travel information services or dynamic datasets.
      In GDPR terms, this processing—listing, storing, or facilitating access to personal data on behalf of data holders—may place the NAP operator in the role of a data processor, or in some setups, even a joint controller. This depends on the nature of its involvement, contractual arrangements, and whether it has any influence over the purpose or means of processing. Therefore, under GDPR:
      
      	- A Data Processing Agreement (DPA) is needed between the NAP operator and each data controller.
      	- The NAP must implement security and organisational safeguards (Art. 32 GDPR).
      	- If the platform enables discovery or access to personal data, data subject rights (e.g. access, erasure) must be supported—typically redirected to the original controller.
      
      If the National Access Point (NAP) merely provides metadata listings or pointers (e.g. links, APIs) to datasets without storing, transforming, or transmitting personal data, and has no access to the actual payload or content, then it’s technically not processing personal data within the meaning of Article 4(2) of the GDPR. In such cases, a Data Processing Agreement (DPA) would indeed not be required, as the NAP does not act as a processor or controller.
      Related Documents:
      
      	- Guidelines 01/2020 on Processing Personal Data in the Context of Connected Vehicles and Mobility-Related Applications (EDPB) – Clarifies how GDPR applies to vehicle-generated data, location tracking, and ITS services.
      	- Guidelines 07/2020 on the Concepts of Controller and Processor (EDPB) – Helps define roles and responsibilities of NAP operators and data providers under GDPR.
      	- Guidelines 06/2020 on the Interplay of the Second Payment Services Directive and the GDPR (EDPB) – While sector-specific, it illustrates how GDPR interacts with domain-specific EU legislation—relevant for interpreting overlaps with ITS legal acts.
      	- Article 29 Working Party Opinion 13/2011 on Geolocation Services – Though predating GDPR, it remains informative for interpreting location data processing in transport contexts.
    links:
      - "Abstraction → L.7.1 GDPR compliance"  # {51FE5990-62EE-43ce-A5E4-5B4DEC98F027} → {20EB6C72-5D11-49f7-8692-86134D5D4931}
