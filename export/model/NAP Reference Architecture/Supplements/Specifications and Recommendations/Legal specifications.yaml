      Type: Legal
      Full Name: Commission Delegated Regulation (EU) 2024/490 of 29 November 2023 amending Delegated Regulation (EU) 2017/1926 supplementing Directive 2010/40/EU with regard to the provision of EU-wide multimodal travel information services
      Link: https://eur-lex.europa.eu/eli/reg_del/2024/490/oj
      Description: This regulation amends Delegated Regulation (EU) 2017/1926 by expanding the scope of mandatory data accessibility for EU-wide multimodal travel information services (MMTIS). It introduces new obligations for the availability of dynamic, historic, and observed datasets, and strengthens requirements for data quality, update frequency, and interoperability. The amendment supports the European Green Deal and Sustainable and Smart Mobility Strategy by enhancing the usability of multimodal travel services and enabling better integration of active modes (e.g. walking, cycling) and real-time operational data.
      Additional details: NAPs must ensure machine-readable access to newly mandated datasets, including dynamic data (e.g. delays, disruptions), historic performance data, and observed occupancy levels. The regulation reinforces the use of harmonised formats and metadata, and requires service providers to maintain data accuracy and timeliness. The amendment also introduces provisions for monitoring compliance and supporting cross-border continuity of MMTIS services.
      Related Documents:
      
      	- Delegated Regulation (EU) 2017/1926 – MMTIS – Original legal act establishing the MMTIS framework.
      	- DATEX II MMTIS Profile (Draft) – Defines the data model for compliant multimodal travel information exchange.
      	- NeTEx European Passenger Information Profile (EPIP) – Defines the subset of NeTEx (CEN/TS 16614) elements required for compliance with MMTIS obligations, including static, dynamic, and accessibility-related data.
      	- NAPCORE MMTIS Data Dictionary (NeTEx/SIRI Mapping) – Provides alignment between MMTIS data categories and NeTEx/SIRI elements, supporting harmonised implementation across Member States.
      	- DATA4PT National Implementations – NeTEx Profiles Overview – Inventory of national and transnational NeTEx and SIRI profiles, including the Czech Republic’s specification status. It outlines profile alignment with the European Passenger Information Profile (EPIP) and categorises data coverage by Level of Service (LOS) in accordance with MMTIS Regulation (EU) 2024/490.
