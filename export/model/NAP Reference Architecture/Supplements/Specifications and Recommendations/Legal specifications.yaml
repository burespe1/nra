      Type: Legal
      
      Full Name: Commission Implementing Regulation (EU) 2023/138 of 21 December 2022 laying down a list of specific high-value datasets and the arrangements for their publication and re-use
      
      Link: https://eur-lex.europa.eu/eli/reg_impl/2023/138/oj
      
      Description: This implementing regulation makes the high-value dataset provisions of the Open Data Directive operational. It lists the specific datasets, in six thematic categories including mobility and geospatial data, that public sector bodies must make available free of charge, in machine-readable formats, through application programming interfaces and as a bulk download, under an open licence no more restrictive than CC BY 4.0. It also sets the arrangements for their publication, including the metadata requirements.
      
      Additional details: This is the act that turns “transport is a high-value category” into a concrete list, and it is the reason a NAP cannot charge for, or restrict access to, the datasets it covers where those datasets are held by a public sector body. Three obligations bear directly on a NAP. An API is mandatory rather than optional, so a NAP offering only file download does not comply. A bulk download must be offered as well as the API, so an API-only NAP does not comply either. And the metadata must be discoverable through the national open data portal, which in practice means the NAP’s metadata has to be harvestable in DCAT-AP. Where a dataset is covered both by an ITS delegated regulation and by this act, the stricter requirement governs — usually this one, because it forbids charging outright.
      
      Related Documents:
      
      	- Directive (EU) 2019/1024 – Open Data – The parent act (L13); this regulation implements its Article 14.
      	- data.europa.eu high-value dataset guidance – Publication requirements, including the HVD metadata conventions.
      	- DCAT-AP – The metadata vocabulary in which the publication arrangements are expressed.
    links:
