      Full Name: Directive (EU) 2019/1024 of the European Parliament and of the Council of 20 June 2019 on open data and the re-use of public sector information (recast)
      
      Link: https://eur-lex.europa.eu/eli/dir/2019/1024/oj
      
      Description: Directive (EU) 2019/1024, also known as the Open Data Directive, establishes binding rules for the release and reuse of public sector information across the EU. It obliges Member States to ensure that data produced, held, or funded by public bodies is made available in machine-readable formats, via Application Programming Interfaces (APIs), and under open licences with minimal legal, technical, or financial restrictions. It defines categories of high-value datasets, including transport, which are subject to specific publication and reuse obligations.
      
      Additional details: In the context of National Access Points (NAPs) under Directive 2010/40/EU (ITS Directive), the Open Data Directive applies where the transport-related data hosted or disseminated via NAPs is produced or funded by public sector bodies. It imposes legal obligations on such data to be openly licensed, structured for automatic processing, accessible through APIs, and free of charge. This directly impacts the way NAPs must provide access to static and dynamic ITS data, ensuring compliance with both the ITS legal framework and the horizontal open data obligations. If the NAP environment includes private stakeholders, applicability may depend on whether the data provision is mandated by law or publicly funded.
      
      Related Documents:
      
      	- Commission Implementing Regulation (EU) 2023/138 – Defines high-value datasets, including transport, and mandates their free availability via APIs and bulk download.
      	- Data Governance Act (Regulation (EU) 2022/868) – Supports secure data sharing across sectors, relevant for public-private cooperation in NAPs.
      	- INSPIRE Directive (2007/2/EC) – Ensures interoperability of geospatial data, often used in transport datasets.
      	- ITS Delegated Regulations – Specify data types and access requirements under Directive 2010/40/EU, aligning with open data principles.
