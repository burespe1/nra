  - name: "L11 Regulation (EU) 2025/655 – AFIR Data Specifications"
    guid: "{BB34947F-7458-46e4-B45C-28338EDB244A}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Legal Specification"
    status: "Proposed"
    version: "1.0"
    order: 0
    note: |
      Type: Legal
      Full Name: Commission Implementing Regulation (EU) 2025/655 of 2 April 2025 laying down rules for the application of Regulation (EU) 2023/1804 as regards specifications and procedures relating to the availability and accessibility of data on alternative fuels infrastructure
      Link: https://eur-lex.europa.eu/eli/reg_impl/2025/655/oj
      Description: This regulation establishes binding technical specifications and procedures for the provision of data on publicly accessible alternative fuels infrastructure under Regulation (EU) 2023/1804 (AFIR). It defines harmonised requirements for data format, update frequency, quality, and accessibility to ensure interoperability and transparency across the EU. The act applies to electric recharging points, hydrogen refuelling stations, and other AFIR-regulated infrastructure types.
      Additional details: Operators must publish static data (e.g. location, connector types, access conditions) with a maximum update interval of 24 hours, and dynamic data (e.g. availability, operational status) with a maximum latency of 1 minute. The use of the DATEX II format is mandatory from 14 April 2026. Additional obligations include disclosure of roaming capability, smart charging features, and hydrogen low-fuel alerts (<100 kg). NAPs serve as the designated access points for compliant data exchange.
      Related Documents:
      
      	- Regulation (EU) 2023/1804 – AFIR – Legal base establishing mandatory deployment and data reporting obligations for alternative fuels infrastructure.
      	- Public Consultation Summary – Data Specification Initiative – Commission platform outlining scope and stakeholder feedback.
      	- DATEX II Electric Vehicle Charging Profile – Technical profile defining data elements and structure for compliant AFIR data exchange.
      	- Commission News Release – 11 April 2025 – Summary of the adopted implementing regulation and legislative package.
