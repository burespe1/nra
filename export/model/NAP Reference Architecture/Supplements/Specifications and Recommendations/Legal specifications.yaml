    note: |
      Type: Legal
      Full Name: Commission Delegated Regulation (EU) No 885/2013 of 15 May 2013 supplementing Directive 2010/40/EU of the European Parliament and of the Council with regard to the provision of information services for safe and secure parking places for trucks and commercial vehicles
      Link: https://eur-lex.europa.eu/eli/reg_del/2013/885/oj
      Description: This regulation defines functional and technical specifications for the provision of information services related to safe and secure parking places for trucks and commercial vehicles (SSTP). It supplements Directive 2010/40/EU (ITS Directive) and establishes requirements for static and dynamic data collection, dissemination, quality assurance, and compliance assessment. It applies to parking areas located along the trans-European road network (TERN) and aims to improve driver safety, rest compliance, and freight security through harmonised digital services.
      Additional details: NAPs are designated as access points for SSTP-related data. Where Member States or service providers implement SSTP services, NAPs must ensure machine-readable access to static data (e.g. location, capacity, equipment, security features) and dynamic data (e.g. availability, occupancy). Data must conform to the regulation’s quality, update frequency, and metadata requirements. NAPs must also support compliance monitoring by national bodies and provide documentation on data coverage, dissemination methods, and service reliability.
      Related Documents:
      
      	- FAQ on Delegated Regulation (EU) No 885/2013 – European Commission – Clarifies scope, applicability, and compliance procedures for SSTP services under the ITS Directive.
      	- DATEX II Reference Profile for SSTP (RRP 885/2013) – Defines the mandatory data elements and structure for static and dynamic SSTP data exchange, based on CEN/TS 16157-6:2022.
