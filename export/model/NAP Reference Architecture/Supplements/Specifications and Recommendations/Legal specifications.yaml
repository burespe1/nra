  - name: "L9 Regulation (EU) 2018/1724 - Single Digital Gateway"
    guid: "{7FE3EFFF-05E1-4d46-83EE-48FE16A10E46}"
    type: "DeploymentSpecification"
    stereotype: "FRAME_Specification"
    keywords: "Legal Specification"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    note: |
      Type: Legal
      Full Name: Regulation (EU) 2018/1724 of the European Parliament and of the Council of 2 October 2018 establishing a single digital gateway to provide access to information, to procedures and to assistance and problem-solving services and amending Regulation (EU) No 1024/2012
      Link: https://eur-lex.europa.eu/eli/reg/2018/1724/oj
      Description: Regulation (EU) 2018/1724, known as the Single Digital Gateway (SDG) Regulation, establishes a unified EU-wide portal—Your Europe—that offers cross-border users streamlined access to public services, procedures, and information. The regulation aims to improve the usability, accessibility, and multilingual availability of digital public services. It also introduces the once-only principle, meaning that public administrations should not ask citizens or businesses to resubmit information already provided to another authority.
      While not transport-specific, the regulation applies to National Access Points (NAPs) when they serve as public-facing digital platforms operated by authorities. If NAPs provide access to regulated datasets or procedures relevant to cross-border users, they must meet accessibility, quality, and multilingual standards. The once-only principle also supports federated data publishing, reducing duplication between NAPs and national open data portals.
      Additional details: The SDG’s once-only principle supports a more streamlined and federated approach to data publishing. The goal is to avoid redundant data publication and collection—public sector data should be published once and reused or accessed via interoperable systems rather than duplicated. This has practical implications for NAPs and open data portals:
      
      	- Transport datasets required under ITS delegated regulations must be made available via the NAP.
      	- The same datasets may also be subject to publication obligations under the Open Data Directive, typically via a national open data portal.
      
      To resolve this, Member States should implement a federated data publishing model where the NAP serves as the authoritative data provider and the open data portal references or harvests its metadata. This avoids duplication while ensuring discoverability, open licensing, and machine-readability under both legal regimes.
      Related Documents:
      
      	- Your Europe Portal – The operational interface of the Single Digital Gateway, which may link to or integrate with national portals like NAPs for transport-related procedures.
      	- Commission Implementing Regulation (EU) 2020/1463 – Sets out detailed rules on the quality of information and procedures provided via the gateway, including accessibility, findability, and user-centric design—relevant for NAP interfaces.
      	- Commission Implementing Regulation (EU) 2022/1121 – Defines the technical and operational requirements for the feedback mechanism under the gateway, which may apply to NAPs if integrated into the SDG ecosystem.
    links:
