      Full Name: Commission Implementing Regulation (EU) 2024/2690 of 17 October 2024 laying down rules for the application of Directive (EU) 2022/2555 as regards technical and methodological requirements of cybersecurity risk-management measures and further specification of the cases in which an incident is considered to be significant
      
      Link: https://eur-lex.europa.eu/eli/reg_impl/2024/2690/oj
      
      Description: This implementing regulation makes the risk-management obligations of NIS2 concrete for a defined set of digital entities, among them cloud computing and data centre services, managed service providers, online marketplaces and providers of online platforms. Its Annex sets out the technical and methodological requirements in detail — security policy, risk treatment, incident handling, business continuity, supply chain security, access control, cryptography, asset management and human resources security — and it specifies the thresholds at which an incident becomes significant and therefore notifiable.
      
      Additional details: Where L12 states the obligations in general terms, this act states what actually has to be implemented and when an incident must be reported. It is written for entities in the digital infrastructure sector, which is the classification a NAP operator most often falls under, so in practice its Annex is the checklist against which a NAP’s security posture will be assessed. Two points bear on the architecture. Many of the requirements are organisational rather than technical — documented policy, assigned roles, tested procedures — so they belong in the Organisational View and not only in the Physical one. And the significance thresholds have a design consequence: to report an incident within the NIS2 deadlines a NAP must already be able to detect and measure service disruption, which makes monitoring and logging requirements derived from this act rather than operational preferences.
      
      Related Documents:
      
      	- Directive (EU) 2022/2555 – NIS2 – The parent directive (L12), which this act implements.
      	- ENISA Technical Implementation Guidance – Maps each requirement of the Annex to concrete controls and to existing standards.
