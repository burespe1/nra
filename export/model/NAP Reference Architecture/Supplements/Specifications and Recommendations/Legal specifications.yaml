      Full Name: Regulation (EU) 2018/1724 of the European Parliament and of the Council of 2 October 2018 establishing a single digital gateway to provide access to information, to procedures and to assistance and problem-solving services and amending Regulation (EU) No 1024/2012
      
      Link: https://eur-lex.europa.eu/eli/reg/2018/1724/oj
      
      Consolidated version: https://eur-lex.europa.eu/eli/reg/2018/1724/2025-01-19
      
      Description: Regulation (EU) 2018/1724, known as the Single Digital Gateway (SDG) Regulation, requires EU Member States to make essential public information and administrative procedures available online through the Your Europe portal. Citizens and businesses moving, working, or operating across borders must be able to find relevant rules, complete procedures digitally, and access assistance services — all from a single entry point, in at least two EU languages. The regulation introduces the once-only principle: public administrations must not require citizens or businesses to resubmit data already held by another authority. Instead, data should be exchanged automatically between administrations via the Once-Only Technical System (OOTS). For National Access Points (NAPs) operated by public authorities, the SDG Regulation has direct implications. NAPs serving cross-border users must meet the regulation's standards for accessibility (including WCAG compliance), multilingual availability, and findability. More broadly, the once-only principle supports a federated data publishing model: transport datasets published on the NAP under ITS delegated regulations should not need to be duplicated on separate national open data portals — instead, open data portals can harvest metadata directly from the NAP.
      
      Additional details: The regulation has been amended four times since adoption: by the Data Governance Act (Regulation (EU) 2022/868), the Critical Raw Materials Act (Regulation (EU) 2024/1252), the Net-Zero Industry Act (Regulation (EU) 2024/1735), and Regulation (EU) 2024/3228 on the discontinuation of the ODR platform. The Digital Omnibus proposal (COM(2025)837) proposes further amendments. The practical implication for NAP operators is twofold. First, where the NAP is a public-facing digital platform, it must comply with SDG quality requirements: information must be accurate, up-to-date, clearly structured, and available in the national language plus at least one other EU language. Second, the federated publishing model enabled by the once-only principle means that transport datasets published via the NAP under ITS delegated regulations should not be duplicated on separate open data portals. Instead, Member States should ensure that open data portals reference or harvest metadata from the NAP, avoiding inconsistency while meeting obligations under both the ITS Directive and the Open Data Directive.
      
      Related Documents:
      
      	- Your Europe Portal – The operational interface of the Single Digital Gateway, which may link to or integrate with national portals like NAPs for transport-related procedures.
      	- Commission Implementing Regulation (EU) 2020/1121 – Sets out rules on the collection and sharing of user statistics and feedback on gateway services. Relevant for NAP operators as it defines how user satisfaction and service quality are monitored across gateway-connected portals.
      	- Commission Implementing Regulation (EU) 2022/1463 – Defines the technical and operational specifications for the Once-Only Technical System (OOTS), enabling cross-border automated exchange of evidence between public authorities. Relevant for NAPs pursuing federated data publishing models where transport datasets are published once and accessed across portals without duplication.
