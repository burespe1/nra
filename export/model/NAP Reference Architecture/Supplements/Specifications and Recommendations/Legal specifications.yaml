      Full Name: Commission Delegated Regulation (EU) 2017/1926 of 31 May 2017 supplementing Directive 2010/40/EU of the European Parliament and of the Council with regard to the provision of EU-wide multimodal travel information services.
      
      Link: https://eur-lex.europa.eu/eli/reg_del/2017/1926/oj
      
      Consolidated version: https://eur-lex.europa.eu/eli/reg_del/2017/1926/2024-03-04
      
      Amending version: https://eur-lex.europa.eu/eli/reg_del/2024/490/oj
      
      Description: Delegated Regulation (EU) 2017/1926 establishes the specifications for the provision of EU-wide multimodal travel information services (MMTIS). The regulation aims to ensure that static and dynamic travel and traffic data from various transport modes (road, rail, air, maritime, etc.) are made accessible in a harmonised, interoperable, and machine-readable format to support seamless multimodal journey planning across the EU.
      National Access Points (NAPs) are the designated platforms for publishing and accessing the datasets required under this regulation. MMTIS data providers—such as transport operators, authorities, and infrastructure managers—must make their data available via the NAP in accordance with the technical and organisational requirements set out in the regulation. This includes metadata, data formats, update frequencies, and accessibility conditions. NAPs thus serve as the core infrastructure for enabling compliance and interoperability under MMTIS.
      The amendment expands the scope of mandatory data accessibility for EU-wide multimodal travel information services (MMTIS). It introduces new obligations for the availability of dynamic, historic, and observed datasets, and strengthens requirements for data quality, update frequency, and interoperability. The amendment supports the European Green Deal and Sustainable and Smart Mobility Strategy by enhancing the usability of multimodal travel services and enabling better integration of active modes (e.g. walking, cycling) and real-time operational data.
      
      Additional details: NAPs must ensure machine-readable access to newly mandated datasets, including dynamic data (e.g. delays, disruptions), historic performance data, and observed occupancy levels. The regulation reinforces the use of harmonised formats and metadata, and requires service providers to maintain data accuracy and timeliness. The amendment also introduces provisions for monitoring compliance and supporting cross-border continuity of MMTIS services.
      
      Related Documents:
      
      	- Multimodal Travel Information – European Commission explanation of MMTIS implementation
      	- Delegated Regulation (EU) 2024/490 – Amends and updates the original 2017/1926 regulation, refining data categories, deadlines, and technical specifications for MMTIS implementation.
      	- MMTIS Implementation Handbook (2024) – A non-binding guidance document published by the European Commission to support Member States and stakeholders in applying the regulation. It includes practical examples, timelines, and FAQs.
      	- INSPIRE-MMTIS Technical Report (JRC, 2019) – Analyses overlaps between MMTIS and the INSPIRE Directive, offering recommendations on harmonising geospatial and transport data standards in the NAP context
      	- DATEX II Recommended Reference Profiles for MMTIS – Defines the minimum set of data elements required for compliant multimodal travel information exchange under Delegated Regulation 2017/1926, covering Level of Service 1 and 2 data categories including disruptions, real-time status, and alternative fuels infrastructure availability.
      	- NeTEx European Passenger Information Profile (EPIP) – Defines the subset of NeTEx (CEN/TS 16614) elements required for compliance with MMTIS obligations, including static, dynamic, and accessibility-related data.
      	- NAPCORE MMTIS Data Dictionary (NeTEx/SIRI Mapping) – Provides alignment between MMTIS data categories and NeTEx/SIRI elements, supporting harmonised implementation across Member States.
      	- DATA4PT National Implementations — NeTEx Profiles Overview — Inventory of national and transnational NeTEx and SIRI profiles across EU Member States. It outlines profile alignment with the European Passenger Information Profile (EPIP) and categorises data coverage by Level of Service (LOS) in accordance with MMTIS Delegated Regulation (EU) 2024/490.
