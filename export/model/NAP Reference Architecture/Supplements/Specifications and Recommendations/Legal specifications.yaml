      Full Name: Commission Delegated Regulation (EU) 2022/1012 of 7 April 2022 supplementing Regulation (EC) No 561/2006 of the European Parliament and of the Council with regard to the establishment of standards detailing the level of service and security of safe and secure parking areas and to the procedures for their certification
      
      Link: https://eur-lex.europa.eu/eli/reg_del/2022/1012/oj
      
      Description: This delegated regulation defines what a safe and secure parking area is. It sets four security levels and four service levels, states the facilities and measures required at each, and lays down the procedure by which an area is certified against them by an accredited body. Its legal base is the driving-time regulation (EC) No 561/2006, not the ITS Directive.
      
      Additional details: This act is in the catalogue because it determines the content of data a NAP already publishes, even though it places no obligation on the NAP itself. Delegated Regulation (EU) No 885/2013 (L3) requires safe and secure truck parking data to be made available through the NAP; this act is what the security and service level values in that data mean, and it is the source of the certification status a consumer will expect to find alongside them. For the architecture the consequence is a vocabulary one: the levels and the certification state are defined terms with a legal meaning, so a NAP that carries free-text equivalents instead of the defined values produces data that cannot be compared across Member States. A second consequence is temporal — certification expires and has to be renewed, so a record of a certified parking area has a validity period, which a NAP publishing static parking data has to be able to express.
      
      Related Documents:
      
      	- Commission Delegated Regulation (EU) No 885/2013 – SSTP – The act requiring the data to be published through the NAP (L3).
      	- Regulation (EC) No 561/2006 – driving times and rest periods – The parent act; the reason the parking standards exist at all.
