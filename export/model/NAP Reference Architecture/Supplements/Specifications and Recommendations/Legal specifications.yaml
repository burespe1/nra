      Full Name: Commission Implementing Regulation (EU) 2026/253 of 6 February 2026 on a technical specification relating to the telematics subsystem of the rail system in the European Union for interoperability of data sharing in rail transport (TEL TSI)
      
      Link: https://eur-lex.europa.eu/eli/reg_impl/2026/253/oj
      
      Description: This regulation establishes a technical specification for interoperability (TSI) relating to the telematics subsystem, covering both passenger and freight services. It supports non-discriminatory and transparent data sharing in the rail sector, based on the EU rules set out in Regulation (EU) 2023/2854 (Data Act). It repeals and replaces the previously separate TAP TSI (Commission Regulation (EU) No 454/2011) and TAF TSI (Commission Regulation (EU) No 1305/2014) with a single unified framework. It specifies the data format to be used, based on a common ontology (the 'ERA Ontology'), as well as requirements in terms of data quality, cybersecurity and data use. Encouraging paperless freight transport and aligning with Regulation (EU) 2020/1056 (eFTI), this TSI also sets out requirements for the electronic consignment note (eCN) to replace paper-based documents.
      
      Additional details: For passengers, the TSI requires that journey planning, passenger information and ticketing data be made publicly available, free of charge, via the National Access Points established under MMTIS Delegated Regulation (EU) 2017/1926. Such data include timetables, connection times, conditions of carriage, station accessibility, real-time and forecast train positions, train composition and historical records. For freight, the regulation establishes requirements for capacity management, traffic management, train preparation, and intermodal logistics data exchange. ERA is designated as system authority for the digitalisation of rail communications, with a clear compliance framework. NAP operators must ensure interface compatibility with TEL TSI data formats and the ERA Ontology when exposing or aggregating rail data. Transition dates are phased: key passenger data provisions apply from December 2026, with capacity and traffic management requirements following by December 2027.
      
      Related Documents:
      
      	- ERA Telematics Applications TSI Portal — Official source for implementation guidance, Organisation Codes, message schemas, and compliance information. Replaces the former separate TAP TSI and TAF TSI portal pages.
      	- Commission news release — 10 February 2026 — Summary of the adopted implementing regulation, its objectives, and the legislative package context.
      	- TAP/TAF Reference Data Portal — Central management system for Organisation Codes (formerly RICS codes) and location codes required under the regulation. Note: from 1 January 2026, all railway actors must use the new 4-character alphanumeric Organisation Code assigned by ERA.
      	- Commission Regulation (EU) No 454/2011 (TAP TSI) — Repealed by this regulation. Historical reference only.
      	- Commission Regulation (EU) No 1305/2014 (TAF TSI) — Repealed by this regulation. Historical reference only.
      	- ERA Organisation Codes and TAF/TAP reference files (teleref.era.europa.eu) — The ERA register from which the 4-character alphanumeric Organisation Codes are assigned and published.
      	- Regulation (EU) 2023/2854 (Data Act) — The horizontal EU data-sharing rules on which the TEL TSI data-sharing obligations are built.
      	- ERA Ontology — The RDF vocabulary this regulation mandates as the data format for rail; it has its own entry in the technical section.
