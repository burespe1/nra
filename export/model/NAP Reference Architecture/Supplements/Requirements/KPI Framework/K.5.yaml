    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 1
    tags:
      "Requirement Category": ""
    note: |
      The platform shall have a provision for high-level description of datasets including metadata element for indicating the used data standard/model.
      
      Source: KPI 5.1 Documentation & description of datasets
    links:
      - "Association «fulfilled by» → Metadata Management Module"  # {4E09E0E5-83C4-4a96-AF53-E93EDADCCEC3} → {4C1A7740-ADB9-4654-9703-57AC92DD6D54}
  - name: "K.5.2.1 Classification of datasets"
