elements:
  - name: "K.5.1.1 Description of datasets"
    guid: "{DEAE1C7A-1D84-41ec-8301-E4726F387B6F}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall have a provision for high-level description of datasets including metadata element for indicating the used data standard/model.
      
      Source: KPI 5.1 Documentation & description of datasets
    links:
      - "Association «fulfilled by» → Metadata Management Module"  # {4E09E0E5-83C4-4a96-AF53-E93EDADCCEC3} → {4C1A7740-ADB9-4654-9703-57AC92DD6D54}
  - name: "K.5.1.2 Supporting documentation of datasets"
    guid: "{DE8AB201-E709-40fe-A6A2-9892B270EF1A}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 1
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall have a provision for adding or linking of XML schemas and samples of data being made accessible.
      
      Source: KPI 5.1 Documentation & description of datasets
    links:
      - "Association «fulfilled by» → Metadata Management Module"  # {4813B2B3-E0E5-42c7-8767-E9076E8886A5} → {4C1A7740-ADB9-4654-9703-57AC92DD6D54}
  - name: "K.5.2.1 Classification of datasets"
    guid: "{83214B25-55CB-415c-B142-439C41EEF164}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 2
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall provide a classification of datasets based at least on formal terminology/keywords (vocabulary of the mobility-DCAT-AP) or coordinated metadata catalogues.
      
      Source: KPI 5.2 Classification of datasets
    links:
      - "Association «fulfilled by» → Metadata Management Module"  # {407DBB2A-BE5B-4b19-A5DC-B9AEBE83B466} → {4C1A7740-ADB9-4654-9703-57AC92DD6D54}
  - name: "K.5.3.1 Metadata field for Quality description"
    guid: "{E96E06AA-18A0-425d-8F5C-761F449E798C}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 3
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall provide a metadata field where the data provider can describe the quality of the dataset.
      
      Source: KPI 5.3 Quality indicators for datasets
    links:
      - "Association «fulfilled by» → Metadata Management Module"  # {1EA2364E-6FE8-4641-A5A1-A5649345F16C} → {4C1A7740-ADB9-4654-9703-57AC92DD6D54}
  - name: "K.5.3.2 Reference field for used quality guidline or framework"
    guid: "{1CDE79DF-156A-4d61-8DFD-C16F5D60B752}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 4
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall provide a reference to applicable quality frameworks (e.g. EU-EIP and or NAPCORE) to support the data provider in quality assessment of the dataset.
      
      Source: KPI 5.3 Quality indicators for datasets
    links:
      - "Association «fulfilled by» → Metadata Management Module"  # {EE98B216-0FC6-4df7-9D5E-73384F8A6811} → {4C1A7740-ADB9-4654-9703-57AC92DD6D54}
  - name: "K.5.4.1 Data visualization"
    guid: "{AB431EDD-73E8-43c9-A219-2232A1745A55}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 5
    tags:
      "Requirement Category": ""
      "revised": "2026-10-20"
    note: |
      The platform shall support at least one of following data visualization:
      
      	- Visualization of numbers and charts derived from data records
      	- Visualization of data on a map (may include location points, lines or areas)
      	- Visualization can use animation of “a” or “b” options above, e.g., an animation or video for a time series of a selected period
      
      
      Source: KPI 5.4 Data visualization
    links:
      - "Association «fulfilled by» → Data Platform NAP"  # {756B02EB-4FA2-4f39-9C99-5AC936B2BD62} → {E5881292-2F25-4bc1-8840-23C9D1CC23A4}
  - name: "K.5.5.1 Metadata Visualization"
    guid: "{EA7E8A92-7AF9-4f91-A12A-44E1091AC517}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 6
    tags:
      "Requirement Category": ""
      "revised": "2026-10-20"
    note: |
      The platform shall support at least one of the following metadata visualization:
      
      	- Visualization of numbers and charts derived from metadata records e.g. information/news about datasets
      	- Visualization of metadata on a map (may include location points, lines or areas)
      
      
      Source: KPI 5.5 Metadata visualization
    links:
      - "Association «fulfilled by» → Metadata Directory NAP"  # {2410F23C-0E5E-4fe3-B3E0-EC3AD39DF863} → {1B971F1C-E2FC-46e2-97A3-CCB248436727}
