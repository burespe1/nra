  - name: "K.1.10.1 providers verification"
    guid: "{3F00CF71-2F41-413b-BAA8-CAF56CF80F39}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 8
    tags:
      "Requirement Category": ""
      "revised": "2026-10-20"
    note: |
      The platform shall support the self-authentication of data providers (e.g., via e-mail) and at least one of the following authentication methods:
      a. Authentication of data providers is double checked, i.e., by the data provider and by the NAP operator (e.g., via checking a state registry of legal bodies)
      b. Usage of two-factor authentication and/or ID certificate (e.g., self-logging with secure national ID)
      
      
      Source: KPI 1.10 Security – providers verification
