      - "Association «fulfilled by» → User Management Module"  # {2A812791-E104-48ac-8F64-7726B3F550EF} → {83B61A0E-1086-4216-B72F-38DA9E185D9B}
  - name: "K.1.16.1 Indication of data modification"
    guid: "{0D51A185-39DD-41c0-AFC9-4FFC32EE8D97}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 14
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      At least one change/modification information about the data shall be provided:
      a. Webserver uses “Last updated date and/or time” information (e.g., the DATEX XML includes the “publication time” which shows when the dataset has been updated)
      b. NAP data interface uses If-Modified-Since header in conditional HTTP requests or timestamp parameters in API requests
      c. NAP data interface uses If-None-Match (etag) header in conditional HTTP requests or custom tokens parameters in API requests
      d. Webserver uses some other method for data modification indication (please specify the method used in the “Suggestions” box)
      
      Source: KPI 1.16 Indication of provided data modification
  - name: "K.1.17.1 Data transfer optimization"
    guid: "{025CAF43-3430-4650-B487-6B6AAF7E6C50}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 15
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The data platform shall provide (un)compressed data per clients' request in one of the following ways:
      
      	- Data is (or can be) provided compressed in a transport layer as negotiated between client and server via the HTTP Accept-Encoding header or via tailored API request
      	- Data is (or can be) provided compressed in an application layer as selected by the user when subscribing (e.g., in ZIP packages)
      	- Data can be provided in a differential form, i.e., new data only and/or changes to the previous state where a relevant date/time/period can be set by the user
      
      
      Source: KPI 1.17 Data transfer optimization
    links:
      - "Association «fulfilled by» → F3.6.8 Manage Data Input"  # {5CF53285-368E-4812-AC63-EEF1B517FCFC} → {5B4F357F-A164-4a3f-8909-C370F4C0615F}
