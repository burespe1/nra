  - name: "K.1.5.1 Simplicity / Usability"
    guid: "{19537BDF-1852-45b1-A148-C47A90792691}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 4
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The data set/metadata information shall be accessible in average with less then 10 operations (e.g., key presses, mouse wheel movements, mouse/screen clicks).
      
      KPI 1.5 Web performance – simplicity / usability
    links:
