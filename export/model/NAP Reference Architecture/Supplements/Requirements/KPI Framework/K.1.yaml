  - name: "K.1.7.1 Consistency and Navigability"
    guid: "{4B3700B3-CF65-470c-83D9-B0FB0A7D7E69}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 5
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall follow at least 3 of the below defined usability rules:
      a. Menus are in the same position
      b. Use of same fonts and colours throughout the site
      c. Availability of a search box on the main page (search means for navigation along the webpage and no data discovery)
      d. Logo links back to the home page
      e. Existence of a hierarchical arrangement of web subpages (“breadcrumbs” type also means hierarchical arrangement)
      f. Existence of a “sitemap” page easing navigation (e.g., a tree structure with links to individual pages)
      
      Source: KPI 1.7 Web performance – Consistency and navigability
    links:
