  - name: "K.1.14.1 Authentication and security mechanisms for data upload"
    guid: "{28E122D6-8DA1-4746-BA9B-01CEDB73BF9C}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 12
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall support security and/or authentication mechanisms for data uploading (e.g., to ensure the trust in the data or restrict the access to the NAP)
      At least 2 security mechanisms shall be in place to ensure the trust in the data or restrict the access for your platform:
      a. Transport security (HTTPS)
      b. Authentication by IP filter (access based on IP address of the provider)
      c. Basic authentication according to RFC 7617 (https://tools.ietf.org/html/rfc7617)
      d. Digest authentication according to RFC 7616 (https://tools.ietf.org/html/rfc7616)
      e. Authentication by URL parameters
      f. Authentication by client certificates (private keys, API-keys, certificates, incl. EU-wide common user authentication mechanism)
      g. Authentication by tokens (e.g., Bearer token – digitally signed JWT – OAuth 2.0)
      
      
      Source: KPI 1.14 Authentication and security mechanisms for data upload
    links:
      - "Association «fulfilled by» → Data Management Module"  # {BFFA3A27-6DCB-4514-A5CB-D80062A8758A} → {919C23BB-5FFF-4300-A416-F084AB9FE538}
      - "Association «fulfilled by» → User Management Module"  # {107A40A4-C19B-4446-B221-F94C880A16E4} → {83B61A0E-1086-4216-B72F-38DA9E185D9B}
  - name: "K.1.15.1 Data security and access restrictions for data downloading"
