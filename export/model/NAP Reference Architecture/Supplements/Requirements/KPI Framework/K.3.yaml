elements:
  - name: "K.3.1.1 Free-text search"
    guid: "{4CE86A2C-C410-439b-AFFD-9793CCF8B41E}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall provide at least free-text search to find a datasets (e.g. considering text in title, description or in other metadata elements).
      
      Source: KPI 3.1 Free-text search
    links:
      - "Association «fulfilled by» → F3.6.4 Manage Metadata Retrieval"  # {4286AC1E-060E-43ef-909E-616AEA475CBC} → {2F2393E9-9A59-4344-A2C0-207945E7F438}
  - name: "K.3.2.1 filtering options"
    guid: "{3EDFD1C1-DFC2-44f5-B31C-F85FBB99684A}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    keywords: "Requirement"
    status: "Proposed"
    version: "1.0"
    order: 1
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall support at least 2 of these search filtering options:
      
      	- Delegated Regulation
      	- Transport mode / category
      	- Data provider (organisation)
      	- data format, data model
      	- data profile
      	- type of interface or access option
      	- license type
      	- temporal validity
      	- other (please specify in the “Suggestions” box)
      
      
      Source: KPI 3.2 filtering options
    links:
      - "Association «fulfilled by» → F3.6.4 Manage Metadata Retrieval"  # {B3A94854-5FE1-46d9-921B-5A9FCBE8CE01} → {2F2393E9-9A59-4344-A2C0-207945E7F438}
