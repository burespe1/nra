  - name: "K.2.9.1 Monitoring and evaluation"
    guid: "{1B5911BF-D7A2-4e07-A4CE-4DC33E7E5C26}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 6
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall monitor and evaluate the success and impact of the NAP, by using at least one of following options:
      
      	- Counting the access to the NAP, the number of search requests and/or the number of registered users
      	- Collecting statistics on the consumption of datasets (e.g., downloads, subscriptions, page views)
      	- Measuring performance of the system (e.g., downtime, consequences for other systems, etc.)
      	- Measuring usefulness of the NAP (e.g., qualitative feedback on re-use, rating of quality, surveys, etc.)
      
      
      source: KPI 2.9 Monitoring and evaluation
