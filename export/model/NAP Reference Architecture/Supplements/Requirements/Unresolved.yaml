  - name: "NAP as critical infrastructure"
    guid: "{037F8E03-319D-4b87-A355-4744DCC160F7}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      If the Member State defines the NAP as critical infrastructure according to NIS II, the platform has to fulfill the requirements according to NIS II regulation.
      
      Source: L12 Directive (EU) 2022/2555 - NIS2
    links:
      - "Association → Revision needed in NAPCORE"  # {91F87F5F-5387-4ffb-9EB4-E5C152E473BD} → {9227DA58-B8A6-419f-BB56-A90F3950CF28}
  - name: "K.2.2.1 Related services monitoring functionality"
    guid: "{57A18050-B4C1-42f9-881F-A8C6AE3EAF1A}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 1
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall track the use of the data available at the NAP either based on the user feedback or by using a tool.
      
      Source: KPI 2.2 Related services monitoring process
  - name: "K.2.7.1 Mass notifications – data providers"
    guid: "{1F17B282-6DF7-4368-8BF9-EB565BA7D4D5}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 4
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall provide Mass notifications to registered providers in at least one of the following ways:
      
      	- Mass notifications are possible for legal (T&C) updates
      	- Mass notifications are tailored according to the data provider's needs, e.g. new requirements for data provision like data profile
      	- Mass notifications are available on the NAP website to the registered data providers, e.g., pop-up information after logging in
      
      
      
      source: KPI 2.7 Mass notifications – data providers
  - name: "K5.4.1 Data visualization"
    guid: "{AB431EDD-73E8-43c9-A219-2232A1745A55}"
    type: "Requirement"
    stereotype: "FRAME_Requirement"
    status: "Proposed"
    version: "1.0"
    order: 4
    tags:
      "Requirement Category": ""
      "revised": "2025-07-04"
    note: |
      The platform shall support at least one of following data visualization:
      
      	- Visualization of numbers and charts derived from data records
      	- Visualization of data on a map (may include location points, lines or areas)
      	- Visualization can use animation of “a” or “b” options above, e.g., an animation or video for a time series of a selected period
      
      
      Source: KPI 5.4 Data visualization
