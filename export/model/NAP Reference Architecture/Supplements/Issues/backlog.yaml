  - name: "FV: Functionality to be processed into NRA - FROM 2023"
    guid: "{631D9702-F36C-495f-9D8B-8B778A056921}"
    type: "Issue"
    status: "Proposed"
    version: "1.5.1"
    order: 0
    note: |
      *************************************************************
      ** This is a list of proposed functionalities to be incorporated into NRA ***
      **************************************************************
      NOTE: when checked / incorporated => delete.
      ===========
      
      **Should have contact form for NAP operator and data provider**
      Element type: High level function
      Source: KPI2.1 & NAP functionalities survey – Provide NAP User Support FAQ, Questions & Answers – Q2
      *Description*
      This is the ability to provide a contact form specifically designed for NAP operators and data service providers. This can be achieved by incorporating a dedicated contact form feature into the NAP which will serve as a communication channel between the NAP actors. This functionality promotes the efficient and direct interaction as well as operates as a valuable feedback mechanism since data and service providers can provide suggestions, recommendations, or feedback.
      *Requirement List*
      
      	- A user-friendly contact form interface shall be provided through the NAP.
      	- The contact form shall include a dropdown menu to categorize the subject of the communication (e.g., technical issue, data updates).
      	- The contact form shall allow data providers to attach files, documents, or supporting materials.
      	- Neither data and service providers nor NAP operators shall not be able to submit a form in case that all required fields are populated
      
      
      **Provide online platform.**
      Element type: High level function
      *Description*
      The first element of the function view relates to the property of a technical interface to be online accessible by means of a website. This website shall be compatible with the latest and widely used web browsing technologies that are supported by the latest and widely used operating systems. Beyond that, the website shall provide a satisfactory user experience in terms of simplicity & usability, visual hierarchy & navigability, as well as consistency. Simplicity & usability, in the NAP context, can be addressed as the number of actions that shall be performed by a user to access information about an accommodated data resource (i.e., metadata of this data resource). Visual hierarchy and navigability, in general but also in the NAP context, expresses the necessity for the structure of the website to follow a hierarchical pattern as well as the existence of a control page easing user navigation. Lastly, consistency implies the need for the platform’s website to provide menus in the same position, use the same or at least compatible fonts and colours, and provide shortcuts for commonly used functions. Moreover, there are two additional good practices that shall be respected. Firstly, the website shall be responsive irrespective of the device that is utilized for gaining access. Secondly, the content of the website shall be provided in both the national and a universally used language (English) to mitigate any cross-border accessibility barriers.
      *References*
      
      	- WG2.1 - NAP Levels of Service computation using KPI Framework – KPI 1.1
      	- M2.1_Typology of NAPs based on the description of levels of service and assessment of associated costs and benefits 1.4.docx
      
      *List of requirements*
      
      	- https://rupprechtconsultde.sharepoint.com/:w:/r/sites/NAPCOREallpartners/_layouts/15/Doc.aspx?sourcedoc={5FD2C477-C0FC-45DF-BB7B-3031A024CA73}&file=M2.1_Typology of NAPs based on the description of levels of service and assessment of associated costs and benefits 1.4.docx&_DSL=1&action=default&mobileredirect=trueStandards
      	- W3C standards on “Web Design and Applications”
      	- W3C standards on “Web of Devices”
      	- W3C standards on “Web of Devices”
      	- W3C standards on “Browsers and Authoring Tools”
      
      
      **Provide metadata to consumer.**
      Source: KPI1.13
      Element type: High level function
      *Description*
      The ability to provide information about data to the potential subscriber. i.e. type, name, description, purpose, geographical relevance, format, type of protocol, licence, contact to data provider, etc. With this information the user shall be able to fully assess the relevancy of the data for his/her purpose and prepare the systems for the data consumption.
      Metadata provided in a human readable form vie standard web portal interface.
      *References*
      MD-DCAT-AP – Standardized and harmonized DCAT Profile for mobility data provided by SWG4.4
      *List of requirements*
      
      	- Metadata shall include change history of Metadate (KPI 1.16) obligatory.
      	- Include Links to external resources even static or dynamic.
      	- Shall be machine readable (KPI 3.3)
      	- Shall include a high-level description (KPI 5,1)
      	- Shall include supporting materials [e.g. schema] (KPI 5,1)
      	- Meta Data description shall provide specific terms and conditions for reuse (KPI 7.2)
      	- Meta Data description shall provide indication of related Delegated Regulation (KPI 7.6)
      	- Meta Data description shall provide a description of data quality (KPI 7.7)
      
      
      **Provide access management for data consumer.**
      Source: KPI1.13
      Element type: High level function
      *Description*
      The ability to provide possibility for the user to log in, create his username and password and to store personal information. Manage access to different resources STORED on the platform based on the user rights. Provide possibility to the platform admin to change this data, provide possibility to communicate with the user through the platform.
      
      **Store Meta Data**
      Element type: High level function
      Source: NAP functionalities survey – Provide storage – Q1
      *Description*
      The ability to store metadata (data descriptions), at least based on the mobility-DCAT-AP (result of SWG 4.4), online in a machine-readable format. This can be achieved by using an appropriate metadata storage system, such as a meta-database. NAP meta-database is fed through a data and service providers’ interface. Meta-data records should comply to certain quality criteria and be accessible and retrievable by querying and searching services. By that means, NAP users can narrow down their search to specific datasets or links that conform to specified criteria. Moreover, NAP content becomes discoverable and accessible in an efficient manner by allowing users to focus on the relevant subset of data, rather than searching through large volumes of unorganized information.
      *List of requirements*
      
      	- Metadata shall be stored in a database.
      	- Metadata records shall be provided through a data and service providers’ interface.
      	- Metadata records shall be accessible and retrievable by querying and searching services.
      	- Metadata versioning: Metadata shall be versioned, allowing data and service providers to track changes and updates made to the metadata over time.
      	- Metadata formats: Metadata shall be stored in standardized machine-readable formats to ensure interoperability and compatibility.
      	- Access restrictions: Metadata shall be publicly accessible without a necessary registration.
      	- Editing rights: Only authorized data and service providers should have access to modify metadata.
      
      *References*
      
      	- mobility-DCAT-AP – Standardized and harmonized DCAT Profile for mobility data provided by SWG4.4
      
      *Standards*
      
      	- Actual: Coordinated Meta Data catalogue
      	- Future: mobility-DCAT-AP
      
      
      **NAPs should have publisher registration**
      Element type: High level function
      Source: NAP functionalities survey – Publisher Management – Q1
      *Description*
      The obligation of data and service providers to register, in order to be able to publish datasets. Data and service providers can register through a dedicated interface. Provided information and active credentials are stored in a database. This functionality facilitates authentication processes and implies a controlled access approach. Through that approach, the trustworthiness of published datasets is safeguarded.
      *Requirement list*
      
      	- The publications of datasets shall be possible only by registered users.
      	- A dedicated interface shall enable the registration of data and service providers (publishers).
      	- Guidelines shall be provided to NAP users as regards (a) how to get registered and (b) how to publish a dataset.
      
      
      **Automated basic quality checks**
      Element type: High level function
      Source: NAP functionalities survey – Metadata quality checks – Q1
      *Description*
      The ability to check the completeness of provided metadata. This can be achieved through an automated process by setting as mandatory metadata fields that are defined as such within the mobility-DCAT-AP specification. By that means, inconsistencies affecting the understandability of published datasets can be avoided. It may be beneficial from an accuracy point of view if the metadata provision interface provides where possible prespecified values (e.g., if a metadata field is related to relevant DR, it is preferable to enable service and data providers to choose the relevant DR from a dropdown list).
      *Requirement List*
      
      	- Metadata shall include mandatory fields.
      	- Data and service providers shall not be able to publish a dataset in case that all required metadata fields are populated.
      
      *References*
      
      	- mobility-DCAT-AP – Standardized and harmonized DCAT Profile for mobility data provided by SWG4.4
      
      
      
      **Should have contact form for NAP operator and data provider**
      Element type: High level function
      Source: KPI2.1 & NAP functionalities survey – Provide NAP User Support FAQ, Questions & Answers – Q2
      *Description*
      This is the ability to provide a contact form specifically designed for NAP operators and data service providers. This can be achieved by incorporating a dedicated contact form feature into the NAP which will serve as a communication channel between the NAP actors. This functionality promotes the efficient and direct interaction as well as operates as a valuable feedback mechanism since data and service providers can provide suggestions, recommendations, or feedback.
      *Requirement List*
      
      	- A user-friendly contact form interface shall be provided through the NAP.
      	- The contact form shall include a dropdown menu to categorize the subject of the communication (e.g., technical issue, data updates).
      	- The contact form shall allow data providers to attach files, documents, or supporting materials.
      	- Neither data and service providers nor NAP operators shall not be able to submit a form in case that all required fields are populated.
      
      
      **Provider Registration**
      Element type: High level function
      Source: KPI1.10 & FRAME F3.6.2 – Provide NAP User Support FAQ, Questions & Answers – Q2
      *Description*
      This is the ability to provide a registration form specifically designed for NAP operators and data providers. This can be achieved by incorporating a dedicated contact form feature into the NAP which will serve as a communication channel between the NAP actors. This functionality promotes the efficient and direct interaction as well as operates as a valuable feedback mechanism since data and service providers can provide suggestions, recommendations, or feedback.
      *Requirement List*
      
      	- A provider authenticity has to be verified.
      	- A provider identify shall be GDPR compliant.
      	- The contact form shall allow data providers to attach files, documents, or supporting materials.
      
      Neither data and service providers nor NAP operators shall not be able to submit a form in case that all required fields are populated
