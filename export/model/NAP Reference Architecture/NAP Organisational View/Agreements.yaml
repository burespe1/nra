      - "Association «adheres to» → Member State (MS)"  # {E0E0CFB0-F8C4-4c70-8B23-930F206ECE02} → {6F6F2869-325C-42f0-BF2D-A1998A4C3C70}
  - name: "National Law or Contract (MS to NO)"
    guid: "{832264BF-9750-421b-9BFF-C77CE32FA053}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    keywords: "Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Parties: Member State (MS) and NAP Operator (NO).
      
      Objective: Setting up the framework and responsibilities of the NAP operation.
      
      Form: National law implementing the ITS Directive and direct execution of EU Regulations and Delegated Acts or a contract for nonessential parts of the NO duty.
      
      Obligations:
      > MS to NO: ---
      > NO to MS:
      
      	- To allow CPs to register their metadata at NAP and to check the quality thereof.
      	- To provide appropriate discovery services to NAP users (i.e. Content Consumers (CC)).
      	- Report to the MS about the NAP usage statistics related to the ITS directive implementation for the progress reporting of the MS to EC.
      	- To allow the CA/NB to access stored information about the CPs at the NAP.
      	- To provide a feedback mechanism to allow CC and CP cooperation on reporting and resolving any inaccuracies.
      	- To cooperate with CA/NB on the ITS directive implementation.
      
      
      Reference to the EU law:
      The obligations of the NO are related to the following laws:
      
      	- national law transposing 2010/40/EU (ITS Directive)
      	- 886/2013 (SRTI)
      	- 885/2013 (SSTP)
      	- 2017/1926 (MMTIS)
      	- 2022/670 (RTTI in force from 1. January 2025)
      	- 2024/490 (MMTIS amendment)
      	- national law transposing 2023/2661 (ITS Directive amendment)
      
      
      Selected references to the law:
      
      	- National Access Points shall provide appropriate discovery services to users [2022/670 art. 3].
