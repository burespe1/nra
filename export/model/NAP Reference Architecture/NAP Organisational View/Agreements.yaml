  - name: "Metadata provision contract (NO to CP)"
    guid: "{BEED600A-C5D2-4829-9BF5-6E6649CB3D14}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    keywords: "Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Parties: NAP operator (NO) and Content Provider (CP).
      
      Objective: To set up terms under which the metadata content provided to the NAP can be used. Set up obligations and responsibilities of the NAP towards the CP, that are not dealt with by the law.
      
      Form: Contract, terms of conditions, license.
      
      Obligations:
      > CP to NO:
      
      	- To provide the right to reuse the metadata including consensually provided personal information.
      	- To provide accurate, timely, and complete metadata.
      
      
      > NO to CP:
      
      	- To assist in publishing (meta)data to the NAP
      	- To communicate to CP any provided metadata insufficiency, that, as a consequence, results in not publishing or removing published datasets.
      	- To ensure CP that the provided metadata, data/services are not tampered with by the NAP in any manner.
      
      
      NOTE: The obligations to the CP, coming from the EU or national law, are part of the “Agreement” between MS and CP.
      
      Reference to the EU law:
      NONE
