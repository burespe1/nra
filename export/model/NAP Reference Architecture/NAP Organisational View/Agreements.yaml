      - "Association «adheres to» → Member State (MS)"  # {0F7F15F5-0720-43ea-B61D-65884FEA72C6} → {6F6F2869-325C-42f0-BF2D-A1998A4C3C70}
  - name: "European or national law (MS to CC)"
    guid: "{C7C1A638-F3DE-4b70-9BD0-F24DB573079A}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    keywords: "Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Parties: Member State (MS) and selected Content Consumer (CC); Only digital map producers, service providers, and broadcasters are relevant Content Consumers for this "agreement".
      
      Objective: To identify CCs and set up obligations of the CCs.
      
      Form: National law implementing the ITS Directive and direct execution of EU Regulations and Delegated Acts.
      
      Obligations:
      > MS to CC: ---
      > CC to MS (EC):
      
      	- To report to the content provider (CP) any inaccuracies related to the data without delay
      	- To include any traffic circulation plans and traffic regulations and restrictions, temporary traffic management measures developed by the competent authorities, and made accessible via NAP, in the service. [Service providers]
      	- When presenting information to end users, processes relevant data updates on infrastructure, regulations, and restrictions [digital map producers], data updates on the state of the network / the real-time use of the network within a timeframe fitting to the reliable and effective use of the data in real-time traffic information services. [service providers]
      	- To provide SRTI information service to ensure the widest reach of end users concerned, where possible free of charge to end users.
      
      
      Reference to the EU law:
      The obligations of the CC are related to the following laws:
      
      	- National law transposing 2010/40/EU (ITS Directive)
      	- 886/2013 (SRTI)
      	- 2022/670 (RTTI in force from 1. January 2025)
      	- National law transposing 2023/2661 (ITS Directive update)
      
      
      Selected references to the law:
      
      	- Data users using the data referred to in paragraph 1 and data holders shall collaborate in order to ensure that any inaccuracies related to the data are signalled without delay to the data holder from which the data originates. [2022/670, Art 4, par 3; Art 5, par 3; Art 6, par 3]
      	- Service providers shall process and include, without additional costs to the end-user, in the relevant services they provide, any traffic circulation plans and traffic regulations and restrictions / temporary traffic management measures developed by the competent authorities and made accessible via the national or common access point in a digital machine-readable format. [2022/670, Art 5, par 4, Art 6, par 4]
      	- When digital map producers and service providers present information to end users, they shall ensure that relevant data updates on infrastructure / on regulations and restrictions are processed within a timeframe fitting to the reliable and effective use of the data in real-time traffic information services. [2022/670, Art 8, par 4, Art 9, par 4]
      	- When service providers present information to end users, they shall ensure that relevant data updates on the state of the network / the real-time use of the network are processed within a timeframe fitting to the reliable and effective use of the data in real-time traffic information services. [2022/670, Art 10, par 5, Art 11, par 3]
      	- The accessibility and regular update of data by road authorities and road operators are essential for enabling the production of up-to-date and accurate digital maps that are a key asset for reliable ITS applications. The digital map producers should be encouraged to integrate relevant data updates into their existing map and map update services in a timely manner. In order to comply with public policies such as road safety, service providers and digital map producers should collaborate with public authorities to correct inaccuracies in their data. [2022/670, preamble, 15]
      	- The information service shall fulfil the following conditions: [2013/886 Art. 8, par 2]
      (a) it shall be provided in such a way as to ensure the widest reach of end users concerned by the given event or condition referred to in Article 3;
      (b) it shall be made available by public and/or private road operators and/or service providers and/or broadcasters dedicated to traffic information, where possible free of charge to end users.
    links:
      - "Association «adheres to» → Member State (MS)"  # {78812407-1D34-408f-A5F5-64A7D44D0184} → {6F6F2869-325C-42f0-BF2D-A1998A4C3C70}
      - "Association «adheres to» → NAP Content Consumer (CC)"  # {1EF25969-71EB-40a8-B349-A9F0E36138C9} → {D6B4B664-6BE7-4041-8FFE-448812935D1D}
  - name: "European or national law (MS to CP)"
    guid: "{E3368E4F-07D4-4e14-9043-DE0ED31E471E}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    keywords: "Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Parties: Member State (MS) and Content Provider (CP).
      
      Objective: To identify Content Providers (CPs) and establish their legal obligations.
      
      Form: National Law transposing the ITS Directive and direct execution of EU Regulations including Regulations, Delegated Regulations and Implementing Regulations.
      
      Obligations:
      > MS to CP: ---
      > CP to MS:
      
      	- Ensure that data is available in the correct format and under fair, reasonable, and non-discriminatory (FRAND) conditions via the NAP.
      	- Provide the required information about data/services, including access, reuse conditions and quality related information to the NAP.
      	- Provide data /services compliant with the EU requirements and be available for the compliance assessment upon request and provide additional documentation if required.
      	- Provide self-declaration(s) to the NAP and/or CA/NB.
      	- Ensure that required data is updated at the appropriate and recommended time intervals.
      
      
      Reference to the EU law:
      The obligations of the CP are related to the following laws:
      
      	- National law transposing 2010/40/EU (ITS Directive)
      	- National law transposing 2023/2661 (ITS Directive amendment)
      	- Delegated Regulation 886/2013 (SRTI)
      	- Delegated Regulation 885/2013 (SSTP)
      	- Delegated Regulation 2017/1926 (MMTIS)
      	- Delegated Regulation 2022/670 (RTTI in force from 1. January 2025)
      	- Regulation 2023/1804 (AFIR)
      	- Implementing Regulation 2026/253 (TEL-TSI)
      	- Delegated Regulation 2024/490 (MMTIS amendment)
      
      
      Selected references to the law:
      
      	- For the sole purposes of providing the information service, public and private road operators and/or service providers shall set up or use the means to detect events or identify conditions and shall collect the relevant road safety-related traffic data. The deployment of these means shall comply with the conditions and requirements set out in national law. [886/2013, art. 6].
      	- Public and/or private road operators and/or service providers shall share and exchange the data they collect pursuant to art. 6 of DR 886/2013. For that purpose, they shall make these data available in the DATEX II (CEN/TS 16157) format or any fully compatible and interoperable with DATEX II machine-readable format through an access point [886/2013, art. 7].
      	- Public or private parking operators and service providers shall share, and exchange data referred to in paragraph 1 of art. 4 of DR 885/2013. For these purposes, they shall use DATEX II (CEN/TS 16157) format or any DATEX II compatible international machine-readable format. Data shall be accessible for exchange and reuse by any public or private information service provider and/or parking operator on a non-discriminatory basis and in accordance with access rights and procedures defined in Directive 2003/98/EC [885/2013 art. 5].
      	- Road authorities and road operators, in cooperation with digital map producers and service providers (any public or private provider of a real-time traffic information service, excluding a mere conveyer of information, to users and end-users), shall ensure that they provide the appropriate metadata in order to allow users to discover and use the datasets to which access is provided through the national access points [2022/670 art. 3].
      	- The travel and traffic data listed in the Annex and the corresponding metadata including information on the quality thereof shall be accessible for exchange and reuse within the Union on a non-discriminatory basis, via the national access point set up in accordance with Article 3 and within a timeframe allowing reliable and effective reuse of the data. Such data shall be accurate and up to date and based on minimum data quality requirements [2024/490 art. 8].
      	- The data referred to in paragraph 1 and the corresponding metadata including information on the quality thereof shall be accessible for exchange and re-use by any data user within the Union:
      (a) on a non-discriminatory [2022/670, art. 4, par 2, art. 5, par 2]
      (b) on a non-discriminatory basis when provided by road authorities and road operators; [2022/670, art. 6 par 2, art. 7, par 2]
      (c) following minimum quality requirements that Member States shall agree upon in cooperation with relevant stakeholders;
      (d) within a timeframe fitting to the reliable and effective use of the data to create real-time traffic information;
      (e) via the national or common access point referred to in Article 3;
      	- Competent Authority / National Body (CA/NB) may request from the data holders and travel information service providers the following documents: [2024/490 art. 9]
      1 a description of the travel and traffic data accessible via the national access point, the information on the quality thereof and the conditions of reuse of that data;
      2 a description of the travel information services available including connections with other services where applicable;
      3 an evidence-based declaration of compliance with the requirements set out in Delegated Regulations;
      4 the licence or contractual agreements with travel information service providers.
