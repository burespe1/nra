      - "Association «adheres to» → NAP Operator (NO)"  # {41381CDE-1247-4a32-A6DF-D8325BACA468} → {234C8914-6D8F-43fd-B3A7-34118A92FBA3}
  - name: "Privacy agreement (CC to NO) and general terms and conditions"
    guid: "{AF555DF2-4535-42f6-993A-5BE72947BD12}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    keywords: "Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Parties: NAP operator (NO) and Content Consumer (CC)
      
      Objective: To set up terms and conditions under which CC could access and reuse the (meta)data published and the obligations of the NO towards the CC, that are not dealt with by the law.
      
      Form: Terms and conditions, license.
      
      Obligations:
      > NO to CC:
      
      	- To inform about the best effort to publish up-to-date and accurate (meta)data about content providers (CP) and their data at the NAP.
      	- To reject responsibility for the published data by CPs.
      	- If subscribed: to notify CC about any outages and, optionally, additions to the NAP. NO must ensure that personal data is not misused, General Data Protection Regulation (GDPR) and to whom can it be disclosed. NO must provide the CC the right to delete the account on the NAP.
      
      
      > CC to NO:
      
      	- To reuse the (meta)data shared by NAP according to the terms and conditions.
      
      
      Reference to the EU law:
      NONE
    links:
      - "Association «adheres to» → NAP Operator (NO)"  # {430E1EB7-02B5-4d49-8AF6-C4FD58A23670} → {234C8914-6D8F-43fd-B3A7-34118A92FBA3}
