  - name: "EU Legal Framework (EC to MS)"
    guid: "{D91DD8AD-EAF3-4d4d-97EC-2668B2AFB9EC}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    keywords: "Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Parties: European Commission (EC) and Member State (MS).
      
      Objective: To set up obligations of the MS towards the EC and of the national stakeholders.
      
      Form: the ITS Directive and Delegated Regulations
      
      Obligations:
      > EC to MS: ---
      > MS to EC:
      
      	- To implement of EU Directives into a national law, that reaches the goals set in the ITS Directive, and direct execution of EU Regulations and Delegated Acts including an enforcement process.
      	- To periodically report of the progress on the achievement of the goals established in the ITS Directive (and its delegated regulations).
      	- To establish the NAP Operator (NO), in the national law; either delegate its establishment to a responsible ministry or directly state the party responsible for NAP operation.
      	- To establish the Competent Authority / National Body (CA/NB) in the national law; either delegate its establishment to a responsible ministry or directly state the party responsible for CA/NB operation; create a legal framework for its operation.
      	- To ensure compliance with the obligations laid down in EU and national legislation.
      	- To establish a legal obligation in national law for ITS service providers to use only ITS components that comply with the specifications set out in EU delegated acts and to provide ITS services in a manner consistent with those specifications
      	- To support the EU’s goals under the Alternative Fuels Infrastructure Regulation (AFIR) – European commitment to energy transition and sustainable mobility.
      	- To support of accessibility of AFIR-data by establishing procedures to (a) regularly monitor compliance of the data and information on the APIs (at NAP), (b) facilitate the exchange of information between operators or owners of publicly accessible recharging points and refuelling points and their NAPs and (c) address widespread and persistent data quality issues, including issues affecting the overall automated and uniform data exchange via APIs through their NAPs.
      
      
      Reference to the EU law:
      The obligations of the MS are related to the following European laws:
      
      	- 2010/40/EU (ITS Directive)
      	- 886/2013 (SRTI)
      	- 885/2013 (SSTP)
      	- 2017/1926 (MMTIS)
      	- 2022/670 (RTTI in force from 1. January 2025)
      	- 2023/2661 (ITS Directive amendment)
      	- 2024/490 (MMTIS amendment)
      	- 2023/1804 (AFIR)
      
      
      Selected references to the law:
      
      	- Each Member State shall set up a National Access Point [2015/962 art. 3, 2017/1926 art. 3, 2022/670 art. 3].
    links:
