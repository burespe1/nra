    note: |
      Parties: Member State (MS) and Competent Authority / National Body (CA/NB).
      
      Objective: Setting up the framework and responsibilities of the CA/NB operation.
      
      Form: National law implementing the ITS Directive and direct execution of EU Regulations and Delegated Acts or a contract for nonessential parts of the CA/NB duty.
      
      Obligations:
      > MS to CA/NB: ---
      > CA/NB to MS:
      
      	- To identify relevant stakeholders (CPs) that are obliged to make data accessible via NAP.
      	- To periodically and randomly assess the compliance of the Content Providers (CP) with the Law.
      	- To provide information about the performed compliance assessment to the MS and to NO.
      	- To cooperate with NO on the ITS directive implementation.
