      - "Association «adheres to» → NAP Content Provider (CP)"  # {DB667461-2B0C-4b6a-909E-4BE50F2A2C22} → {0BAD153C-6775-4495-9098-8C8115DD8867}
  - name: "IT-operation contract (NO to NIT)"
    guid: "{A4F1EAAE-9BC4-407b-BD46-63A87F19C315}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    keywords: "Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      Parties: NAP operator (NO) and NAP IT Provider (NIT).
      
      Objective: To set up terms under which the NIT manages the IT infrastructure (level of service), that are not dealt with by the law.
      
      Form: Contract, service level agreement.
      
      Obligations:
      > NO to NIT:
      
      	- To set up maintenance requirements
      
      
      > NIT to NO:
      
      	- To operate the NAP IT infrastructure under specific conditions of availability and security given by the service level agreement.
      	- To respond to an incident in a proper response time given by the service level agreement.
      	- To regularly report IT usage and NAP operation to the NO.
      	- To agree on liability, confidentiality and termination.
    links:
