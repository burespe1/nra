package: "NAP Reference Architecture/NAP Organisational View/Agreements"
guid: "{AC628A41-4BD9-486c-B5B8-7B9ABAF28C40}"
alias: "Agreements"
version: "1.0"
note: |
  This chapter defines Agreements between Actors in Organisational View, irrespective of the NAP type.
elements:
  - name: "Collaboration Agreement (CA/NB to NO)"
    guid: "{0B562BCC-408D-4b46-9039-5A275BDFDD86}"
    type: "Collaboration"
    stereotype: "FRAME_Agreement"
    keywords: "Agreement"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Parties: Competent Authority / National Body (CA/NB) and NAP Operator (NO).
      
      Objective: To address all possible issues CA/NB might have towards the NO, that are not dealt with by the law.
      
      Form: National law, Collaboration agreement, memorandum of understanding.
      
      Obligations:
      > CA/NB to NO:
      
      	- To provide information about the performed audit (assessment) to the NO.
      	- To be compliant with any GDPR rules (as they are stated between NO and CP).
      
      
      > NO to CA/NB:
      
      	- To fully disclose all received information/evidence to the CA/NB assisting in the assessment process.
      
      
      Reference to the EU law:
      NONE
