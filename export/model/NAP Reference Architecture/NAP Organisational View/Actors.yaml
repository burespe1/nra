package: "NAP Reference Architecture/NAP Organisational View/Actors"
guid: "{6A10582A-DB0D-4ec1-91B4-48C9FD9D7F5B}"
alias: "Actors"
version: "1.0"
note: |
  This chapter defines Actors interacting with the NAP in Organizational View, irrespective of the NAP type.
elements:
  - name: "Competent Authority / National Body"
    guid: "{B4E9C168-C4F3-4026-B334-9511627C14AC}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    keywords: "Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      A Competent Authority / National Body is an impartial and independent public or private entity designated by a Member State to monitor and report to the MS the operation of the National Access Point and to verify compliance of the Content Providers (CPs) with the requirements established by the ITS Directive and its Delegated Regulations, including the prescribed availability and accessibility, format, and quality requirements for data and services made accessible through the National Access Point.
      
      Note: The term National Body can be used interchangeably with Competent Authority, but it carries an additional requirement of impartiality and independence for the organisation towards Service Providers, public and private Road Operators, Parking Operators and Broadcasters. The term National Body remains valid in current legislation.
      
      Represented by:
      Usually, a Member State department of the Ministry of Transport. The Competent Authority / National Body assignment shall be formalised through explicit designation in national law. Can also be represented by a private entity assigned by and cooperating with the government body
    links:
      - "Abstraction «is Type of» → Competent Authority / National Body"  # {B77330A7-30F9-4348-AD41-1C78FB74E173} → {60AC1314-7147-4d43-89C6-2CD3B26BDEBE}
  - name: "Content Consumer"
    guid: "{0E811D0A-2C79-462f-B560-DD0A48A6E545}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    keywords: "Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Public or private entity that accesses, retrieves, or uses data or information made accessible through the National Access Point for the purpose of developing services, applications, or analyses.
      
      NOTE1: Content Consumer includes the terms Data User, Data Consumer and Data Recipient terms as specified in EU legal acts.
      
      Content Consumer actor represents and fulfils the interests of the Content Consumer Stakeholder.
      
      Represented by:
      
      	- Road authorities
      	- Public or private road operators
      	- Traffic managers
      	- Tolling operators
      	- Service providers
      	- Broadcasters dedicated to traffic information
      	- Transport authorities
      	- Transport operators
      	- Travel information service providers
      	- Digital map producers
      	- Transport on-demand service providers
      	- Infrastructure managers
      	- Data users, any public or private entity or any other entity using data accessible via NAP.
    links:
      - "Abstraction «is Type of» → Content Consumer"  # {CE250A94-50C3-4082-A073-5ADA4F4062DA} → {77E9CEBA-B991-4860-A6D3-952CAD1B776E}
  - name: "Content Provider"
    guid: "{3F2BCF06-A0E6-4aac-BD7A-3395E43C395B}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    keywords: "Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Public or private entity that supplies content (e.g., data, metadata, documents) to the National Access Point, making it available for reuse in accordance with the requirements of the EU legal acts and National Laws.
      
      NOTE1: Content Provider includes the Data Holder, Data Provider, Service Provider terms as specified in EU legal acts.
      
      Content Provider actor represents and fulfils the interests of the Content Provider Stakeholders.
      
      Represented by:
      
      	- Automotive industries (when acting as service providers)
      	- Broadcasters dedicated to traffic information
      	- Holders of in vehicle generated data
      	- Infrastructure managers
      	- Operators of publicly accessible recharging points
      	- Operators of publicly accessible refuelling points
      	- Owners of recharging/refuelling infrastructure
      	- Public or private parking operators
      	- Public or private road operators
      	- Recharging and refuelling related stakeholders
      	- Road authorities
      	- Service providers*
      	- Tolling operators
      	- Transport authorities
      	- Transport operators
      	- Transport on demand service providers
      	- Travel information service providers
      
      
      For the RTTI (2022/670) concerning:
      
      	- data on infrastructure: road authorities, public or private road operator/s, tolling operators, recharging and refuelling-related stakeholders
      	- data on regulations and restrictions: road authorities, public or private road operator/s, tolling operators
      	- data on the state of the network: road authorities, public or private road operator/s, holders of in-vehicle generated data, service providers*
      	- data on the real-time use of the network: road authorities, public or private road operator/s, holders of in-vehicle generated data, service providers*, recharging and refuelling-related stakeholders
      
      
      * ‘service provider’ means any public or private provider of a real-time traffic information service, excluding a mere conveyer of data-to-data users;
      
      For the SRTI (886/2013) concerning:
      
      	- road safety-related traffic data: Service providers, public and/or private road operators, broadcasters dedicated to traffic information, and automotive industries (as service providers when processing vehicle data) [886/2013, art. 7]
      
      
      For the SSTP (885/2013) concerning:
      
      	- static and dynamic information related to safe and secure parking: public or private parking operators and service providers (any public or private body that provides the information service to users) [885/2013 art. 5]
      
      
      For the AFIR (2023/1804) concerning:
      
      	- static and dynamic information related to alternative fuel infrastructure: operators of publicly accessible recharging points and refuelling points for alternative fuels, or, under the arrangements between them, the owners
      
      
      For the MMTIS (2017/1926 amended by 2024/490) concerning:
      
      	- static, historic and observed travel and traffic data: transport authorities, transport operators, infrastructure managers, transport on demand service providers
      	- dynamic travel and traffic data: see above
      	- linking travel information services: travel information service provider
    links:
      - "Abstraction «is Type of» → Content Provider"  # {6713994B-EE24-4267-951F-331B46283827} → {4D7E0B7A-7D34-400b-AE00-68E04F93B7BA}
  - name: "European Commission"
    guid: "{142DFBFF-40C1-4f03-A7A7-E5125A5DE9FE}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    keywords: "Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      European Union’s main executive body, responsible for proposing legislation, its publication, upholding EU treaties and ensuring Member States apply EU law and policies.
      
      European Commission actor represents and fulfils the interests of the European Commission Stakeholder.
      
      Represented by:
      The European Commission.
    links:
      - "Abstraction «is Type of» → European Commission"  # {D25C0173-B953-4d03-9869-C45A656FC8AB} → {26DD1383-1637-4356-B2EF-7671DCA5C5BC}
  - name: "Member State"
    guid: "{28852F78-1BF6-4858-8E67-E45CF403D4E7}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    keywords: "Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      European Union country responsible for the application and transposition of ITS-related EU laws and the creation of the national legal framework for the operation of the NAP and its surrounding entities.
      
      Member State actor represents and fulfils the interests of the Member State Stakeholder.
      
      Represented by:
      Usually, the MS through the Ministry responsible for the transport area.
    links:
      - "Abstraction «is Type of» → Member State"  # {BDED0935-D7D2-4ea3-A61B-2C699E88A9C5} → {2DC22194-A127-42ba-9AEA-E8CBDD2EC795}
  - name: "NAP Operator"
    guid: "{B0B3260D-C376-4e8f-A620-72BC71353D5D}"
    type: "Actor"
    stereotype: "FRAME_Actor"
    keywords: "Actor"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "revised": "2026-10-20"
    note: |
      Public or private entity designated to manage, maintain and operate the National Access Point, ensuring the accessibility of data and that the NAP functions in line with the requirements of the applicable EU legal acts, further specified in national legislation or governance documents.
      
      The National Access Point (NAP) Actor represents and fulfils the interests of the National Access Point (NAP) Stakeholder.
      
      Represented by:
      Usually, a department of the Member State’s ministry responsible for transport, a state-owned organisation, or a research institution acts as NAP Operator. The organisation fulfilling this role is generally designated explicitly in national legislation or related governance documents.
    links:
      - "Abstraction «is Type of» → NAP Operator"  # {1DF4BB96-2848-4dee-AF41-9340F2D054B0} → {4B4D9772-CCE6-459c-B5E0-80E3C5C32674}
