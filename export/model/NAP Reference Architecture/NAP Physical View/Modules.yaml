  - name: "Metadata Quality Check Module"
    guid: "{B9BC9F94-BAF8-465c-A024-66944F4C302E}"
    type: "Object"
    stereotype: "FRAME_Application"
    keywords: "Module"
    status: "Proposed"
    order: 0
    tags:
      "App_Environment": ""
    note: |
      This Module periodically and initially checks the quality of provided metadata. The main tests performed are the availability of provided links and structural and contextual soundness based on predefined criteria. The results of the check are stored in the NAP Metadata store.
