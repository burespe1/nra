    stereotype: "FRAME_Application"
    keywords: "Module"
    status: "Proposed"
    version: "1.0"
    order: 0
    tags:
      "App_Environment": ""
    note: |
      This Module enables and supports the periodical and initial checking of published data quality. Main tests performed are schema validation and availability of provided data against the metadata information. The results of the check are stored in NAP Data store.
