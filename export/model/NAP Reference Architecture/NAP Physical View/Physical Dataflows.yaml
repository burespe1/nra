    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      This Physical Data Flow facilitates metadata exchange between Metadata Management Module and metadata Provision System. This exchange concerns inputs from the Metadata Provision System with new or updated data objects, requiring authorisation credentials.
    links:
      - "Association «use» → Machine Metadata Provision"  # {A882EB72-EB69-4e54-B517-9192FEBEFB02} → {70F2112F-B845-4d29-AECD-17CD9D7B4B7D}
  - name: "Metadata to Content Consumer"
    guid: "{C25F8BCA-DCD4-4894-956E-40D0218D3ACA}"
    type: "Interface"
    stereotype: "FRAME_Physical_Data_Flow"
    keywords: "Physical Data Flow"
    status: "Proposed"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      This Physical Data Flow facilitates information exchange between NAP Content Consumer and NAP Metadata Management Module. This exchange concerns search requests sent by the NAP Content Consumer and search results returned by the NAP Metadata Management Module.
    links:
      - "Association «use» → Content Consumer Metadata Access"  # {43DDC7B5-F1E7-4970-85D5-289B915EA998} → {ECF5445C-50A8-4ca3-8C86-50DB480DBD8C}
  - name: "Metadata to Requesting System"
    guid: "{5681386B-AB60-4a6c-B51B-4BD4F745FDD5}"
