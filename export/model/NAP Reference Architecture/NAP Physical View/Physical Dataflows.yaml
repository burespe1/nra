    stereotype: "FRAME_Physical_Data_Flow"
    keywords: "Physical Data Flow"
    status: "Proposed"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      This Physical Data Flow facilitates information exchange between Metadata Requesting System and NAP Metadata Management Module. This exchange concerns search requests sent by the Metadata Requesting System and search results returned by the NAP Metadata Management Module.
    links:
      - "Association «use» → Machine Metadata Access"  # {70951161-14B0-4d80-B37F-C971B307A2D3} → {373128AD-1078-42bc-A0B2-F5E56522B7B8}
  - name: "Support of Content Consumer"
    guid: "{0B43348A-F713-49fe-A684-A88D53A58D67}"
    type: "Interface"
    stereotype: "FRAME_Physical_Data_Flow"
    keywords: "Physical Data Flow"
    status: "Proposed"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      This Physical Data Flow facilitates information exchange between Support (ticket) Module and Content Consumer. This exchange concerns support requests sent by the Content Consumer and handled by the Support (ticket) Module.
    links:
      - "Association «use» → Content Consumer Support"  # {14898744-5376-41b9-A924-61FD910DDFFA} → {9D010BE5-6592-4e26-86F6-6D16140A0A39}
  - name: "Support of Content Provider"
    guid: "{BA985F0C-2C6F-4329-BABC-91890CC23954}"
    type: "Interface"
    stereotype: "FRAME_Physical_Data_Flow"
    keywords: "Physical Data Flow"
    status: "Proposed"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      This Physical Data Flow facilitates information exchange between Support (ticket) Module and Content Provider. This exchange concerns support requests sent by the Content Provider and handled by the Support (ticket) Module.
    links:
      - "Association «use» → Content Provider Support"  # {A792BB90-9FC7-4f1d-8C6B-9D56AEA6351E} → {2B49F77B-92D8-4494-B75B-7482740303ED}
  - name: "User Management of Content Provider"
    guid: "{C5A68539-7FA7-4245-9B3A-F55B6668B579}"
    type: "Interface"
    stereotype: "FRAME_Physical_Data_Flow"
    keywords: "Physical Data Flow"
    status: "Proposed"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      This Physical Data Flow facilitates information exchange between Content Provider and User Management Module. This exchange concerns user registration requests.
    links:
      - "Association «use» → Content Provider Management"  # {4FA1CE67-8DBC-47e7-A002-065873A1C146} → {D137DB55-A2D0-4a62-9A98-6144AC1C5404}
      - "Usage → User Management Module"  # {7E9FF617-F7D6-43b5-977D-B0DFA5B3571E} → {83B61A0E-1086-4216-B72F-38DA9E185D9B}
  - name: "User and Data Management"
    guid: "{5C212D22-87C8-423c-A4EE-D4FACC7598C7}"
    type: "Interface"
    stereotype: "FRAME_Physical_Data_Flow"
    keywords: "Physical Data Flow"
    status: "Proposed"
    order: 0
    tags:
      "revised": "2025-07-04"
    note: |
      This Physical Data Flow facilitates information exchange between User Management and Data Management modules. This exchange concerns credentials of a NAP Content Provider or Data Providing System, which are checked against the NAP Users data store to authorize the claimant to insert or modify data records in the NAP Data store. They also provide information about the validity of these authorization credentials.
