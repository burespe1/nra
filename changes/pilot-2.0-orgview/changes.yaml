  - guid: "{AF555DF2-4535-42f6-993A-5BE72947BD12}"
    kind: element
    object: "Privacy agreement (CC to NO) and general terms and conditions"
    type: "Agreement"
    change: "editorial description change"
    apply: true
    similarity: "1.0"
    authors: ["Änderung"]
    note_new: |-
      <b>Parties</b>: NAP operator (NO) and Content Consumer (CC)
      <b>Objective</b>: To set up terms and conditions under which CC could access and reuse the (meta)data published and the obligations of the NO towards the CC, that are not dealt with by the law.
      <b>Form</b>: Terms and conditions, license.
      <b>Obligations:</b>
      &gt; NO to CC:
      <ul>
      	<li>To inform about the best effort to publish up-to-date and accurate (meta)data about content providers (CP) and their data at the NAP.</li>
      	<li>To reject responsibility for the published data by CPs.</li>
      	<li>If subscribed: to notify CC about any outages and, optionally, additions to the NAP. NO must ensure that personal data is not misused, General Data Protection Regulation (GDPR) and to whom can it be disclosed. NO must provide the CC the right to delete the account on the NAP.</li>
      </ul>
      &gt; CC to NO:
      <ul>
      	<li>To reuse the (meta)data shared by NAP according to the terms and conditions.</li>
      </ul>
      
      <b>Reference to the EU law: </b>
      NONE
