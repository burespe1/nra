changes:
  - guid: "{553E5112-EC18-4bfe-9402-D55E876DA206}"
    kind: package
    object: "NAP Organisational View"
    type: ""
    change: "package description change"
    apply: true
    note_new: |-
      The Organisational View provides information about the Actors, their Roles and responsibilities, and relationships between roles in terms of lawful or contractual relationships. It also depicts the processes relevant to the ITS deployment (owns, plans, maintains, deploys, implements, tenders, …).
      The View consists of <b>Actors</b> assuming one or more <b>Roles</b>, the <b>Agreements</b> between the Roles, and their relations to the <b>Components</b> and <b>Modules</b>.
      In the NAP Reference Architecture, the main Actors are the European Commission, the Member State, the Competent Authority/National Body, the NAP Operator, the NAP IT Provider, the NAP Content Provider, and the NAP Content Consumer. The Organisational View describes the responsibilities, obligations and the typical representatives of each role. It also describes the lawful obligations of these roles, modelled as relationships between the law-making Roles (European Commission and Member State) and the other Roles. It further outlines the expected content of contractual relationships between the Roles.
      
      <b>IMPORTANT</b>: All lawful obligations come from the policy maker Roles (EC and MS) towards other Roles. Contracts between two non-policy-making roles do not repeat obligations already defined by law.
    - comment: "CA/NB vs NB/CA"  # Sara Linhas 2026-06-05
      # reply Bures, Petr: yes we will change it in the picture to CA/NB.
      # reply Bures, Petr: model...
  - guid: "{0E811D0A-2C79-462f-B560-DD0A48A6E545}"
    kind: element
    object: "Content Consumer"
    type: "Actor"
    change: "substantive description change"
    apply: true
    similarity: "0.23"
    authors: ["Änderung"]
    note_new: |-
      Public or private entity that accesses, retrieves, or uses data or information made accessible through the National Access Point for the purpose of developing services, applications, or analyses.
      
      <b>NOTE1: </b>
      Content Consumer includes the terms Data User, Data Consumer and Data Recipient terms as specified in EU legal acts.
      
      Content Consumer actor represents and fulfils the interests of the Content Consumer Stakeholder.
      
      <b>Represented by:</b>
      <ul>
      	<li>Road authorities</li>
      	<li>Public or private road operators</li>
      	<li>Traffic managers</li>
      	<li>Tolling operators</li>
      	<li>Service providers</li>
      	<li>Broadcasters dedicated to traffic information</li>
      	<li>Transport authorities</li>
      	<li>Transport operators</li>
      	<li>Travel information service providers</li>
      	<li>Digital map producers</li>
      	<li>Transport on-demand service providers</li>
      	<li>Infrastructure managers</li>
      	<li>Data users, any public or private entity or any other entity using data accessible via NAP.</li>
      </ul>
  - guid: "{3F2BCF06-A0E6-4aac-BD7A-3395E43C395B}"
    kind: element
    object: "Content Provider"
    type: "Actor"
    change: "substantive description change"
    apply: true
    similarity: "0.76"
    authors: ["Änderung"]
    note_new: |-
      Public or private entity that supplies content (e.g., data, metadata, documents) to the
      National Access Point, making it available for reuse in accordance with the requirements of the EU legal acts and National Laws.
      
      <b>NOTE1: </b>
      Content Provider includes the Data Holder, Data Provider, Service Provider terms as specified in EU legal acts.
      
      Content Provider actor represents and fulfils the interests of the Content Provider Stakeholders.
      
      <b>Represented by:</b>
      <ul>
      	<li>Automotive industries (when acting as service providers)</li>
      	<li>Broadcasters dedicated to traffic information</li>
      	<li>Holders of in vehicle generated data</li>
      	<li>Infrastructure managers</li>
      	<li>Operators of publicly accessible recharging points</li>
      	<li>Operators of publicly accessible refuelling points</li>
      	<li>Owners of recharging/refuelling infrastructure</li>
      	<li>Public or private parking operators</li>
      	<li>Public or private road operators</li>
      	<li>Recharging and refuelling related stakeholders</li>
      	<li>Road authorities</li>
      	<li>Service providers*</li>
      	<li>Tolling operators</li>
      	<li>Transport authorities</li>
      	<li>Transport operators</li>
      	<li>Transport on demand service providers</li>
      	<li>Travel information service providers</li>
      </ul>
      
      For the RTTI (2022/670) concerning:
      <ul>
      	<li><b>data on infrastructure</b>: road authorities, public or private road operator/s, tolling operators, recharging and refuelling-related stakeholders</li>
      	<li><b>data on regulations and restrictions</b>: road authorities, public or private road operator/s, tolling operators</li>
      	<li><b>data on the state of the network</b>: road authorities, public or private road operator/s, holders of in-vehicle generated data, service providers*</li>
      	<li><b>data on the real-time use of the network</b>: road authorities, public or private road operator/s, holders of in-vehicle generated data, service providers*, recharging and refuelling-related stakeholders</li>
      </ul>
      
      * ‘service provider’ means any public or private provider of a real-time traffic information service, excluding a mere conveyer of data-to-data users;
      
      For the SRTI (886/2013) concerning:
      <ul>
      	<li><b>road safety-related traffic data</b>: Service providers, public and/or private road operators, broadcasters dedicated to traffic information, and automotive industries (as service providers when processing vehicle data) [886/2013, art. 7]</li>
      </ul>
      
      For the SSTP (885/2013) concerning:
      <ul>
      	<li><b>static and dynamic information related to safe and secure parking</b>: public or private parking operators and service providers (any public or private body that provides the information service to users) [885/2013 art. 5]</li>
      </ul>
      
      For the AFIR (2023/1804) concerning:
      <ul>
      	<li><b>static and dynamic information related to alternative fuel infrastructure</b>: operators of publicly accessible recharging points and refuelling points for alternative fuels, or, under the arrangements between them, the owners</li>
      </ul>
      
      For the MMTIS (2017/1926 amended by 2024/490) concerning:
      <ul>
      	<li><b>static, historic and observed travel and traffic data</b>: transport authorities, transport operators, infrastructure managers, transport on demand service providers</li>
      	<li><b>dynamic travel and traffic data</b>: see above</li>
      	<li><b>linking travel information services</b>: travel information service provider</li>
      </ul>
